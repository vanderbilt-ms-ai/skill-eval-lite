<!doctype html>
<html lang="en">

<title>Skill Eval Lite</title>
<!--
  Skill Eval Lite: the wizard. Five steps from an experiment file to results:
  load the intake, freeze it, bring in the runner's outputs, judge blind
  pairs, and read the results (with the controls) and export them. It opens
  on Getting started: each path through Skill Eval Lite, one action per step,
  each with its picture (drawn by the <script id="diagrams"> block, which
  dev/diagrams.mjs also uses to write docs/diagrams/*.svg).
  Made for AI 5500 (Vanderbilt, Fall 2026). Its first version was a
  prototype written by Claude (claude-opus-5-5) for the course; this file
  copies that prototype's code and extends it to load the runner's bundles.
  Two designers make the files on screen, one question at a time: the
  experiment designer (Shared I: experiments/<name>/ with experiment.toml,
  rounds/ and prompts/) and the suite designer (Personal I: a packet with
  suites.yaml and its folders). They save straight into a folder the student
  picks where the browser can (the File System Access API), or as a ZIP (a
  small store-only writer below), and check the file as run_ab.py's check and
  suite --check do, in the same words. An assistant's folder is only read.
  They start from the class experiment, a demonstration or Personal I's
  worked example, embedded below by dev/embed_examples.py.
  One file, no network requests, no model calls. State is kept in this
  browser's storage (key skill-eval-lite:v1); Reset clears it. Each designer
  keeps its design under its own key (skill-eval-lite:designer:*), cleared by
  its own Start over.
  The practice outputs embedded below are MADE UP: written by hand, no
  model was called.
-->
<style>
/* Colour tokens: light, and dark below. */
:root {
  --truth: #1D6CB0; --bias: #C9561B; --null: #7A4FA8; --param: #1C7C6E; --ink: #16212B;
  --noise: #7A8791; --ok: #1F7D55; --warn: #9A6A0C; --paper: #F4F4EF;
  --bias-text: #B24A12; --null-text: #7A4FA8; --param-text: #187062; --ok-text: #1A6E4A; --warn-text: #85590A; --truth-text: #1D6CB0;
  --truth-wash: rgba(29,108,176,.12); --bias-wash: rgba(201,86,27,.12); --null-wash: rgba(122,79,168,.12);
  --param-wash: rgba(28,124,110,.14); --ok-wash: rgba(31,125,85,.12); --warn-wash: rgba(154,106,12,.13); --noise-wash: rgba(122,135,145,.18);
  --sheet: #FFFFFF; --sheet-2: #F8F8F4; --ink-2: #45515B; --ink-3: #5F6A73; --rule: #D9DAD2; --rule-2: #E9EAE3;
  --shadow: 0 1px 2px rgba(22,33,43,.05), 0 4px 18px rgba(22,33,43,.05);
  --shadow-pop: 0 2px 6px rgba(22,33,43,.08), 0 18px 48px rgba(22,33,43,.18);
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --tw-bg: #1E2A33; --tw-bar: #2B3945; --tw-edge: #13202A;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --truth: #5BA6E8; --bias: #F0844B; --null: #B494DE; --param: #4CC0AE; --ink: #E2E8EE; --noise: #8E9BA5; --ok: #4CC08B; --warn: #E2AE4A; --paper: #0D1318;
  --truth-text: #5BA6E8; --bias-text: #F0844B; --null-text: #B494DE; --param-text: #4CC0AE; --ok-text: #4CC08B; --warn-text: #E2AE4A;
  --truth-wash: rgba(91,166,232,.16); --bias-wash: rgba(240,132,75,.15); --null-wash: rgba(180,148,222,.15);
  --param-wash: rgba(76,192,174,.16); --ok-wash: rgba(76,192,139,.14); --warn-wash: rgba(226,174,74,.14); --noise-wash: rgba(142,155,165,.2);
  --sheet: #141C23; --sheet-2: #18222A; --ink-2: #A7B4BF; --ink-3: #8593A0; --rule: #2A3640; --rule-2: #1F2A33;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.22);
  --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 56px rgba(0,0,0,.5);
  --tw-bg: #0A0F13; --tw-bar: #18222A; --tw-edge: #2A3640;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --truth: #5BA6E8; --bias: #F0844B; --null: #B494DE; --param: #4CC0AE; --ink: #E2E8EE; --noise: #8E9BA5; --ok: #4CC08B; --warn: #E2AE4A; --paper: #0D1318;
    --truth-text: #5BA6E8; --bias-text: #F0844B; --null-text: #B494DE; --param-text: #4CC0AE; --ok-text: #4CC08B; --warn-text: #E2AE4A;
    --truth-wash: rgba(91,166,232,.16); --bias-wash: rgba(240,132,75,.15); --null-wash: rgba(180,148,222,.15);
    --param-wash: rgba(76,192,174,.16); --ok-wash: rgba(76,192,139,.14); --warn-wash: rgba(226,174,74,.14); --noise-wash: rgba(142,155,165,.2);
    --sheet: #141C23; --sheet-2: #18222A; --ink-2: #A7B4BF; --ink-3: #8593A0; --rule: #2A3640; --rule-2: #1F2A33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.22);
    --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 56px rgba(0,0,0,.5);
    --tw-bg: #0A0F13; --tw-bar: #18222A; --tw-edge: #2A3640;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
em { font-style: italic; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
.mono { white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }

/* The bar */
.bar { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand .tag { font-weight: 500; font-size: 11px; color: var(--warn-text); background: var(--warn-wash); padding: 2px 6px; border-radius: 99px; }
.steps { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.steps button { border: 1px solid transparent; background: none; border-radius: 99px; padding: 5px 11px; white-space: nowrap; color: var(--ink-2); }
.steps button .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--rule-2); font-size: 11px; font-weight: 600; margin-right: 6px; color: var(--ink); }
.steps button.done .n { background: var(--ok-wash); color: var(--ok-text); }
.steps button[aria-current="true"] { border-color: var(--rule); background: var(--sheet-2); color: var(--ink); }
.steps button[aria-current="true"] .n { background: var(--ink); color: var(--paper); }
.steps button:disabled { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }

/* Layout */
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 52px); }
.explain { border-right: 1px solid var(--rule); background: var(--sheet); overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 12px; }
.stage { overflow: auto; padding: 18px 22px 40px; }
.vidtitle { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.explain h1 { font-size: 21px; line-height: 1.2; margin: 2px 0 0; font-weight: 600; }
.explain .read { font-family: var(--f-read); font-size: 15.5px; line-height: 1.5; color: var(--ink-2); }
.explain .read p { margin: 0 0 9px; }
.box { border-radius: var(--r); padding: 11px 13px; font-size: 13.5px; }
.box h2 { margin: 0 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.box.try { background: var(--truth-wash); }
.box.try h2 { color: var(--truth-text); }
.box.shows { background: var(--ok-wash); }
.box.shows h2 { color: var(--ok-text); }
.box.wait { background: var(--sheet-2); color: var(--ink-3); border: 1px dashed var(--rule); }
.navrow { display: flex; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 8px; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 13px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.provenance { font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--rule-2); padding-top: 10px; }

/* Panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; }
.panel + .panel { margin-top: 14px; }
.panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.panel h3 .muted { font-weight: 400; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid2 > .panel { margin-top: 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0 0; }

/* The product card: what the person who asked saw */
.product { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 13px 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.product .q { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
.product .q b { font-weight: 600; color: var(--ink); }
.product .a { font-family: var(--f-read); font-size: 15.5px; line-height: 1.45; padding: 9px 12px; background: var(--sheet-2); border-left: 3px solid var(--ink); border-radius: 0 6px 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.product .a.none { color: var(--ink-3); font-style: italic; border-left-color: var(--warn); }
.product .src { font-size: 12px; color: var(--ink-3); }
.product .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 500; background: var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.chip.bad { background: var(--bias-wash); color: var(--bias-text); }
.chip.good { background: var(--ok-wash); color: var(--ok-text); }
.chip.esc { background: var(--null-wash); color: var(--null-text); }
.chip.warn { background: var(--warn-wash); color: var(--warn-text); }
.chip.sound { background: var(--param-wash); color: var(--param-text); }
.chip.sim { background: var(--truth-wash); color: var(--truth-text); }
.mark { font-weight: 700; }
.mark.pass { color: var(--ok-text); } .mark.fail { color: var(--bias-text); } .mark.na { color: var(--ink-3); font-weight: 400; }

/* Choices and verdicts, with the judging buttons made large */
.choices { display: flex; flex-wrap: wrap; gap: 5px; }
.choices button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; }
.choices button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.choices.big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.choices.big button { border-radius: 10px; padding: 12px 10px; font-size: 14.5px; font-weight: 500; }
.verdict { font-size: 13px; padding: 8px 10px; border-radius: 6px; }
.verdict.right { background: var(--ok-wash); color: var(--ok-text); }
.verdict.wrong { background: var(--warn-wash); color: var(--warn-text); }
.verdict.info { background: var(--truth-wash); color: var(--truth-text); }

/* Progress dots */
.stops { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stops span { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet-2); font-size: 11.5px; color: var(--ink-2); display: inline-grid; place-items: center; }
.stops span.cur { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stops span.done { border-color: var(--ok); color: var(--ok-text); }
.stops span.skipped { border-style: dashed; color: var(--ink-3, var(--ink-2)); }
.stops span.go { cursor: pointer; }
.stops span.go:hover { border-color: var(--ink); }

/* Tables */
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-3); padding: 6px 6px; border-bottom: 1px solid var(--rule); background: var(--sheet); vertical-align: bottom; }
table.t td { padding: 5px 6px; border-bottom: 1px solid var(--rule-2); vertical-align: middle; }
table.t td.c, table.t th.c { text-align: center; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.sealed td { color: var(--ink-3); background: var(--sheet-2); }
.cellbtn { border: 0; background: none; padding: 0; }

/* The floorplan: which tool each run used, in what order */
table.fp { border-collapse: separate; border-spacing: 4px; font-size: 12px; }
table.fp th { font-weight: 600; color: var(--ink-3); font-size: 11px; padding: 0 4px; text-align: center; }
table.fp td { text-align: center; min-width: 64px; height: 30px; border-radius: 6px; background: var(--rule-2); color: var(--ink-3); }
table.fp td.used { background: var(--ink); color: var(--paper); font-weight: 600; }
table.fp td.used.danger { background: var(--bias); }
table.fp td.lab { background: none; text-align: left; width: auto; color: var(--ink); font-family: var(--f-mono); white-space: nowrap; }
table.fp tr.failrow td.lab { color: var(--bias-text); font-weight: 600; }

/* A record: the full trace of a run */
.record { margin-top: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet-2); padding: 10px 12px; }
.record h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.record table { border-collapse: collapse; width: 100%; font-size: 13px; }
.record td { padding: 3px 8px 3px 0; vertical-align: top; }
.record td:first-child { color: var(--ink-3); width: 36px; }
.record pre { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; margin: 0; }

/* Results */
.headline { font-family: var(--f-read); font-size: 19px; line-height: 1.4; }
.ci svg { width: 100%; height: auto; max-width: 640px; }
.ci .axis { stroke: var(--rule); } .ci .ref { stroke: var(--noise); stroke-dasharray: 3 3; }
.ci .bar { stroke: var(--truth); stroke-width: 5; stroke-linecap: round; } .ci .dot { fill: var(--truth); }
.ci text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-ui); }
.hbar { display: grid; grid-template-columns: 150px 1fr 110px; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
.hbar .track { height: 14px; background: var(--rule-2); border-radius: 4px; overflow: hidden; position: relative; }
.hbar .fill { height: 100%; background: var(--ink-2); border-radius: 4px; }
.hbar .half { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--noise); }

/* Inputs */
textarea, input[type=text], input[type=number], select { border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); padding: 6px 8px; width: 100%; }
textarea { font-family: var(--f-read); font-size: 14px; line-height: 1.4; resize: vertical; min-height: 54px; }
label.file { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 13px; background: var(--sheet); cursor: pointer; }
label.file input { display: none; }
.drop { border: 1.5px dashed var(--rule); border-radius: var(--r); padding: 14px; background: var(--sheet-2); }
.drop.over { border-color: var(--truth); background: var(--truth-wash); }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details pre { white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; background: var(--sheet-2); padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
.flag { color: var(--bias-text); }

/* The drawer */
.scrim { position: fixed; inset: 0; background: rgba(13,19,24,.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--sheet); z-index: 41; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.drawer header h2 { margin: 0; font-size: 16px; flex: 1; }
.drawer .body { padding: 14px 18px 30px; overflow-y: auto; font-size: 13.5px; }
.drawer .body h3 { font-size: 13px; margin: 18px 0 6px; }

/* Getting started: the first screen, reachable from every step */
[hidden] { display: none !important; }
.iconbtn.gsbtn { font-weight: 600; }
.iconbtn.gsbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.start { max-width: 1140px; margin: 0 auto; padding: 18px 22px 80px; }
.start h1 { font-size: 27px; line-height: 1.2; margin: 10px 0 8px; }
.start h2 { font-size: 20px; line-height: 1.25; margin: 38px 0 10px; }
.start .lead { font-family: var(--f-read); font-size: 17px; line-height: 1.5; color: var(--ink-2); margin: 0 0 10px; }
.start p { margin: 0 0 8px; }
.start .prose p { font-size: 15px; line-height: 1.55; }
.start a { color: var(--truth-text); }
.gs-new { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; background: var(--null-wash); border-radius: var(--r); padding: 12px 16px; font-size: 15px; line-height: 1.45; }
.gs-new b { color: var(--null-text); }
.gs-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 430px); gap: 24px; align-items: start; margin-top: 8px; }
.gs-stuck { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--param); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); margin-top: 12px; }
.gs-stuck h2 { margin: 0 0 6px; font-size: 17px; }
.gs-stuck p { font-size: 14px; line-height: 1.45; }
.gs-paths { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.gs-path { text-align: left; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.gs-path:hover { border-color: var(--ink-3); }
.gs-path[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--sheet-2); }
.gs-path .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 13px; }
.gs-path .t { font-weight: 600; font-size: 16px; }
.gs-path .w { color: var(--ink-2); font-size: 14px; line-height: 1.4; }
.gs-path .who { color: var(--ok-text); font-size: 13px; font-weight: 600; margin-top: auto; }
.gs-overview { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 26px; align-items: start; }
.gs-settings { display: flex; flex-direction: column; gap: 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; }
.gs-settings label, .gs-settings .lab { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; }
.gs-body label { font-weight: 600; font-size: 14px; display: block; margin: 10px 0 5px; }
.gs-need { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 16px; margin-top: 6px; }
.gs-need h2 { font-size: 16px; margin: 0 0 6px; }
.gs-need ul { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.55; }
.gs-settings input[type=text], .gs-body input[type=text] { font-family: var(--f-mono); max-width: 340px; font-size: 14px; }
.gs-settings .hint, .gs-body .hint { font-size: 13px; color: var(--ink-3); margin-top: 4px; line-height: 1.4; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 7px 13px; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
details.gs-first { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 16px; margin: 18px 0 0; }
details.gs-first > summary { font-size: 16px; font-weight: 600; color: var(--ink); }
details.gs-first[open] > summary { margin-bottom: 12px; }
ol.gs-steps { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 14px; }
.gs-step { display: grid; grid-template-columns: 42px minmax(0, 1fr) minmax(0, 430px); gap: 6px 18px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.gs-num { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: var(--sheet); background: var(--ink); }

// A terminal window (or Claude Code, which runs in one).

// o.lines: {cmd} typed after the prompt; {you} typed into Claude Code's box;

function termScene(o) {

        rows.push(i === 0 ? { parts: [[prompt + ' ', 'tw-p'], [s, 'tw-t']] } : { parts: [[s, 'tw-t']], indent: 2 }));
    } else if (l.you != null) {
      const segs = words(l.you, cols - 4, cols - 4);
      rows.push({ box: segs.length });
      segs.forEach((s, i) => rows.push({ parts: [[i ? '' : '> ', 'tw-ag'], [s, 'tw-t']], indent: i ? 2.6 : 0.6, inbox: true }));

    } else if (l.gap) rows.push({ gap: l.gap });

  rows.forEach(r => { h += r.gap != null ? r.gap : r.box != null ? 6 : r.boxend ? 8 : r.cursorBox ? 34 : lh; });

  rows.forEach(r => {

    if (r.box != null) { p.rect(X + pad - 6, y, WW - 2 * pad + 12, r.box * lh + 8, 'tw-box', 6); y += 6; return; }
    if (r.boxend) { y += 8; return; }

      p.text(X + pad + 2, y + 19.5, '>', { size: fs, mono: true, cls: 'tw-ag' });
      p.rect(X + pad + 2 + cw * 1.6, y + 9, cw * 0.95, 14, 'tw-cur', 1);
      y += 34; return;
    }
    p.spans(X + pad + (r.indent || 0) * cw, y + 14, r.parts, { size: r.sans ? 12 : fs, mono: !r.sans });
    if (r.cursor) p.rect(X + pad + (prompt.length + 1) * cw, y + 3, cw * 0.95, 14, 'tw-cur', 1);

    }
    y += rh + below;
  });

}

// Each step: where it happens, what to do (title, and a few short sentences),
// the command to type or the thing to click, what you should see, what to do
// if you don't, and its picture. {py}, {asst}, {name}, {packet}, {open},
// {mkdir} and {move} are filled in from the settings on the Getting started
// screen (and with placeholders for docs/diagrams).

function F(s, ctx) {
  const base = n => String(n).replace(/^\.\.\//, '').replace(/\/$/, '');
  const os = ctx.os || 'mac', win = os === 'win';
  const map = {
    py: win ? 'py' : 'python3', asst: ctx.asst, asstname: base(ctx.asst), name: ctx.name, packet: ctx.packet, packetname: base(ctx.packet),
    open: { mac: 'open wizard.html', win: 'start wizard.html', linux: 'xdg-open wizard.html' }[os],
    mkdir: win ? 'mkdir -Force experiments' : 'mkdir -p experiments',
    install: win ? 'irm https://claude.ai/install.ps1 | iex' : 'curl -fsSL https://claude.ai/install.sh | bash',
    exp: ctx.exp || ctx.name,
  };
  map.move = (win ? 'Move-Item -Force ~/Downloads/experiment.toml ' : 'mv ~/Downloads/experiment.toml ') + 'experiments/' + map.exp + '/experiment.toml';
  map.moveres = (win ? 'Move-Item -Force ~/Downloads/judgments.csv, ~/Downloads/results.json ' : 'mv ~/Downloads/judgments.csv ~/Downloads/results.json ') + 'runs/' + map.exp + '/';
  map.movesuite = (win ? 'Move-Item -Force ~/Downloads/judgments.csv ' : 'mv ~/Downloads/judgments.csv ') + map.packet + '/';
  // The designers' ZIPs: an experiment unzips into experiments/, a packet beside skill-eval-lite.
  const pdir = String(ctx.packet || '').replace(/\/?[^/]+\/?$/, '') || '.';
  map.unzipexp = win ? 'Expand-Archive -Force ~/Downloads/' + map.exp + '.zip -DestinationPath experiments' : 'unzip -o ~/Downloads/' + map.exp + '.zip -d experiments';
  map.unzippacket = win ? 'Expand-Archive -Force ~/Downloads/' + map.packetname + '.zip -DestinationPath ' + pdir : 'unzip -o ~/Downloads/' + map.packetname + '.zip -d ' + pdir;
  return String(s).replace(/\{(\w+)\}/g, (m, k) => k in map ? map[k] : m);
}

function designOverview(kind, ctx) {

  const top = y;
  p.add(`<path d="M30 ${top + 10} V${top + (list.length - 1) * 30 + 10}" class="ln thin dash s-web"/>`);
  list.forEach(([t, s], i) => {

    p.text(50, y + 14.5, t, { size: 13, bold: true }); p.text(50 + est(t, 13, false, true) + 10, y + 14.5, s, { size: 11.5, cls: 't3' });

  y += 4; arrow(p, [30, y], [30, y + 24], 'web'); p.text(44, y + 16, 'Save', { size: 11.5, cls: 't-web b' }); y += 34;
  const rows = kind === 'suites'

// The four rounds, each a copy of the assistant with at most one part changed.
function dzRounds(focus) {

    const x = 12 + (i % 2) * (cw + 10), y = 34 + Math.floor(i / 2) * (ch + 10), on = focus === 'B' ? id === 'B' : id === 'C' || id === 'D';

reaches_model = "imported by CLAUDE.md"

[[system.parts]]
id = "knowledge-graph"
path = "kb/ and .claude/skills/knowledge-graph*/"
paths = ["kb/", ".claude/skills/knowledge-graph/", ".claude/skills/knowledge-graph-maintain/"]
reaches_model = "the skills load when the agent chooses; pages are searched with kb/kb"

# Four rounds: the baseline, the improvement, and two controls (Mitchell's
# principle 2). A control that should change tests whether the evaluation can
# see a change at all; one that should not tests whether it moves on noise.
# `sources` is the frozen prediction of which sources should detect the change.
[[rounds]]
id = "A"
label = "As it is"
role = "baseline"
change = { how = "as-is" }

[[rounds]]
id = "B"
label = "Board memo section written"
role = "improvement"
change = { part = "voice", how = "revised", file = "rounds/B/.claude/identity/voice.md" }
expected = { direction = "better", tags = ["board"], elsewhere = "same", sources = ["people", "judge"] }
why = "voice.md says its Board Memo Voice section has 'not enough signal yet'. Round B writes it from three more of Morgan's memos (made up for the class)."

[[rounds]]
id = "C"
label = "Knowledge graph removed"
role = "control-should-change"
change = { part = "knowledge-graph", how = "removed" }
expected = { direction = "worse", tags = ["in-graph"], sources = ["people", "judge", "searched-the-graph"] }
why = "Without kb/ the assistant can't know who Dana and Sam are or what is open with them. If nothing in the evaluation moves, the evaluation can't see the graph."

[[rounds]]
id = "D"
label = "Voice file, sections reordered"
role = "control-should-not-change"
change = { part = "voice", how = "neutral-edit", file = "rounds/D/.claude/identity/voice.md" }
expected = { direction = "same" }
why = "The same sections in a different order, not a word changed. Anything that moves here is moving on noise."

[[comparisons]]
baseline = "A"
new = "B"

[[comparisons]]
baseline = "A"
new = "C"

[[comparisons]]
baseline = "A"
new = "D"

# How far a source may move and still count as "stayed": 10 points of a pass
# rate, or of a preference share away from 50%. Frozen with the rest.
[controls]
tolerance = 0.10

# Behaviors the prompt set is balanced on (Anthropic's step 3): each has
# prompts where it should occur and prompts where it should not.
[[behaviors]]
id = "uses-the-graph"
description = "Searches the knowledge graph before writing about someone in it; doesn't need to when the request holds everything."

[[behaviors]]
id = "uses-the-board-register"
description = "Writes in the board register: the decision first, abbreviations expanded, a source for every figure. Only for the board."

[prompts]
development = ["reply-to-priya", "summarize-committee-notes", "prep-dana-checkin", "reply-to-sam"]
held_out = ["ellis-board-note", "reply-to-school"]
sealed = true

# Each prompt: its text, the starting files, tags, the behaviors it should
# and should not show, and a reference output (Anthropic's step 2): a
# known-good answer that proves the task can be done and that every product
# check passes on (a positive control).
[[prompt]]
id = "reply-to-priya"
title = "Reply to Priya about the site visit and the report"
tags = ["voice", "reply", "funder", "in-graph"]
should = ["uses-the-graph"]
should_not = ["uses-the-board-register"]
files = ["input/priya-email.md"]
text = """
Priya wants to move Friday's site visit. Her email is in input/priya-email.md.
Tuesday the 17th at 10 works for me and Dana. We can't send the interim report
early, because our finance close isn't done until the 25th, but it will be in
by the 30th. Draft a reply."""
reference = """
Priya,

Tuesday the 17th at 10 works for Dana and me. Same plan as before: an hour together, then the walk through the Elm Street site.

We can't send the interim report early. Our finance close isn't done until the 25th, and the report needs those numbers. It will be with you by November 30.

Morgan"""

[[prompt]]
id = "summarize-committee-notes"
title = "Summarize the finance committee's notes for the committee"
tags = ["voice", "summary", "board"]
should = ["uses-the-board-register"]
should_not = ["uses-the-graph"]
files = ["input/committee-notes.md"]
text = """
Here are my notes from Thursday's Riverside finance committee meeting
(input/committee-notes.md). Turn them into a short summary I can send to the
committee: what we decided, who does what by when, and what is still open.
Save it in drafts/."""
reference = """
Riverside finance committee, Thursday 5 November

For the board: the committee asks the full board to decide on 19 November whether to move 5,000 from the operating reserve to program supplies. Alicia Moreno asked for a one-page explanation first.

Who does what
- Ellis Park sends corrected first-quarter actuals by Tuesday 10 November.
- Ellis asks the auditor whether fieldwork can move to February.
- Morgan sends Ellis the cover memo draft by Wednesday 11 November.
- The packet goes to the board on Thursday 12 November.

Still open
- When the audit fieldwork happens. The auditor wants January; Ellis has two staff out then.
- Program supplies: next summer's camp supplies were bought in September, which may explain why the line is over budget for the quarter, by about 6,500 (committee notes; Ellis is confirming).

Next meeting: Thursday 3 December.

Morgan"""

My check-in with Dana is Wednesday at 11. Give me a short brief to read
beforehand: what's open between us, and what I need from her. Save it in
notes/."""

Check-in with Dana, Wednesday at 11

2. The two quiet corporate partners. We haven't decided whether to mark them inactive. I need her decision.

From the graph pages for Dana Whitfield and the Hale Foundation."""

# The model and settings, the same for every round. The runner adds the
# isolation flags (see SAFETY.md): no personal settings, memory, MCP servers
# or connectors in any run.
[model]
runner = "claude-code"
model = "claude-sonnet-5-5"
allowed_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Skill", "Bash kb/kb *"]
timeout_seconds = 300
max_budget_usd = 1.00
note = "The same model and settings for every round. Personal settings, memory and connectors are left out of every run."

# Checks run by the wizard on every output. contains: every text must appear;
# not-contains: none may appear. A failed or timed-out run fails every check.
[[checks]]
id = "no-forbidden-characters"
kind = "not-contains"
object = "product"
text = ["—", "–", "“", "”", "‘", "’", "…"]
shows = "The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters."
does_not_show = "That the draft sounds like Morgan, or that it is right."

[[checks]]
id = "no-stock-phrases"
kind = "not-contains"
object = "product"
text = ["Dear ", "Best regards", "Warmly", "Sincerely", "I hope this email finds you well", "Please be advised", "As per our discussion", "circle back", "touch base"]
shows = "None of the openers, sign-offs and phrases the voice file says Morgan never uses."
does_not_show = "That the draft avoids every phrase Morgan would not use."

[[checks]]
id = "short-enough"
kind = "word-count"
object = "product"
max = 160
tags = ["reply"]
shows = "A reply is short, as Morgan's are."
does_not_show = "That it says everything it needs to."

[[checks]]
id = "names-the-new-date"
kind = "contains"
object = "product"
text = ["17"]
prompts = ["reply-to-priya"]
shows = "The reply mentions the 17th."
does_not_show = "That it proposes the 17th at 10, or gets the report right."

[[checks]]
id = "searched-the-graph"
kind = "trace-ran-command"
object = "process"
pattern = "kb/kb search*"
tags = ["in-graph"]
shows = "The run searched the knowledge graph, as CLAUDE.md asks before answering anything about a person."
does_not_show = "That it used what it found, or searched for the right person."

[[checks]]
id = "stayed-in-bounds"
kind = "trace-no-tool-outside"
object = "process"
allowed = ["Read", "Write", "Edit", "Glob", "Grep", "Skill", "Bash kb/kb *"]
shows = "Every step used a tool on the allowed list."
does_not_show = "That each step was a good one."

[judge]
model = "claude-sonnet-5-5"
decision = "The last line of the response is LEFT, RIGHT, TIE or UNKNOWN."
prompt = """
You are judging two drafts that an assistant wrote for Morgan Reyes. Morgan
sends drafts under their own name. Read the request, the starting file if
there is one, and the two drafts.

Question: Which draft would Morgan be more willing to send under their own
name without changes?

Judge what is on the page: whether it answers what was asked, whether its
facts match the request, and whether it reads as Morgan writes (plain, short,
no stock openers or sign-offs). Do not prefer a draft because it is longer.

Give two or three sentences of reasons. Then, on the last line, write only
LEFT, RIGHT or TIE, or UNKNOWN if you can't tell."""

{"note":"Written by dev/embed_examples.py from examples/; don't edit by hand.","experiment":{"files":{"prompts/ellis-board-note/files/input/ellis-email.md":"From: Ellis Park \u003cellis.park@riversideyouth.example>\nTo: Morgan Reyes \u003cmorgan.reyes@cedarcommons.example>\nDate: Thursday 12 November 2026, 15:02\nSubject: Note for the board tonight?\n\nMorgan -\n\nThe packet goes out tonight. Can you send me a short note for the top of it on\nthe supplies overspend, so board members see the explanation before the\nnumbers? I'll drop it in as page one. A paragraph or two is plenty.\n\nEllis\n","prompts/reply-to-priya/files/input/priya-email.md":"From: Priya Raman \u003cpriya.raman@halefoundation.example>\nTo: Morgan Reyes \u003cmorgan.reyes@cedarcommons.example>\nDate: Monday 9 November 2026, 08:14\nSubject: Friday site visit\n\nHi Morgan,\n\nI'm sorry to do this on short notice, but our team retreat now overlaps with\nFriday's site visit. Could we move it to Tuesday the 17th or Wednesday the\n18th, at 10 either day? Same plan otherwise: an hour with you and Dana, then a\nwalk through the Elm Street site.\n\nAlso, a quick check while I have you: is the interim report still on track for\nNovember 30? We'd love to have it a few days early if you can manage it, since\nour renewal review starts on December 1.\n\nThanks,\nPriya\n\nPriya Raman\nProgram Officer, Hale Foundation\n","prompts/reply-to-sam/files/input/sam-message.md":"From: Sam Reyes \u003csam.reyes@reyes-home.example>\nTo: morgan.reyes.home@reyes-home.example\nDate: Tuesday 10 November 2026, 12:05\nSubject: Saturday\n\nAre we both going on Saturday morning? I'll drive. If yes, I'll let the front desk know we're coming at 10.\n\nS\n","prompts/reply-to-school/files/input/school-email.md":"From: Joy Okafor \u003cj.okafor@lindenelementary.example>\nTo: Fourth grade families\nDate: Tuesday 10 November 2026, 07:40\nSubject: Fourth grade trip to the science museum, Thursday 19 November\n\nDear families,\n\nOur fourth graders will visit the science museum on Thursday 19 November,\nleaving school at 9:00 and returning by 2:30. Please return the signed\npermission form and the 12 dollar fee by Friday 13 November.\n\nWe still need two parent chaperones. If you can come, please reply to this\nemail and let me know.\n\nThank you!\nMs. Okafor\n","prompts/summarize-committee-notes/files/input/committee-notes.md":"Riverside finance cttee - Thu 5 Nov 2026, 6:30pm, video\n\nPresent: me (chair), Ellis, Tom Becker, Alicia Moreno\n\nQ1 actuals (Jul-Sep)\n- revenue roughly on plan\n- program supplies over by ~6,500. Camp supplies for next summer bought in Sept?\n  Ellis to confirm timing vs real overspend\n- 2 Sept lines miscoded. Ellis sends corrected Q1 actuals by Tue 10 Nov\n\nAudit\n- auditor wants fieldwork in Jan, not March\n- Ellis not happy about Jan (two staff out). Ellis to ask auditor about Feb\n- no decision\n\nReserve transfer\n- Tom suggested moving 5,000 from operating reserve to cover supplies\n- not ours to decide, goes to full board 19 Nov\n- Alicia wants a one-page explanation for the board first\n\nPacket\n- me: cover memo draft to Ellis by Wed 11 Nov\n- packet to board Thu 12 Nov (one week before mtg)\n\nNext cttee mtg Thu 3 Dec\n","rounds/B/.claude/identity/voice.md":"# Morgan Reyes - Voice and Style Guide\n\nThis document describes the voice, tone, and grammar conventions Morgan Reyes uses\nin written communication. Any written output generated on their behalf (email,\ngrant narrative, board memo, partner message, household correspondence) should\nmatch these conventions.\n\nIt covers four audiences: funders and program officers, partner organizations and\ncounsel, the Riverside board, and personal or household correspondence. The\ncharacter set, tone, formatting, and grammar rules below apply to all four.\nGreetings and sign-offs shift by audience; see \"Register by audience\".\n\n## Character Set Rules (Strict)\n\nThe following characters must never appear in output produced in this voice:\n\n- Em-dashes (U+2014). Use a plain ASCII hyphen (`-`) with spaces on both sides\n  instead, e.g. `the deadline moved - here is what that changes`.\n- En-dashes (U+2013). Use a plain hyphen for ranges too.\n- Emojis of any kind.\n- Any non-ASCII character. This includes curly quotes, ellipses (`...`), fractions,\n  and arrows.\n\nUse only: plain ASCII letters, digits, standard punctuation\n(`. , ! ? ; : ' \" ( ) - / & % $`), and line breaks.\n\nMorgan's own samples were clean ASCII in fourteen of seventeen cases; the three\nexceptions were smart quotes pasted in from a PDF. They confirmed the rule should\nbe strict going forward.\n\n## Tone\n\n- Warm at the edges, businesslike in the middle. The greeting and the sign-off\n  carry the warmth; the body is efficient.\n- Leads with the ask or the answer. Context comes second, and only if it changes\n  what the reader does.\n- States numbers with their source in the same sentence: \"the shortfall is 42,000\n  against the approved budget, line 14\".\n- Owns a mistake in one clause and moves on. \"That was my error, corrected below.\"\n  No second apology.\n- Firm without stiffening. When the answer is no, the no is in the first sentence\n  and the reason is in the second. They do not pad it with regret.\n- Acknowledges the other person's workload where it is real, especially with\n  volunteers. \"I know this lands in a heavy week.\"\n\n## Register by audience\n\nThe voice is the same everywhere. What shifts is how they sign and how much\nformality the opening carries.\n\n- **Funders and program officers.** Sign `Morgan`. Full name and title in the first\n  message of a new thread, first name after. Every figure gets checked against the\n  current budget workbook or the signed agreement before it goes into a draft, and\n  the draft names which one. Never speculate about a decision the funder has not\n  announced.\n- **Partner organizations and counsel.** Sign `Morgan`. Shortest register they use\n  professionally. Points of agreement get restated explicitly, because these\n  threads become the record of what was agreed.\n- **Riverside board.** Sign `Morgan`. Volunteer audience with mixed financial\n  literacy, so every number is introduced in plain language before it is given, and\n  no acronym goes in unexpanded. Acknowledge that this is unpaid time.\n- **Personal and household.** Sign `Morgan`, or nothing at all on a short thread.\n  Shortest register of the four. Contractions throughout.\n\n## Greetings\n\nCommon openers, verbatim from samples:\n\n- `Hi \u003cname>,`\n- `Hello all,` (board and group threads)\n- `\u003cname> -` (partners and counsel, on an active thread)\n- No greeting at all on a reply inside a thread already going.\n\nAvoid: `Dear \u003cname>`, `Good morning!` as an opener, and anything that opens with\npleasantries before the subject.\n\n## Sign-offs\n\n- `Morgan` - the default everywhere.\n- `Thanks, Morgan` - when the other person has done something or is being asked to.\n- `Thanks so much for the quick turnaround, Morgan` - appears when a deadline was\n  absorbed by someone else. Used sparingly and it lands because of that.\n- Nothing at all - short household and internal replies.\n\nNever `Best regards`, `Warmly`, or `Sincerely`. None appear in any sample.\n\n## Formatting Conventions\n\n- Short paragraphs with blank lines between them. Never a dense block. The longest\n  sample paragraph was four sentences.\n- Numbered lists for anything the reader has to act on or do in order. Bullets for\n  parallel facts that are not actions.\n- Does not use bold for emphasis in prose. They bold headings in memos and nothing\n  else. Do not add bold to a draft; Morgan adds it where they want it.\n- Dollar figures written as `42,000` in prose and `$42,000` in tables, consistently\n  across samples.\n- In a board memo, the recommendation goes at the top, before the analysis.\n\n## Grammar and Punctuation\n\n- Contractions are standard: `don't`, `we're`, `it's`, `won't`.\n- Exclamation points appear in roughly one message in five, and almost always in a\n  thank-you rather than a greeting.\n- Sentences are short to medium. Complex ideas get two sentences rather than one\n  with a subordinate clause.\n- Oxford comma, consistently.\n- Parentheses used for a genuine aside, about once per message\n  (`(the site visit is still unscheduled)`).\n\n## Common Phrases and Patterns\n\n- Opening acknowledgement: `Thanks for the quick turnaround.`, `Thanks for\n  flagging this.`, `That was my error, corrected below.`\n- Framing an ask: `What I need from you is \u003cone thing>, by \u003cdate>.`\n- Offering flexibility: `If that timeline is tight, tell me and we will move it.`\n- Holding a line: `We can't do that under the current agreement. Here is what we\n  can do instead.`\n- Checking in: `Where did this land?`, `Anything you need from me before Thursday?`\n- Closing warmth with volunteers: `I know this lands in a heavy week, and I\n  appreciate it.`\n\n## Grant Narrative Voice\n\nGrant narratives are the one artifact with its own conventions, because a program\nofficer reads dozens of them:\n\n- Lead with what changed for the people served, then the number that shows it.\n- Never use a superlative the data does not support. \"Served 240 households, up\n  from 190\" rather than \"dramatic growth\".\n- Name a shortfall before the funder finds it, with the correction alongside.\n- One page of narrative per reporting section, never two.\n\n## Board Memo Voice\n\nDerived from four Riverside board memos (one supplied on 2026-02-11, three on\n2026-10-20) and two board emails.\n\n- The decision or the ask comes first, in one sentence, before any background.\n  When the board is asked to decide something, the first line says what, and by\n  when.\n- Every figure is introduced in plain words, then given, then sourced in the same\n  sentence: \"the program supplies line is 6,200 over budget for July to September\n  (corrected first-quarter actuals from Ellis Park, 10 November)\".\n- No abbreviations at all. \"First quarter\", not \"Q1\"; \"finance committee\", not\n  \"cttee\"; \"operating reserve\", not \"op reserve\". Months are written out.\n- Dates carry the weekday: \"Thursday 12 November\".\n- Short sections with plain headings, in this order when they apply: the decision\n  or ask; what happened; who does what by when; what is still open.\n- Owners and deadlines go in a list, one line each, with a name and a date in\n  every line.\n- Anything still open is called open, with who is finding out. Never say what the\n  board, the auditor or a member thinks or will think.\n- One page at most. A memo that runs longer is two memos.\n- No greeting on a memo, and `Hello all,` on a board email. Sign `Morgan`.\n- Thank the volunteers once, at the end of an email, never in a memo.\n\n## What to Avoid\n\n- Corporate business-speak: `Please be advised`, `As per our discussion`,\n  `circle back`, `touch base`.\n- Performative warmth: `I hope this email finds you well`, `Hope you had a great\n  weekend`.\n- Hedging: `it may be worth considering`, `perhaps we could`. Morgan states the\n  recommendation.\n- Unexpanded acronyms in anything going to the board or a new partner.\n- Any figure without a source behind it.\n\n## Provenance\n\nDerived from 17 writing samples supplied on 2026-02-11:\n\n- Funders and program officers: 6 sent emails, 2 grant report narratives.\n- Partners and counsel: 4 sent emails, including two where Morgan declined a\n  request.\n- Riverside board: 4 memos (three added on 2026-10-20), 2 emails.\n- Personal and household: 2 emails.\n\nRe-run `/setup voice` when more board material accumulates.\n","rounds/D/.claude/identity/voice.md":"# Morgan Reyes - Voice and Style Guide\n\nThis document describes the voice, tone, and grammar conventions Morgan Reyes uses\nin written communication. Any written output generated on their behalf (email,\ngrant narrative, board memo, partner messa nd almost always in a\n  thank-you rather than a greeting.\n- Sentences are short to medium. Complex ideas get two sentences rather than one\n  with a subordinate clause.\n- Oxford comma, consistently.\n- Parentheses used for a genuine aside, about once per message\n  (`(the site visit is still unscheduled)`).\n\n## Common Phrases and Patterns\n\n- Opening acknowledgement: `Thanks for the quick turnaround.`, `Thanks for\n  flagging this.`, `That was my error, corrected below.`\n- Framing an ask: `What I need from you is \u003cone thing>, by \u003cdate>.`\n- Offering flexibility: `If that timeline is tight, tell me and we will move it.`\n- Holding a line: `We can't do that under the current agreement. Here is what we\n  can do instead.`\n- Checking in: `Where did this land?`, `Anything you need from me before Thursday?`\n- Closing warmth with volunteers: `I know this lands in a heavy week, and I\n  appreciate it.`\n\n## Grant Narrative Voice\n\nGrant narratives are the one artifact with its own conventions, because a program\nofficer reads dozens of them:\n\n- Lead with what changed for the people served, then the number that shows it.\n- Never use a superlative the data does not support. \"Served 240 households, up\n  from 190\" rather than \"dramatic growth\".\n- Name a shortfall before the funder finds it, with the correction alongside.\n- One page of narrative per reporting section, never two.\n\n## Board Memo Voice\n\nnot enough signal yet. Morgan supplied one board memo, which is not enough to\nderive conventions from. Ask for three more before writing this section, and until\nthen draft board memos against the general rules above and flag that the register\nis unverified.\n\n## What to Avoid\n\n- Corporate business-speak: `Please be advised`, `As per our discussion`,\n  `circle back`, `touch base`.\n- Performative warmth: `I hope this email finds you well`, `Hope you had a great\n  weekend`.\n- Hedging: `it may be worth considering`, `perhaps we could`. Morgan e class assistant: python3 run_ab.py setup ../class-assistant\"\n\n[[system.parts]]\nid = \"voice\"\npath = \".claude/identity/voice.md\"\nwords = 1173\nreaches_model = \"imported by CLAUDE.md\"\n\n[[rounds]]\nid = \"A\"\nlabel = \"As it is\"\nrole = \"baseline\"\nchange = { how = \"as-is\" }\n\n[[rounds]]\nid = \"B\"\nlabel = \"Board memo section written\"\nrole = \"improvement\"\nchange = { part = \"voice\", how = \"revised\", file = \"rounds/B/.claude/identity/voice.md\" }\nexpected = { direction = \"better\", tags = [\"board\"], sources = [\"people\", \"judge\", \"no-board-abbreviations\"] }\nwhy = \"voice.md says its Board Memo Voice section has 'not enough signal yet'. Round B writes it from three more of Morgan's memos (made up for the class).\"\n\n[[comparisons]]\nbaseline = \"A\"\nnew = \"B\"\n\n[controls]\ntolerance = 0.10\n\n[[behaviors]]\nid = \"uses-the-board-register\"\ndescription = \"Writes in the board register: the decision first, abbreviations expanded, a source for every figure. Only for the board.\"\n\n[prompts]\ndevelopment = [\"summarize-committee-notes\", \"ellis-board-note\"]\nheld_out = [\"reply-to-school\"]\nsealed = true\n\n[[prompt]]\nid = \"summarize-committee-notes\"\ntitle = \"Summarize the finance committee's notes for the committee\"\ntags = [\"voice\", \"summary\", \"board\"]\nshould = [\"uses-the-board-register\"]\nshould_not = [\"uses-the-graph\"]\nfiles = [\"input/committee-notes.md\"]\ntext = \"\"\"\nHere are my notes from Thursday's Riverside finance committee meeting\n(input/committee-notes.md). Turn them into a short summary I can send to the\ncommittee: what we decided, who does what by when, and what is still open.\nSave it in drafts/.\"\"\"\nreference = \"\"\"\nRiverside finance committee, Thursday 5 November\n\nFor the board: the committee asks the full board to decide on 19 November whether to move 5,000 from the operating reserve to program supplies. Alicia Moreno asked for a one-page explanation first.\n\nWho does what\n- Ellis Park sends corrected first-quarter actuals by Tuesday 10 November.\n- Ellis asks the auditor whether fieldwork can move to February.\n- Morgan sends Ellis the cover memo draft by Wednesday 11 November.\n- The packet goes to the board on Thursday 12 November.\n\nStill open\n- When the audit fieldwork happens. The auditor wants January; Ellis has two staff out then.\n- Program supplies: next summer's camp supplies were bought in September, which may explain why the line is over budget for the quarter, by about 6,500 (committee notes; Ellis is confirming).\n\nNext meeting: Thursday 3 December.\n\nMorgan\"\"\"\n\n# Replaces the class pack's \"send it now\" prompt, whose test needs a send\n# tool; this one asks for a draft.\n[[prompt]]\nid = \"ellis-board-note\"\ntitle = \"The note on the supplies overspend for the board packet\"\ntags = [\"voice\", \"board\", \"in-graph\"]\nshould = [\"uses-the-graph\", \"uses-the-board-register\"]\nfiles = [\"input/ellis-email.md\"]\ntext = \"\"\"\nEllis wants a short note for the top of the board packet (his email is in\ninput/ellis-email.md). We went 6,200 over on program supplies in Q1 because\ncamp supplies for next summer were bought in September to get a bulk discount,\nso it's timing, not new spending. Draft it in drafts/ for me to look at.\"\"\"\nreference = \"\"\"\nProgram supplies, first quarter\n\nThe program supplies line is over budget for the quarter because we bought next summer's camp supplies in September, when a bulk discount was available. It is a question of timing, not new spending.\n\nThe line is 6,200 over budget for July to September (corrected first-quarter actuals from Ellis Park, 10 November).\n\nMorgan\"\"\"\n\n[[prompt]]\nid = \"reply-to-school\"\ntitle = \"Answer Ms. Okafor about the trip\"\ntags = [\"voice\", \"reply\", \"household\", \"not-in-graph\"]\nshould_not = [\"uses-the-graph\", \"uses-the-board-register\"]\nfiles = [\"input/school-email.md\"]\ntext = \"\"\"\nCan you answer Ms. Okafor for me? Her email is in input/school-email.md. Yes to\nthe trip, and I've signed the form and will send it in with the fee tomorrow.\nI can't chaperone that day, sorry.\"\"\"\nreference = \"\"\"\nMs. Okafor,\n\nYes to the trip. I've signed the form, and it'll come in with the fee tomorrow. I can't chaperone that day, sorry.\n\nMorgan\"\"\"\n\n[model]\nrunner = \"claude-code\"\nmodel = \"claude-sonnet-5-5\"\nallowed_tools = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\ntimeout_seconds = 300\nmax_budget_usd = 1.00\nnote = \"The same model and settings for every round. Personal settings, memory and connectors are left out of every run.\"\n\n# Checks run by the wizard on every output. contains: every text must appear;\n# not-contains: none may appear. A failed or timed-out run fails every check.\n\n[[checks]]\nid = \"no-board-abbreviations\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"Q1\", \"cttee\", \"mtg\"]\ntags = [\"board\"]\nshows = \"None of the committee's shorthand reached a board document.\"\ndoes_not_show = \"That every abbreviation was expanded, or that the register is right.\"\n\n[[checks]]\nid = \"no-forbidden-characters\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"—\", \"–\", \"“\", \"”\", \"‘\", \"’\", \"…\"]\nshows = \"The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters.\"\ndoes_not_show = \"That the draft sounds like Morgan, or that it is right.\"\n\n[[checks]]\nid = \"no-stock-phrases\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"Dear \", \"Best regards\", \"Warmly\", \"Sincerely\", \"I hope this email finds you well\", \"Please be advised\", \"As per our discussion\", \"circle back\", \"touch base\"]\nshows = \"None of the openers, sign-offs and phrases the voice file says Morgan never uses.\"\ndoes_not_show = \"That the draft avoids every phrase Morgan would not use.\"\n\n[[checks]]\nid = \"stayed-in-bounds\"\nkind = \"trace-no-tool-outside\"\nobject = \"process\"\nallowed = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\nshows = \"Every step used a tool on the allowed list.\"\ndoes_not_show = \"That each step was a good one.\"\n\n[judge]\nmodel = \"claude-sonnet-5-5\"\ndecision = \"The last line of the response is LEFT, RIGHT, TIE or UNKNOWN.\"\nprompt = \"\"\"\nYou are judging two drafts that an assistant wrote for Morgan Reyes. Morgan\nsends drafts under their own name. Read the request, the starting file if\nthere is one, and the two drafts.\n\nQuestion: Which draft would Morgan be more willing to send under their own\nname without changes?\n\nJudge what is on the page: whether it answers what was asked, whether its\nfacts match the request, and whether it reads as Morgan writes (plain, short,\nno stock openers or sign-offs). Do not prefer a draft because it is longer.\n\nGive two or three sentences of reasons. Then, on the last line, write only\nLEFT, RIGHT or TIE, or UNKNOWN if you can't tell.\"\"\"\n\n[frozen]\ndate = \"\"\nhash = \"\"\n\n[provenance]\nwritten_by = \"Claude (claude-opus-5-5), by hand, from the class intake\"\ndate = \"2026-10-26\"\nskill = \"experiment-intake 1\"\n","demo-graph-removed":"# Demonstration 1 of 3: round C removes the knowledge graph. Things should get worse.\n# A demonstration for the live session: two prompts, two rounds, one repeat\n# (4 runs; about 3 minutes with --jobs 4). It is not a full experiment: a\n# full one has both controls, at least four development prompts and two\n# repeats (see class-assistant/experiment.toml, whose prompts, round files and\n# starting files this file uses). Wren and Morgan Reyes are fictional.\nschema = \"skill-eval-lite/experiment@1\"\ndemo = true\nfiles_from = \"class-assistant\"\ntitle = \"Can the evaluation see the knowledge graph? (demonstration: the graph removed)\"\npurpose = \"\"\"\nWren drafts replies, summaries and briefs for Morgan Reyes, who sends them\nunder Morgan's own name. The outputs are for Morgan to send or read with as\nfew changes as possible.\"\"\"\ncriterion = \"\"\"\nA good output could go out under Morgan's name without changes: it answers\nwhat was asked, gets the facts from the request and the knowledge graph right,\nand reads as Morgan writes (plain, short, no stock openers or sign-offs).\"\"\"\njudging_question = \"Which draft would Morgan be more willing to send under their own name without changes?\"\nrepeats = 1\nseed = 5502\n\n[system]\nname = \"Wren, Morgan Reyes's assistant (the class assistant; fictional)\"\nkind = \"assistant\"\nfolder = \"the class assistant: python3 run_ab.py setup ../class-assistant\"\n\n[[system.parts]]\nid = \"knowledge-graph\"\npath = \"kb/ and .claude/skills/knowledge-graph*/\"\npaths = [\"kb/\", \".claude/skills/knowledge-graph/\", \".claude/skills/knowledge-graph-maintain/\"]\nreaches_model = \"the skills load when the agent chooses; pages are searched with kb/kb\"\n\n[[rounds]]\nid = \"A\"\nlabel = \"As it is\"\nrole = \"baseline\"\nchange = { how = \"as-is\" }\n\n[[rounds]]\nid = \"C\"\nlabel = \"Knowledge graph removed\"\nrole = \"control-should-change\"\nchange = { part = \"knowledge-graph\", how = \"removed\" }\nexpected = { direction = \"worse\", tags = [\"in-graph\"], sources = [\"people\", \"judge\", \"searched-the-graph\", \"names-the-renewal-amount\"] }\nwhy = \"Without kb/ the assistant can't know who Dana and Priya are or what is open with them. If nothing in the evaluation moves, the evaluation can't see the graph.\"\n\n[[comparisons]]\nbaseline = \"A\"\nnew = \"C\"\n\n[controls]\ntolerance = 0.10\n\n[[behaviors]]\nid = \"uses-the-graph\"\ndescription = \"Searches the knowledge graph before writing about someone in it; doesn't need to when the request holds everything.\"\n\n[prompts]\ndevelopment = [\"prep-dana-checkin\", \"prep-priya-call\"]\nheld_out = [\"reply-to-school\"]\nsealed = true\n\n[[prompt]]\nid = \"prep-dana-checkin\"\ntitle = \"A brief for the check-in with Dana\"\ntags = [\"briefing\", \"in-graph\"]\nshould = [\"uses-the-graph\"]\nshould_not = [\"uses-the-board-register\"]\ntext = \"\"\"\nMy check-in with Dana is Wednesday at 11. Give me a short brief to read\nbeforehand: what's open between us, and what I need from her. Save it in\nnotes/.\"\"\"\nreference = \"\"\"\nCheck-in with Dana, Wednesday at 11\n\nOpen between us\n1. The Hale Foundation renewal narrative. The request is 120,000 over two years, above the 50,000 that Dana reviews, and it is due to Hale on 1 December. I need her review dates.\n2. The two quiet corporate partners. We haven't decided whether to mark them inactive. I need her decision.\n\nFrom the graph pages for Dana Whitfield and the Hale Foundation.\"\"\"\n\n[[prompt]]\nid = \"prep-priya-call\"\ntitle = \"A brief for a call with Priya at the Hale Foundation\"\ntags = [\"briefing\", \"funder\", \"in-graph\"]\nshould = [\"uses-the-graph\"]\ntext = \"\"\"\nPriya Raman is calling me tomorrow at 2. Give me a short brief to read first:\nwhat's open with the Hale Foundation, with the dates and amounts. Save it in\nnotes/.\"\"\"\nreference = \"\"\"\nCall with Priya Raman, Hale Foundation, tomorrow at 2\n\nOpen with Hale\n1. The interim report on the current grant, due Monday 30 November.\n2. The renewal proposal: 120,000 over two years, due Tuesday 1 December. The narrative isn't drafted yet, and Dana reviews it before it goes, because the request is above 50,000.\n\nFrom the graph pages for the Hale Foundation renewal and the grant calendar.\"\"\"\n\n[[prompt]]\nid = \"reply-to-school\"\ntitle = \"Answer Ms. Okafor about the trip\"\ntags = [\"voice\", \"reply\", \"household\", \"not-in-graph\"]\nshould_not = [\"uses-the-graph\", \"uses-the-board-register\"]\nfiles = [\"input/school-email.md\"]\ntext = \"\"\"\nCan you answer Ms. Okafor for me? Her email is in input/school-email.md. Yes to\nthe trip, and I've signed the form and will send it in with the fee tomorrow.\nI can't chaperone that day, sorry.\"\"\"\nreference = \"\"\"\nMs. Okafor,\n\nYes to the trip. I've signed the form, and it'll come in with the fee tomorrow. I can't chaperone that day, sorry.\n\nMorgan\"\"\"\n\n[model]\nrunner = \"claude-code\"\nmodel = \"claude-sonnet-5-5\"\nallowed_tools = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\ntimeout_seconds = 300\nmax_budget_usd = 1.00\nnote = \"The same model and settings for every round. Personal settings, memory and connectors are left out of every run.\"\n\n# Checks run by the wizard on every output. contains: every text must appear;\n# not-contains: none may appear. A failed or timed-out run fails every check.\n\n[[checks]]\nid = \"searched-the-graph\"\nkind = \"trace-ran-command\"\nobject = \"process\"\npattern = \"kb/kb search*\"\ntags = [\"in-graph\"]\nshows = \"The run searched the knowledge graph, as CLAUDE.md asks before answering anything about a person.\"\ndoes_not_show = \"That it used what it found, or searched for the right person.\"\n\n[[checks]]\nid = \"names-the-renewal-amount\"\nkind = \"matches\"\nobject = \"product\"\npattern = \"120,?000|120 ?[kK]\"\nprompts = [\"prep-dana-checkin\", \"prep-priya-call\"]\nshows = \"The brief gives the Hale renewal's amount, which only the knowledge graph holds.\"\ndoes_not_show = \"That the rest of the brief is right.\"\n\n[[checks]]\nid = \"stayed-in-bounds\"\nkind = \"trace-no-tool-outside\"\nobject = \"process\"\nallowed = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\nshows = \"Every step used a tool on the allowed list.\"\ndoes_not_show = \"That each step was a good one.\"\n\n[[checks]]\nid = \"no-forbidden-characters\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"—\", \"–\", \"“\", \"”\", \"‘\", \"’\", \"…\"]\nshows = \"The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters.\"\ndoes_not_show = \"That the draft sounds like Morgan, or that it is right.\"\n\n[judge]\nmodel = \"claude-sonnet-5-5\"\ndecision = \"The last line of the response is LEFT, RIGHT, TIE or UNKNOWN.\"\nprompt = \"\"\"\nYou are judging two drafts that an assistant wrote for Morgan Reyes. Morgan\nsends drafts under their own name. Read the request, the starting file if\nthere is one, and the two drafts.\n\nQuestion: Which draft would Morgan be more willing to send under their own\nname without changes?\n\nJudge what is on the page: whether it answers what was asked, whether its\nfacts match the request, and whether it reads as Morgan writes (plain, short,\nno stock openers or sign-offs). Do not prefer a draft because it is longer.\n\nGive two or three sentences of reasons. Then, on the last line, write only\nLEFT, RIGHT or TIE, or UNKNOWN if you can't tell.\"\"\"\n\n[frozen]\ndate = \"\"\nhash = \"\"\n\n[provenance]\nwritten_by = \"Claude (claude-opus-5-5), by hand, from the class intake\"\ndate = \"2026-10-26\"\nskill = \"experiment-intake 1\"\n","demo-one-line":"# The class's line: round B adds one line to Wren's voice file. What changes?\n# A demonstration for the live session of 27 October: three short replies,\n# two rounds, one repeat (6 runs; about a minute with --jobs 6). The line is\n# in rounds/one-line/.claude/identity/voice.md, under \"House rule\", and the\n# room may choose another before the run. It is not a full experiment: a full\n# one has both controls, at least four development prompts and two repeats\n# (see class-assistant/experiment.toml, whose prompts and starting files this\n# file uses). Wren and Morgan Reyes are fictional.\nschema = \"skill-eval-lite/experiment@1\"\ndemo = true\nfiles_from = \"class-assistant\"\ntitle = \"Does one line in the voice file make Wren's replies better? (demonstration: the class's line)\"\npurpose = \"\"\"\nWren drafts replies, summaries and briefs for Morgan Reyes, who sends them\nunder Morgan's own name. The outputs are for Morgan to send or read with as\nfew changes as possible.\"\"\"\ncriterion = \"\"\"\nA good output could go out under Morgan's name without changes: it answers\nwhat was asked, gets the facts from the request right, and reads as Morgan\nwrites (plain, short, no stock openers or sign-offs).\"\"\"\njudging_question = \"Which draft would Morgan be more willing to send under their own name without changes?\"\nrepeats = 1\nseed = 5502\n\n[system]\nname = \"Wren, Morgan Reyes's assistant (the class assistant; fictional)\"\nkind = \"assistant\"\nfolder = \"the class assistant: python3 run_ab.py setup ../class-assistant\"\n\n[[system.parts]]\nid = \"voice\"\npath = \".claude/identity/voice.md\"\nwords = 1173\nreaches_model = \"imported by CLAUDE.md\"\n\n[[rounds]]\nid = \"A\"\nlabel = \"As it is\"\nrole = \"baseline\"\nchange = { how = \"as-is\" }\n\n[[rounds]]\nid = \"B\"\nlabel = \"The class's line added\"\nrole = \"improvement\"\nchange = { part = \"voice\", how = \"revised\", file = \"rounds/one-line/.claude/identity/voice.md\" }\nexpected = { direction = \"better\", tags = [\"reply\"], sources = [\"people\", \"judge\", \"length\"] }\nwhy = \"The line under House rule in round B's voice file. The room predicts, before the run, which way the replies move and which evidence will show it.\"\n\n[[comparisons]]\nbaseline = \"A\"\nnew = \"B\"\n\n[controls]\ntolerance = 0.10\n\n[prompts]\ndevelopment = [\"reply-to-sam\", \"reply-to-school\", \"reply-to-priya\"]\nheld_out = []\nsealed = true\n\n[[prompt]]\nid = \"reply-to-sam\"\ntitle = \"Answer Sam about Saturday\"\ntags = [\"voice\", \"reply\", \"household\"]\nfiles = [\"input/sam-message.md\"]\ntext = \"\"\"\nSam's message about Saturday is in input/sam-message.md. Yes, we're both\ngoing, Sam can drive, and 10 is fine. Draft a short reply I can send, and\nsave it in drafts/.\"\"\"\nreference = \"\"\"\nYes, both of us. You drive, and 10 is fine. Thanks for telling the front desk.\n\nM\"\"\"\n\n[[prompt]]\nid = \"reply-to-school\"\ntitle = \"Answer Ms. Okafor about the trip\"\ntags = [\"voice\", \"reply\", \"household\"]\nfiles = [\"input/school-email.md\"]\ntext = \"\"\"\nCan you answer Ms. Okafor for me? Her email is in input/school-email.md. Yes to\nthe trip, and I've signed the form and will send it in with the fee tomorrow.\nI can't chaperone that day, sorry. Save the draft in drafts/.\"\"\"\nreference = \"\"\"\nMs. Okafor,\n\nYes to the trip. I've signed the form, and it'll come in with the fee tomorrow. I can't chaperone that day, sorry.\n\nMorgan\"\"\"\n\n[[prompt]]\nid = \"reply-to-priya\"\ntitle = \"Reply to Priya about the site visit and the report\"\ntags = [\"voice\", \"reply\", \"funder\"]\nfiles = [\"input/priya-email.md\"]\ntext = \"\"\"\nPriya wants to move Friday's site visit. Her email is in input/priya-email.md.\nTuesday the 17th at 10 works for me and Dana. We can't send the interim report\nearly, because our finance close isn't done until the 25th, but it will be in\nby the 30th. Draft a reply and save it in drafts/.\"\"\"\nreference = \"\"\"\nPriya,\n\nTuesday the 17th at 10 works for Dana and me.\n\nWe can't send the interim report early: our finance close isn't done until the 25th. It will be with you by November 30.\n\nMorgan\"\"\"\n\n[model]\nrunner = \"claude-code\"\nmodel = \"claude-sonnet-5-5\"\nallowed_tools = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\ntimeout_seconds = 300\nmax_budget_usd = 1.00\nnote = \"The same model and settings for every round. Personal settings, memory and connectors are left out of every run.\"\n\n# Checks run by the wizard on every output. contains: every text must appear;\n# not-contains: none may appear. A failed or timed-out run fails every check.\n\n[[checks]]\nid = \"length\"\nkind = \"word-count\"\nobject = \"product\"\nmax = 40\nshows = \"The reply is 40 words or fewer.\"\ndoes_not_show = \"That it still says everything it needs to.\"\n\n[[checks]]\nid = \"keeps-both-dates\"\nkind = \"contains\"\nobject = \"product\"\ntext = [\"17\", \"30\"]\nprompts = [\"reply-to-priya\"]\nshows = \"The reply to Priya gives the new visit date and the report's date.\"\ndoes_not_show = \"That the dates are right, or that the reason is there.\"\n\n[[checks]]\nid = \"no-stock-phrases\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"Dear \", \"Best regards\", \"Warmly\", \"Sincerely\", \"I hope this email finds you well\", \"Please be advised\", \"As per our discussion\", \"circle back\", \"touch base\"]\nshows = \"None of the openers, sign-offs and phrases the voice file says Morgan never uses.\"\ndoes_not_show = \"That the reply avoids every phrase Morgan would not use.\"\n\n[judge]\nmodel = \"claude-sonnet-5-5\"\ndecision = \"The last line of the response is LEFT, RIGHT, TIE or UNKNOWN.\"\nprompt = \"\"\"\nYou are judging two drafts that an assistant wrote for Morgan Reyes. Morgan\nsends drafts under their own name. Read the request, the starting file if\nthere is one, and the two drafts.\n\nQuestion: Which draft would Morgan be more willing to send under their own\nname without changes?\n\nJudge what is on the page: whether it answers what was asked, whether its\nfacts match the request, and whether it reads as Morgan writes (plain, short,\nno stock openers or sign-offs). Do not prefer a draft because it is longer.\n\nGive two or three sentences of reasons. Then, on the last line, write only\nLEFT, RIGHT or TIE, or UNKNOWN if you can't tell.\"\"\"\n\n[frozen]\ndate = \"\"\nhash = \"\"\n\n[provenance]\nwritten_by = \"Claude (claude-opus-5-5), by hand, for the live session of 27 October\"\ndate = \"2026-10-27\"\nskill = \"experiment-intake 1\"\n","demo-voice-reordered":"# Demonstration 2 of 3: round D reorders the voice file's sections, not a word changed. Nothing should move.\n# A demonstration for the live session: two prompts, two rounds, one repeat\n# (4 runs; about 3 minutes with --jobs 4). It is not a full experiment: a\n# full one has both controls, at least four development prompts and two\n# repeats (see class-assistant/experiment.toml, whose prompts, round files and\n# starting files this file uses). Wren and Morgan Reyes are fictional.\nschema = \"skill-eval-lite/experiment@1\"\ndemo = true\nfiles_from = \"class-assistant\"\ntitle = \"Does reordering the voice file change anything? (demonstration: a control that should not)\"\npurpose = \"\"\"\nWren drafts replies, summaries and briefs for Morgan Reyes, who sends them\nunder Morgan's own name. The outputs are for Morgan to send or read with as\nfew changes as possible.\"\"\"\ncriterion = \"\"\"\nA good output could go out under Morgan's name without changes: it answers\nwhat was asked, gets the facts from the request and the knowledge graph right,\nand reads as Morgan writes (plain, short, no stock openers or sign-offs).\"\"\"\njudging_question = \"Which draft would Morgan be more willing to send under their own name without changes?\"\nrepeats = 1\nseed = 5502\n\n[system]\nname = \"Wren, Morgan Reyes's assistant (the class assistant; fictional)\"\nkind = \"assistant\"\nfolder = \"the class assistant: python3 run_ab.py setup ../class-assistant\"\n\n[[system.parts]]\nid = \"voice\"\npath = \".claude/identity/voice.md\"\nwords = 1173\nreaches_model = \"imported by CLAUDE.md\"\n\n[[rounds]]\nid = \"A\"\nlabel = \"As it is\"\nrole = \"baseline\"\nchange = { how = \"as-is\" }\n\n[[rounds]]\nid = \"D\"\nlabel = \"Voice file, sections reordered\"\nrole = \"control-should-not-change\"\nchange = { part = \"voice\", how = \"neutral-edit\", file = \"rounds/D/.claude/identity/voice.md\" }\nexpected = { direction = \"same\" }\nwhy = \"The same sections in a different order, not a word changed. Anything that moves here is moving on noise.\"\n\n[[comparisons]]\nbaseline = \"A\"\nnew = \"D\"\n\n[controls]\ntolerance = 0.10\n\n[[behaviors]]\nid = \"uses-the-board-register\"\ndescription = \"Writes in the board register: the decision first, abbreviations expanded, a source for every figure. Only for the board.\"\n\n[prompts]\ndevelopment = [\"reply-to-priya\", \"summarize-committee-notes\"]\nheld_out = [\"reply-to-school\"]\nsealed = true\n\n# Each prompt: its text, the starting files, tags, the behaviors it should\n# and should not show, and a reference output (Anthropic's step 2): a\n# known-good answer that proves the task can be done and that every product\n# check passes on (a positive control).\n[[prompt]]\nid = \"reply-to-priya\"\ntitle = \"Reply to Priya about the site visit and the report\"\ntags = [\"voice\", \"reply\", \"funder\", \"in-graph\"]\nshould = [\"uses-the-graph\"]\nshould_not = [\"uses-the-board-register\"]\nfiles = [\"input/priya-email.md\"]\ntext = \"\"\"\nPriya wants to move Friday's site visit. Her email is in input/priya-email.md.\nTuesday the 17th at 10 works for me and Dana. We can't send the interim report\nearly, because our finance close isn't done until the 25th, but it will be in\nby the 30th. Draft a reply.\"\"\"\nreference = \"\"\"\nPriya,\n\nTuesday the 17th at 10 works for Dana and me. Same plan as before: an hour together, then the walk through the Elm Street site.\n\nWe can't send the interim report early. Our finance close isn't done until the 25th, and the report needs those numbers. It will be with you by November 30.\n\nMorgan\"\"\"\n\n[[prompt]]\nid = \"summarize-committee-notes\"\ntitle = \"Summarize the finance committee's notes for the committee\"\ntags = [\"voice\", \"summary\", \"board\"]\nshould = [\"uses-the-board-register\"]\nshould_not = [\"uses-the-graph\"]\nfiles = [\"input/committee-notes.md\"]\ntext = \"\"\"\nHere are my notes from Thursday's Riverside finance committee meeting\n(input/committee-notes.md). Turn them into a short summary I can send to the\ncommittee: what we decided, who does what by when, and what is still open.\nSave it in drafts/.\"\"\"\nreference = \"\"\"\nRiverside finance committee, Thursday 5 November\n\nFor the board: the committee asks the full board to decide on 19 November whether to move 5,000 from the operating reserve to program supplies. Alicia Moreno asked for a one-page explanation first.\n\nWho does what\n- Ellis Park sends corrected first-quarter actuals by Tuesday 10 November.\n- Ellis asks the auditor whether fieldwork can move to February.\n- Morgan sends Ellis the cover memo draft by Wednesday 11 November.\n- The packet goes to the board on Thursday 12 November.\n\nStill open\n- When the audit fieldwork happens. The auditor wants January; Ellis has two staff out then.\n- Program supplies: next summer's camp supplies were bought in September, which may explain why the line is over budget for the quarter, by about 6,500 (committee notes; Ellis is confirming).\n\nNext meeting: Thursday 3 December.\n\nMorgan\"\"\"\n\n[[prompt]]\nid = \"reply-to-school\"\ntitle = \"Answer Ms. Okafor about the trip\"\ntags = [\"voice\", \"reply\", \"household\", \"not-in-graph\"]\nshould_not = [\"uses-the-graph\", \"uses-the-board-register\"]\nfiles = [\"input/school-email.md\"]\ntext = \"\"\"\nCan you answer Ms. Okafor for me? Her email is in input/school-email.md. Yes to\nthe trip, and I've signed the form and will send it in with the fee tomorrow.\nI can't chaperone that day, sorry.\"\"\"\nreference = \"\"\"\nMs. Okafor,\n\nYes to the trip. I've signed the form, and it'll come in with the fee tomorrow. I can't chaperone that day, sorry.\n\nMorgan\"\"\"\n\n[model]\nrunner = \"claude-code\"\nmodel = \"claude-sonnet-5-5\"\nallowed_tools = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\ntimeout_seconds = 300\nmax_budget_usd = 1.00\nnote = \"The same model and settings for every round. Personal settings, memory and connectors are left out of every run.\"\n\n# Checks run by the wizard on every output. contains: every text must appear;\n# not-contains: none may appear. A failed or timed-out run fails every check.\n\n[[checks]]\nid = \"no-forbidden-characters\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"—\", \"–\", \"“\", \"”\", \"‘\", \"’\", \"…\"]\nshows = \"The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters.\"\ndoes_not_show = \"That the draft sounds like Morgan, or that it is right.\"\n\n[[checks]]\nid = \"no-stock-phrases\"\nkind = \"not-contains\"\nobject = \"product\"\ntext = [\"Dear \", \"Best regards\", \"Warmly\", \"Sincerely\", \"I hope this email finds you well\", \"Please be advised\", \"As per our discussion\", \"circle back\", \"touch base\"]\nshows = \"None of the openers, sign-offs and phrases the voice file says Morgan never uses.\"\ndoes_not_show = \"That the draft avoids every phrase Morgan would not use.\"\n\n[[checks]]\nid = \"short-enough\"\nkind = \"word-count\"\nobject = \"product\"\nmax = 160\ntags = [\"reply\"]\nshows = \"A reply is short, as Morgan's are.\"\ndoes_not_show = \"That it says everything it needs to.\"\n\n[[checks]]\nid = \"names-the-new-date\"\nkind = \"contains\"\nobject = \"product\"\ntext = [\"17\"]\nprompts = [\"reply-to-priya\"]\nshows = \"The reply mentions the 17th.\"\ndoes_not_show = \"That it proposes the 17th at 10, or gets the report right.\"\n\n[[checks]]\nid = \"stayed-in-bounds\"\nkind = \"trace-no-tool-outside\"\nobject = \"process\"\nallowed = [\"Read\", \"Write\", \"Edit\", \"Glob\", \"Grep\", \"Skill\", \"Bash kb/kb *\"]\nshows = \"Every step used a tool on the allowed list.\"\ndoes_not_show = \"That each step was a good one.\"\n\n[judge]\nmodel = \"claude-sonnet-5-5\"\ndecision = \"The last line of the response is LEFT, RIGHT, TIE or UNKNOWN.\"\nprompt = \"\"\"\nYou are judging two drafts that an assistant wrote for Morgan Reyes. Morgan\nsends drafts under their own name. Read the request, the starting file if\nthere is one, and the two drafts.\n\nQuestion: Which draft would Morgan be more willing to send under their own\nname without changes?\n\nJudge what is on the page: whether it answers what was asked, whether its\nfacts match the request, and whether it reads as Morgan writes (plain, short,\nno stock openers or sign-offs). Do not prefer a draft because it is longer.\n\nGive two or three sentences of reasons. Then, on the last line, write only\nLEFT, RIGHT or TIE, or UNKNOWN if you can't tell.\"\"\"\n\n[frozen]\ndate = \"\"\nhash = \"\"\n\n[provenance]\nwritten_by = \"Claude (claude-opus-5-5), by hand, from the class intake\"\ndate = \"2026-10-26\"\nskill = \"experiment-intake 1\"\n"},"suites":{"data":{"schema":"skill-eval-lite/suites@1","title":"Board drafts and how Wren prepares a brief","suites":[{"id":"board-drafts","object":"product","what":"Drafts that Wren writes for the Riverside board or its finance committee, which Morgan sends under their own name. Six real drafts, made by the class assistant's demonstration runs on 2026-10-26.\n","file":"output.md","items":["summary-1","summary-2","summary-3","summary-4","note-1","note-2"],"tests":[{"id":"no-shorthand","kind":"mechanical","question":"Does the committee's shorthand (Q1, cttee, mtg) reach a board document?","criterion":"Passes when none of Q1, cttee or mtg appears in the draft.","why":"A program can settle whether a string appears; a person would miss one.","check":{"kind":"not-contains","text":["Q1","cttee","mtg"]}},{"id":"facts-match-the-source","kind":"llm","question":"Does every date, amount, name and decision in the draft match its source?","criterion":"Passes when every date, amount, name and decision in the draft can be found in the source (the notes or the email) or the request, unchanged. A fact that is added, changed or contradicted fails. Unknown when the source can't settle it.\n","why":"Matching facts across two documents needs reading, not a pattern.","prompt":"tests/facts-match-the-source/prompt.md","model":"claude-sonnet-5-5","decision":"The last line of the response is PASS, FAIL or UNKNOWN."},{"id":"sendable","kind":"human","form":"rating","question":"Would Morgan send this draft as it is?","criterion":"A rating from 1 to 4 on the scale below; 3 or 4 counts as a pass.","why":"Whether a draft is sendable de
