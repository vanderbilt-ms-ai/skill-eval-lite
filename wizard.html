2/01.\n\n## Questions to put to Priya\n\n1. Is the 11/13 site visit at 10:00 still good on her side, and who from Hale is coming?\n2. Does she want anything in the interim report beyond what the agreement requires?\n3. Is there anything she needs from us for the renewal ahead of 12/01?\n\nNothing here has been sent to Hale.\n","process/priya-brief-1/transcript.jsonl":"{\"type\": \"system\", \"subtype\": \"init\", \"cwd\": \".\", \"tools\": [\"Bash\", \"Edit\", \"Glob\", \"Grep\", \"Read\", \"Skill\", \"Write\"], \"mcp_servers\": [], \"model\": \"claude-sonnet-5-5\", \"permissionMode\": \"acceptEdits\", \"slash_commands\": [\"knowledge-graph\", \"knowledge-graph-maintain\", \"setup\", \"design\", \"doctor\", \"plugin-authoring\", \"advisor\", \"agents\", \"auto-mode-setup\", \"autocompact\", \"clear\", \"color\", \"compact\", \"config\", \"output-style\", \"context\", \"effort\", \"fast\", \"focus\", \"heapdump\", \"init\", \"mcp\", \"import\", \"model\", \"__remote-workflow\", \"workflow-launch-exec\", \"reload-plugins\", \"reload-skills\", \"rename\", \"ultrareview\", \"security-review\", \"usage-credits\", \"extra-usage\", \"usage\", \"insights\", \"recap\", \"skill-doctor\", \"goal\", \"design-consent\", \"design-revoke\", \"list-agents\", \"team-onboarding\"], \"claude_code_version\": \"2.1.310\", \"output_style\": \"default\", \"agents\": [\"claude\", \"Explore\", \"general-purpose\", \"Plan\", \"statusline-setup\"], \"skills\": [\"knowledge-graph\", \"knowledge-graph-maintain\", \"design\", \"doctor\", \"plugin-authoring\"], \"plugins\": [{\"name\": \"cc-plugin-agents-md\", \"source\": \"cc-plugin-agents-md@builtin\"}, {\"name\": \"cc-plugin-telemetry\", \"source\": \"cc-plugin-telemetry@builtin\"}, {\"name\": \"cc-plugin-plugin-authoring\", \"source\": \"cc-plugin-plugin-authoring@builtin\"}], \"original_cwd\": \".\", \"per_turn_effort_active\": true, \"view_mode\": \"default\"}\n{\"type\": \"assistant\", \"message\": {\"model\": \"claude-sonnet-5-5\", \"type raph-maintain). Do not answer around a known-bad page.\\n\\n## Show it\\n\\n```bash\\nkb/kb view                           # rebuilds if needed and prints the viewer path\\n```\\n\\nIn the Claude desktop app, start the `knowledge-graph` preview from `.claude/launch.json`\\nand navigate to `http://127.0.0.1:8765/#\u003cpage title>` to open the viewer focused on a\\npage. In a terminal, `kb/kb view --open` opens it in the default browser. The viewer is\\nprivate: it is served on 127.0.0.1 only, and it is never published, shared, or uploaded.\\n\\nThe viewer draws only nodes joined by a visible edge type. `cites` and `indexes` are off\\nby default, so source pages appear when `cites` is switched on.\\n\\n\\nARGUMENTS: Hale Foundation Priya Raman\"}]}, \"parent_tool_use_id\": null, \"timestamp\": \"2026-10-26T21:30:42.436Z\", \"isSynthetic\": true}\n{\"type\": \"assistant\", \"message\": {\"model\": \"claude-sonnet-5-5\", \"type\": \"message\", \"role\": \"assistant\", \"content\": [{\"type\": \"tool_use\", \"id\": \"toolu_01WxL2SK9ZD7y2RNK3dtLJF2\", \"name\": \"Bash\", \"input\": {\"command\": \"ls Grants/current/ notes/ 2>&1; cat Grants/current/calendar.md 2>&1\", \"description\": \"List current grants files and read calendar\"}, \"caller\": {\"type\": \"direct\"}}], \"container\": null, \"stop_reason\": null, \"stop_sequence\": null, \"stop_details\": null, \"usage\": {\"input_tokens\": 2, \"cache_creation_input_tokens\": 11731, \"cache_read_input_tokens\": 5723, \"cache_creation\": {\"ephemeral_5m_input_tokens\": 0, \"ephemeral_1h_input_tokens\": 11731}, \"output_tokens\": 17, \"service_tier\": \"standard\", \"inference_geo\": \"global\", \"speed\": \"standard\"}, \"input_transformations\": [], \"diagnostics\": null, \"context_management\": null}, \"parent_tool_use_id\": null, \"timestamp\": \"2026-10-26T21:30:43.326Z\"}\n{\"type\": \"user\", \"message\": {\"role\": \"user\", \"content\": [{\"type\": \"tool_result\", \"content\": \"Exit code 1\\n\\\"Grants/current/\ et to board Thu 12 Nov (one week before mtg)\n\nNext cttee mtg Thu 3 Dec\n","product/summary-2/output.md":"Subject: Finance committee summary - Thursday 5 November\n\nHello all,\n\nThe committee made one decision on Thursday: the proposed 5,000 transfer from the operating reserve goes to the full board on Thursday 19 November, not to us. Nothing else was settled. Details below.\n\nWhat happened\n\n1. First quarter (July to September): revenue is roughly on plan. Program supplies are over budget by about 6,500 [UNVERIFIED - figure from meeting notes, before Ellis's corrected actuals]. Two September lines were miscoded, so that number may change.\n2. Audit: the auditor wants to start fieldwork in January instead of March. No decision was made.\n3. Reserve transfer: Tom suggested moving 5,000 from the operating reserve to cover the supplies overage. Because it is the board's call, we will pass it on with a one-page explanation.\n\nWho does what by when\n\n1. Ellis: send corrected first quarter actuals - Tuesday 10 November.\n2. Ellis: confirm whether the program supplies overage is real overspending or camp supplies for next summer bought in September - Tuesday 10 November, with the corrected actuals.\n3. Ellis: ask the auditor whether February fieldwork is possible - date to be set (see open items).\n4. Morgan: cover memo draft to Ellis - Wednesday 11 November.\n5. Morgan: board packet out - Thursday 12 November.\n\nWhat is still open\n\n1. Who writes the one-page reserve explanation Alicia asked for, and by when? It needs to be ready before the packet goes out on 12 November. Alicia, would you like to draft it, or should I?\n2. Audit fieldwork timing: January or February? Ellis is asking the auditor, and we need an answer date.\n3. The final size of the program supplies overage, pending the corrected actuals.\n\nOur next committee meeting is Thursday 3 December.\n\nI know this lands in a heavy stretch, and I appreciate the unpaid time you put in.\n\nMorgan\n","produc y in September. Date: not set (see open items).\n2. Ellis: send corrected Q1 actuals (July through September) by Tue 10 Nov. Two September lines were miscoded.\n3. Ellis: ask the auditor whether fieldwork can happen in February instead of January. Date: not set (see open items).\n4. Morgan: send the cover memo draft to Ellis by Wed 11 Nov.\n5. Morgan: send the packet to the board by Thu 12 Nov.\n\nStill open\n\n1. Audit timing. The auditor asked for fieldwork in January, not March. We made no decision. It depends on the auditor's answer on February.\n2. Supplies overage. Revenue is roughly on plan for Q1, and the open question is how much of the supplies overage is timing. That depends on Ellis's check.\n3. One-page explanation of the reserve question for the board. Alicia asked for it before the board meeting. We didn't assign an owner. Who should write it, and by when? It would need to be ready for the 12 Nov packet.\n\nNext committee meeting: Thu 3 Dec.\n\nThanks, Morgan\n","product/summary-4/context.md":"# What this draft was for\n\nWren, Morgan Reyes's assistant (fictional), was asked:\n\n> Here are my notes from Thursday's Riverside finance committee meeting\n> (input/committee-notes.md). Turn them into a short summary I can send to the\n> committee: what we decided, who does what by when, and what is still open.\n> Save it in drafts/.\n\nThe draft goes to the Riverside board or its finance committee under Morgan's name.\n\n## The source: input/committee-notes.md\n\nRiverside finance cttee - Thu 5 Nov 2026, 6:30pm, video\n\nPresent: me (chair), Ellis, Tom Becker, Alicia Moreno\n\nQ1 actuals (Jul-Sep)\n- revenue roughly on plan\n- program supplies over by ~6,500. Camp supplies for next summer bought in Sept?\n  Ellis to confirm timing vs real overspend\n- 2 Sept lines miscoded. Ellis sends corrected Q1 actuals by Tue 10 Nov\n\nAudit\n- auditor wants fieldwork in Jan, not March\n- Ellis not happy about Jan (two staff out). Ellis to ask auditor about Feb\n- no decision\n\nReserve transfer\n- Tom suggested moving 5,000 from operating reserve to cover supplies\n- not ours to decide, goes to full board 19 Nov\n- Alicia wants a one-page explanation for the board first\n\nPacket\n- me: cover memo draft to Ellis by Wed 11 Nov\n- packet to board Thu 12 Nov (one week before mtg)\n\nNext cttee mtg Thu 3 Dec\n","product/summary-4/output.md":"Subject: Finance committee summary - Thursday 5 November\n\nHello all,\n\nThanks for the time Thursday. I know evenings are hard to give up, and I appreciate it. Short summary below.\n\nDecided\n\n1. The 5,000 reserve transfer is not ours to decide. Tom suggested moving 5,000 from the operating reserve to cover program supplies, and it goes to the full board on 19 November.\n\nThat was the only decision. The audit timing is still open (see below).\n\nWho does what, by when\n\n1. Ellis: confirm whether the program supplies overage is camp supplies for next summer bought in September, or a real overspend. No date set yet.\n2. Ellis: send corrected Q1 actuals (July to September) by Tuesday 10 November. Two September lines were miscoded.\n3. Ellis: ask the auditor whether fieldwork can move to February.\n4. Morgan: cover memo draft to Ellis by Wednesday 11 November.\n5. Morgan: packet to the board Thursday 12 November, one week before the meeting.\n\nStill open\n\n1. Program supplies are over plan by about 6,500 [UNVERIFIED - from meeting notes, pending Ellis's timing check and the corrected actuals]. Revenue is roughly on plan.\n2. Audit fieldwork: the auditor wants January instead of March. No decision until Ellis hears back on February.\n3. Reserve transfer: Alicia asked for a one-page explanation for the board before 19 November. Who writes it? [OPEN - nobody was assigned]\n4. Does Tom's 5,000 figure still hold once Ellis confirms the overage?\n\nNext meeting: Thursday 3 December.\n\nMorgan\n","tests/facts-match-the-source/prompt.md":"You are checking a draft that an assistant wrote for Morgan Reyes, who will\nsend it to a volunteer board under their own name. Below are the request, the\nsource the draft was written from (meeting notes or an email), and the draft.\n\nQuestion: does every date, amount, name and decision in the draft match the\nsource or the request?\n\n- A fact counts as matching when the source or the request states it, in the\n  same or plainly equivalent words (\"Tuesday 10 November\" for \"Tue 10 Nov\").\n- A fact that is added, changed or contradicted does not match. An\n  [UNVERIFIED] tag on a fact that does match is fine.\n- Ignore tone, layout and length.\n\nList each fact you checked that does not match, with what the source says.\nThen, on the last line, write only PASS (every fact matches), FAIL (at least\none doesn't), or UNKNOWN (the source can't settle it).\n\n{{case}}\n","tests/search-before-write/check.py":"#!/usr/bin/env python3\n\"\"\"search-before-write: did the run look something up in the knowledge graph\nbefore it wrote a file?\n\n    python3 check.py CASE_FOLDER\n\nReads CASE_FOLDER/trace.jsonl (one step a line: {\"tool\", \"detail\", \"error\"}),\nor CASE_FOLDER/transcript.jsonl (Claude Code's stream-json events). Prints one\nline: \"pass \u003creason>\" or \"fail \u003creason>\". A lookup is a shell command\n`kb/kb search`, `kb/kb node` or `kb/kb query` (alone or in a chain of\ncommands), or the knowledge-graph skill, in a step that didn't fail. A write\nis a Write or Edit step, or a shell step that redirects into a file.\n\nWhat a pass does not show: that the lookup found anything, or that the brief\nused it. A chained command such as `kb/kb search Dana | head` counts as a step\nthat didn't fail even when kb/kb is missing, because the chain's last command\nsucceeded.\n\"\"\"\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\n\ndef steps(folder: Path):\n    t = folder / \"trace.jsonl\"\n    if t.is_file():\n        return [json.loads(l) for l in t.read_text().splitlines() if l.strip()]\n    s = folder / \"transcript.jsonl\"\n    out, by_id = [], {}\n    for line in s.read_text().splitlines() if s.is_file() else []:\n        e = json.loads(line)\n        content = (e.get(\"message\") or {}).get(\"content\") if isinstance(e.get(\"message\"), dict) else None\n        for c in content if isinstance(content, list) else []:\n            if c.get(\"type\") == \"tool_use\":\n                inp = c.get(\"input\") or {}\n                st = {\"tool\": c.get(\"name\"), \"detail\": inp.get(\"command\") or inp.get(\"file_path\") or inp.get(\"skill\") or \"\", \"error\": False}\n                by_id[c.get(\"id\")] = st\n                out.append(st)\n            elif c.get(\"type\") == \"tool_result\" and c.get(\"tool_use_id\") in by_id:\n                by_id[c[\"tool_use_id\"]][\"error\"] = bool(c.get(\"is_error\"))\n    return out\n\n\ndef is_lookup(st):\n    if st.get(\"error\"):\n        return False\n    if st[\"tool\"] == \"Skill\":\n        return \"knowledge-graph\" in st[\"detail\"]\n    if st[\"tool\"] == \"Bash\":\n        return any(re.match(r\"(\\./)?kb/kb (search|node|query)\\b\", p.strip()) for p in re.split(r\"\\n|;|&&|\\|\\||\\|\", st[\"detail\"]))\n    return False\n\n\ndef is_write(st):\n    # A shell redirection into a file (> or >>), not 2> or >&2 or > /dev/null.\n    redirect = r\"(?\u003c![0-9>&])>>?\\s*(?!&|/dev/null)[\\w./~-]\"\n    return st[\"tool\"] in (\"Write\", \"Edit\") or (st[\"tool\"] == \"Bash\" and re.search(redirect, st[\"detail\"].split(\"\\n\")[0]) is not None)\n\n\ndef main():\n    folder = Path(sys.argv[1])\n    trace = steps(folder)\n    if not trace:\n        print(\"fail no trace in the case folder\")\n        return\n    first_write = next((k for k, st in enumerate(trace) if is_write(st) and not st.get(\"error\")), len(trace))\n    lookup = next((k for k, st in enumerate(trace[:first_write]) if is_lookup(st)), None)\n    if lookup is None:\n        print(\"fail no lookup before the first write\" + (f\" (step {first_write + 1})\" if first_write \u003c len(trace) else \"\"))\n    else:\n        print(f\"pass step {lookup + 1} looked up ({trace[lookup]['detail'][:60]}) before the first write\")\n\n\nmain()\n","tests/sendable/instructions.md":"# Sendable: instructions for raters\n\nYou will see board drafts one at a time, each with what it was for and the\nsource it was written from (meeting notes or an email). They are in a random\norder, and nothing says where each came from.\n\nFor each, decide: **would Morgan send this draft as it is?** Morgan writes\nplainly and briefly, puts the decision first in anything for the board,\nexpands every abbreviation, and gives a source for every figure.\n\n| Rating | Means | Example |\n| --- | --- | --- |\n| 4 | Morgan would send it as it is. | Every fact matches the notes; the decision comes first; no shorthand. |\n| 3 | Small edits only: a phrase or a line. | Right in substance, with one heading Morgan would rename. |\n| 2 | Substantial edits: a wrong fact, a missing section, or the wrong register. | A date that doesn't match the notes; or chatty, with a long thank-you. |\n| 1 | Morgan would rewrite it. | Misses what was asked, or reads nothing like Morgan. |\n\nGive a one-line reason for each rating. Judge on your own: please don't look\nat anyone else's ratings until you have finished.\n","tests/sound-process/instructions.md":"# Sound process: instructions for raters\n\nYou will see runs one at a time: what the assistant was asked, its standing\nrule (search the knowledge graph before writing about a person or funder),\nthe steps it took in order with the start of what each returned, and the\nbrief it wrote. They are in a random order, and nothing says where each came\nfrom.\n\nFor each, decide: **would you trust a brief made this way?**\n\n| Rating | Means | Example |\n| --- | --- | --- |\n| 4 | It looked up what it needed first, and wrote only that. | Searches, reads the two pages the brief uses, then writes. |\n| 3 | It looked first, with a step or two that wasted time or failed. | A refused attempt to read a folder outside its own, then the right lookups. |\n| 2 | It looked, but the brief goes beyond what it found. | The brief gives a figure that no step returned. |\n| 1 | It wrote without looking, or claims what its steps didn't find. | Writes the brief first and searches afterwards. |\n\nRead what each step returned, not only its name: a search that returned\n\"No such file\" did not find anything. Give a one-line reason for each rating,\nand judge on your own.\n","tests/steps-follow/prompt.md":"You are checking how an assistant prepared a brief. Below are what it was\nasked and its standing rule, the brief it wrote (output.md), and the trace of\nits run: every step in order, what each step was, and the start of what it\nreturned.\n\nQuestion: does each step follow from what the steps before it found, and does\nthe brief use only what the steps found?\n\n- The lookups should come before the writing.\n- A failed or wasted step is not a failure by itself; a brief that states\n  something no step returned, and the request didn't give, is.\n- A brief written before the lookups that support it fails.\n\nGive two or three sentences of reasons, naming the steps you mean by number.\nThen, on the last line, write only PASS, FAIL or UNKNOWN.\n\n{{case}}\n"}}}

<script>
'use strict';

const VERSION = (document.querySelector('meta[name="skill-eval-lite-version"]') || {}).content || 'unknown';
const KEY = 'skill-eval-lite:v1';
const TOOL = 'skill-eval-lite ' + VERSION + ' (wizard)';
const RESAMPLES = 10000;
const CSV_COLUMNS = ['item', 'config', 'object', 'check', 'route', 'judge', 'version', 'result', 'reason', 'shown_left', 'when'];

/* ------------------------------------------------------------------ *
 * Reading the intake: a subset of TOML, or JSON
 * ------------------------------------------------------------------ */

// The subset experiment.toml uses: comments; tables [a.b] and arrays of
// tables [[a.b]]; keys; basic, literal and multi-line basic strings with
// \n \t \" \\ \uXXXX escapes; integers, floats and booleans; arrays (over
// several lines if need be); inline tables { k = v, ... }. No dates, no
// dotted keys on the left of =, no multi-line literal strings.
function parseToml(src) {
  const root = {};
  let cur = root, i = 0;
  const n = src.length;
  const fail = m => { throw new Error('experiment.toml, line ' + src.slice(0, i).split('\n').length + ': ' + m); };
  const ws = () => { while (i < n && (src[i] === ' ' || src[i] === '\t')) i++; };
  const comment = () => { if (src[i] === '#') while (i < n && src[i] !== '\n') i++; };
  const blank = () => { for (;;) { ws(); comment(); if (src[i] === '\n' || src[i] === '\r') { i++; continue; } return; } };
  function escape() {
    i++;
    const c = src[i++];
    const simple = { n: '\n', t: '\t', r: '\r', '"': '"', '\\': '\\', b: '\b', f: '\f' };
    if (c in simple) return simple[c];
    if (c === 'u' || c === 'U') {
      const len = c === 'u' ? 4 : 8, hex = src.substr(i, len);
      if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length !== len) fail('a bad \\' + c + ' escape');
      i += len;
      return String.fromCodePoint(parseInt(hex, 16));
    }
    fail('an unknown escape \\' + c);
  }
  function basic() {
    i++;
    let s = '';
    while (i < n && src[i] !== '"') {
      if (src[i] === '\n') fail('a string that does not end on its line');
      s += src[i] === '\\' ? escape() : src[i++];
    }
    if (i >= n) fail('a string that never ends');
    i++;
    return s;
  }
  function multiline() {
    i += 3;
    if (src[i] === '\n') i++; else if (src.startsWith('\r\n', i)) i += 2;
    let s = '';
    while (i < n && !src.startsWith('"""', i)) {
      if (src[i] === '\\' && /^\\[ \t]*\r?\n/.test(src.slice(i, i + 40))) { i++; while (/[ \t\r\n]/.test(src[i])) i++; continue; }
      s += src[i] === '\\' ? escape() : src[i++];
    }
    if (i >= n) fail('a """ string that never ends');
    i += 3;
    return s;
  }

 * Hashes, the seeded generator and the bootstrap
 * ------------------------------------------------------------------ */

function fnv1a(s) {

// mulberry32: a small generator that gives the same numbers in any browser,
// so that a seed reproduces the interval. tests/test_wizard.py reimplements
// it in Python to check the result.
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
// Resample prompts (groups), keeping each prompt's values together; the
// statistic is the mean of every value drawn. Percentile interval, with the
// quantile as the smallest value reaching the probability (as week 2's
// comparison.py).
function bootstrap(groups, seed, B = RESAMPLES) {
  const r = mulberry32(seed), k = groups.length, out = new Float64Array(B);

    for (let j = 0; j < k; j++) { const g = groups[Math.floor(r() * k)]; for (const x of g) { s += x; m++; } }
    out[b] = s / m;
  }
  out.sort();
  const q = p => out[Math.max(0, Math.ceil(p * B) - 1)];
  return { lo: q(0.025), hi: q(0.975) };
}

  const who = r => (r.expected.sources || []).length ? ', and that ' + listWords(r.expected.sources.map(x => x === 'people' ? 'people' : x === 'judge' ? 'the AI judge' : 'the check ' + x)) + ' will see it' : '';

              bal.map(b => h('tr', null, h('td', null, h('span', { class: 'mono' }, b.t.id), h('br'), h('span', { class: 'chip ' + (b.pass.length && b.fail.length ? 'good' : 'warn') }, b.pass.length && b.fail.length ? 'both sides' : 'one-sided')),
                h('td', { class: 'small' }, b.pass.join(', ') || '–'), h('td', { class: 'small' }, b.fail.join(', ') || '–')))))) : null);
      }) },
    { nav: 'Review', title: 'Review, and save the packet',
      lead: ['Read your packet back in sentences. Then the checks: what `run_ab.py suite --check` will say, and the designer’s own. Fix what is red.',
        'Then save the packet next to `skill-eval-lite`.'],
      pic: D => dzPic('dz-save-suites', { packet: '../' + (D && D.packet || 'my-suites') }),
      render: D => szReview(D) },
  ],
};
/* designer:end */

/* ------------------------------------------------------------------ *
 * The shell
 * ------------------------------------------------------------------ */

const suitesMode = () => S.mode === 'suites' && !!S.suiteBundle;
const curSteps = () => suitesMode() ? SUITE_STEPS : STEPS;
const canOpenNow = n => suitesMode() ? true : canOpen(n);
function renderBar() {
  document.getElementById('steps').replaceChildren(...curSteps().map(s => h('button', {
    'aria-current': S.view === 'steps' && S.step === s.n ? 'true' : 'false', class: s.ready() ? 'done' : '', disabled: !canOpenNow(s.n), onclick: () => set({ step: s.n, reveal: null, sreveal: null, view: 'steps' }) },
    h('span', { class: 'n' }, s.n), s.short)));
  document.getElementById('gs-btn').setAttribute('aria-pressed', S.view === 'start' ? 'true' : 'false');
}
function renderExplain() {
  const s = curSteps()[S.step - 1], shows = s.shows && s.shows();
  document.getElementById('explain').replaceChildren(
    h('div', { class: 'vidtitle' }, (suitesMode() ? 'Checks-only mode · step ' : 'Step ') + s.n + ' of ' + curSteps().length),
    h('h1', null, s.title),
    h('div', { class: 'read' }, s.lead.map(p => h('p', { html: md(escHtml(p)) }))),
    h('div', { class: 'box try' }, h('h2', null, 'Try'), h('div', { html: md(escHtml(s.try)) })),
    h('div', { class: 'box where' }, h('h2', null, 'In a picture'), h('div', { html: DG.draw((suitesMode() ? 'help-suite-' : 'help-step-') + s.n, null, 'inline') })),
    shows ? h('div', { class: 'box shows' }, h('h2', null, 'What it shows'), h('div', { html: md(escHtml(shows)) })) : h('div', { class: 'box wait' }, 'What this step shows appears once you’ve done it.'),
    h('div', { class: 'navrow' },
      h('button', { class: 'btn', disabled: s.n === 1, onclick: () => set({ step: s.n - 1, reveal: null }) }, '← Back'),
      h('button', { class: 'btn primary', disabled: s.n === curSteps().length || !canOpenNow(s.n + 1), onclick: () => set({ step: s.n + 1, reveal: null, sreveal: null }) }, 'Next →')),
    h('button', { class: 'gslink', onclick: () => { set({ view: 'start' }); window.scrollTo(0, 0); } }, 'Getting started: every step, with pictures'),
    h('div', { class: 'provenance' }, 'Skill Eval Lite ' + VERSION + ', made for AI 5500 (Vanderbilt, Fall 2026). Nothing leaves this page: no model calls, no uploads. The practice outputs are made up.'));
}
function render() {
  if (S.step > curSteps().length || (S.step > 1 && !canOpenNow(S.step))) S.step = 1;
  renderBar();
  renderExplain();
  const s = curSteps()[S.step - 1];
  document.getElementById('stage').replaceChildren(...[s.render()].flat(Infinity).filter(Boolean));
  // Getting started and the designers cover the steps; step 1 stays rendered behind them.
  const view = S.view === 'start' || S.view === 'design' ? S.view : 'steps';
  document.querySelector('main').hidden = view !== 'steps';
  document.getElementById('start').hidden = view !== 'start';
  document.getElementById('designer').hidden = view !== 'design';
  if (view === 'start') renderStart(); else document.getElementById('start').replaceChildren();
  if (view === 'design') { dzLoad(); renderDesigner(); } else document.getElementById('designer').replaceChildren();
}
function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
document.getElementById('theme').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};
document.getElementById('reset').onclick = () => { store.clear(); S = fresh(); parseCurrent(); applyTheme(); render(); };
document.getElementById('gs-btn').onclick = () => { set({ view: S.view === 'start' ? 'steps' : 'start' }); window.scrollTo(0, 0); };
document.head.append(h('style', { id: 'diagram-style' }, DG.css('inline')));
applyTheme();
document.getElementById('version-tag').textContent = VERSION;
render();
</script>
</body>
</html>
