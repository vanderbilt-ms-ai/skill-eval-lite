<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Getting started with Skill Eval Lite</title>
<!--
  Skill Eval Lite: getting started. A guided tour for new students, in 22
  stops: what Shared I asks, the class assistant (Wren, for Morgan Reyes),
  the experiment file, freezing, runs, checks, blind judging, results and a
  bounded conclusion, then the commands in order.

  Morgan Reyes, Wren and everyone in their world are made up (the AI 5100
  assistant template's fictional example). The runs are real: every reply,
  trace, check result and judge verdict on these pages is copied from the
  recorded Claude Code runs in examples/recorded/, made on 2026-10-26. The
  one simulated chart (stop 18) is labelled as simulated.

  One file, no network requests, no model calls. The JSON block near the
  end is written by tutorial/build.py from the recorded runs; don't edit it
  by hand. Made for AI 5500 (Vanderbilt, Fall 2026) by Claude
  (claude-opus-5-5), 2026-10-26.
-->
<style>
:root {
  --truth: #1D6CB0; --bias: #C9561B; --null: #7A4FA8; --param: #1C7C6E; --ink: #16212B;
  --noise: #7A8791; --ok: #1F7D55; --warn: #9A6A0C; --paper: #F4F4EF;
  --bias-text: #B24A12; --null-text: #7A4FA8; --param-text: #187062; --ok-text: #1A6E4A; --warn-text: #85590A; --truth-text: #1D6CB0;
  --truth-wash: rgba(29,108,176,.12); --bias-wash: rgba(201,86,27,.12); --null-wash: rgba(122,79,168,.12);
  --param-wash: rgba(28,124,110,.14); --ok-wash: rgba(31,125,85,.12); --warn-wash: rgba(154,106,12,.13); --noise-wash: rgba(122,135,145,.18);
  --sheet: #FFFFFF; --sheet-2: #F8F8F4; --ink-2: #45515B; --ink-3: #5F6A73; --rule: #D9DAD2; --rule-2: #E9EAE3;
  --shadow: 0 1px 2px rgba(22,33,43,.05), 0 4px 18px rgba(22,33,43,.05);
  --shadow-pop: 0 2px 6px rgba(22,33,43,.08), 0 18px 48px rgba(22,33,43,.18);
  --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read: "Source Serif 4", "Source Serif Pro", Georgia, serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --r: 10px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --truth: #5BA6E8; --bias: #F0844B; --null: #B494DE; --param: #4CC0AE; --ink: #E2E8EE; --noise: #8E9BA5; --ok: #4CC08B; --warn: #E2AE4A; --paper: #0D1318;
  --truth-text: #5BA6E8; --bias-text: #F0844B; --null-text: #B494DE; --param-text: #4CC0AE; --ok-text: #4CC08B; --warn-text: #E2AE4A;
  --truth-wash: rgba(91,166,232,.16); --bias-wash: rgba(240,132,75,.15); --null-wash: rgba(180,148,222,.15);
  --param-wash: rgba(76,192,174,.16); --ok-wash: rgba(76,192,139,.14); --warn-wash: rgba(226,174,74,.14); --noise-wash: rgba(142,155,165,.2);
  --sheet: #141C23; --sheet-2: #18222A; --ink-2: #A7B4BF; --ink-3: #8593A0; --rule: #2A3640; --rule-2: #1F2A33;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.22);
  --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 56px rgba(0,0,0,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --truth: #5BA6E8; --bias: #F0844B; --null: #B494DE; --param: #4CC0AE; --ink: #E2E8EE; --noise: #8E9BA5; --ok: #4CC08B; --warn: #E2AE4A; --paper: #0D1318;
    --truth-text: #5BA6E8; --bias-text: #F0844B; --null-text: #B494DE; --param-text: #4CC0AE; --ok-text: #4CC08B; --warn-text: #E2AE4A;
    --truth-wash: rgba(91,166,232,.16); --bias-wash: rgba(240,132,75,.15); --null-wash: rgba(180,148,222,.15);
    --param-wash: rgba(76,192,174,.16); --ok-wash: rgba(76,192,139,.14); --warn-wash: rgba(226,174,74,.14); --noise-wash: rgba(142,155,165,.2);
    --sheet: #141C23; --sheet-2: #18222A; --ink-2: #A7B4BF; --ink-3: #8593A0; --rule: #2A3640; --rule-2: #1F2A33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 22px rgba(0,0,0,.22);
    --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 20px 56px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--truth); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
em { font-style: italic; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.sr { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 6px; z-index: 60; background: var(--sheet); padding: 6px 10px; border-radius: 6px; }
.skip:focus { left: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -4px; }

/* The bar and the progress strip */
.bar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.brand .tag { font-weight: 500; font-size: 11px; color: var(--truth-text); background: var(--truth-wash); padding: 2px 7px; border-radius: 99px; }
.chapters { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.chapters button { border: 1px solid transparent; background: none; border-radius: 99px; padding: 5px 10px; white-space: nowrap; color: var(--ink-2); }
.chapters button .n { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--rule-2); font-size: 11px; font-weight: 600; margin-right: 6px; color: var(--ink); }
.chapters button[aria-current="true"] { border-color: var(--rule); background: var(--sheet-2); color: var(--ink); }
.chapters button[aria-current="true"] .n { background: var(--ink); color: var(--paper); }
.iconbtn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }
.strip { height: 22px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.strip .ch { display: flex; gap: 2px; min-width: 0; }
.strip button { flex: 1 1 0; min-width: 0; width: 100%; height: 7px; border: 0; padding: 0; border-radius: 2px; background: var(--rule); position: relative; }
.strip button::before { content: ""; position: absolute; left: 0; right: 0; top: -7px; bottom: -7px; }
.strip button.seen { background: var(--noise); }
.strip button[aria-current="step"] { background: var(--truth); }

/* Layout */
.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: calc(100vh - 74px); }
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--sheet); border-right: 1px solid var(--rule); }
.rail-head { padding: 11px 20px 9px; border-bottom: 1px solid var(--rule-2); }
.eyebrow { margin: 0 0 7px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.dots { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; }
.dots button { width: 25px; height: 25px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); font-size: 11px; font-weight: 500; color: var(--ink-3); padding: 0; font-variant-numeric: tabular-nums; }
.dots button.seen { border-color: var(--ink-3); color: var(--ink-2); }
.dots button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.rail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 12px; display: flex; flex-direction: column; gap: 10px; }
.kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.rail h1 { font-size: 21px; line-height: 1.2; margin: 0; font-weight: 600; }
.rail h1:focus { outline: none; }
.read p { font-family: var(--f-read); font-size: 15px; line-height: 1.46; color: var(--ink-2); margin: 0 0 .55em; }
.read p:last-child { margin-bottom: 0; }
.box { border-radius: var(--r); padding: 9px 12px; font-size: 13.5px; line-height: 1.42; }
.box h2 { margin: 0 0 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.box p { margin: 0; }
.box.try { background: var(--truth-wash); }
.box.try h2 { color: var(--truth-text); }
.box.shows { background: var(--ok-wash); }
.box.shows h2 { color: var(--ok-text); }
.box.wait { background: var(--sheet-2); color: var(--ink-3); border: 1px dashed var(--rule); }
.rail-foot { display: flex; justify-content: space-between; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--rule-2); }
.stage { overflow: auto; min-height: 0; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.stage-foot { display: none; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 13px; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }

/* Panels and pieces */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 7px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.panel h3 .muted { font-weight: 400; }
.panel p { margin: 0 0 6px; }
.panel p:last-child { margin-bottom: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
.grid2.wide-left { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
.grid2.wide-right { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 500; background: var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.chip.real { background: var(--ok-wash); color: var(--ok-text); }
.chip.made { background: var(--warn-wash); color: var(--warn-text); }
.chip.sim { background: var(--truth-wash); color: var(--truth-text); }
.chip.ctl { background: var(--warn-wash); color: var(--warn-text); }
.chip.same { background: var(--null-wash); color: var(--null-text); }
.chip.good { background: var(--ok-wash); color: var(--ok-text); }
.chip.bad { background: var(--bias-wash); color: var(--bias-text); }
.mark { font-weight: 700; }
.mark.pass { color: var(--ok-text); } .mark.fail { color: var(--bias-text); }
.doc { font-family: var(--f-read); font-size: 14px; line-height: 1.42; padding: 8px 11px; background: var(--sheet-2); border-left: 3px solid var(--ink); border-radius: 0 6px 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.doc.mail { border-left-color: var(--noise); font-family: var(--f-ui); font-size: 12.5px; }
.doc.scroll, pre.scroll { overflow-y: auto; }
pre.code { font-family: var(--f-mono); font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sheet-2); border: 1px solid var(--rule-2); border-radius: 8px; padding: 8px 10px; margin: 0; }
.cmd { font-family: var(--f-mono); font-size: 12.5px; background: var(--sheet-2); border: 1px solid var(--rule-2); border-radius: 7px; padding: 6px 9px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.checkrow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 12.5px; }
.checkrow code { font-size: 11.5px; }
.src { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }
.note { font-size: 12.5px; color: var(--ink-2); }
.lead { font-family: var(--f-read); font-size: 15px; line-height: 1.45; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choices button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 9px; padding: 7px 12px; text-align: left; }
.choices button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.choices button.right { box-shadow: inset 0 0 0 2px var(--ok); }
.choices button.right::after { content: "  ✓"; color: var(--ok-text); font-weight: 700; }
.choices button[aria-pressed="true"].right::after { color: var(--ok); }
.choices.locked button { cursor: default; }
td .choices { flex-wrap: nowrap; }
td .choices button { padding: 4px 9px; font-size: 12.5px; }
.q { font-weight: 600; margin: 0 0 7px; }
.reveal { border-left: 3px solid var(--ok); background: var(--ok-wash); border-radius: 0 8px 8px 0; padding: 8px 11px; font-size: 13.5px; }
.reveal.warn { border-left-color: var(--warn); background: var(--warn-wash); }
.reveal.bad { border-left-color: var(--bias); background: var(--bias-wash); }
.reveal p { margin: 0 0 5px; } .reveal p:last-child { margin: 0; }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; border-bottom: 1.5px dotted var(--truth); cursor: help; border-radius: 0; }
.term:hover { background: var(--truth-wash); }

/* Stop 1: the six steps */
.stations { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; counter-reset: st; }
.station { position: relative; border: 1px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; min-height: 128px; box-shadow: var(--shadow); }
.station .num { position: absolute; top: 7px; left: 9px; font-size: 11px; font-weight: 700; color: var(--ink-3); }
.station svg { width: 46px; height: 46px; fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.station .lab { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
.station.open { border-color: var(--truth); background: var(--truth-wash); }
.station.open svg { stroke: var(--truth); }
.station:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 50%; transform: translate(50%, -50%); color: var(--ink-3); font-size: 15px; }
.real3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.real3 > div { border-radius: 9px; padding: 9px 11px; font-size: 13px; }
.real3 h4 { margin: 0 0 3px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }

/* Morgan's world */
.world { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.world.stacked { grid-template-columns: minmax(0, 1fr); gap: 7px; }
.world.stacked .lane { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 7px 10px; }
.world.stacked .lane .what { grid-column: 1; }
.world.stacked .lane h4 { grid-column: 1; }
.world.stacked .lane .person { grid-column: 2; grid-row: span 2; }
.lane { border: 1px solid var(--rule); border-radius: 10px; padding: 9px 10px; background: var(--sheet-2); display: flex; flex-direction: column; gap: 6px; }
.lane h4 { margin: 0; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.lane .what { font-size: 12px; color: var(--ink-3); }
.person { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 4px 10px 4px 5px; text-align: left; }
.person .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--rule-2); font-size: 11px; font-weight: 700; flex: none; }
.person[aria-pressed="true"] { border-color: var(--truth); background: var(--truth-wash); }
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.flow .node { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 11px; background: var(--sheet); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.flow .node b { font-size: 13px; }
.flow .node span { font-size: 12px; color: var(--ink-3); }
.flow .arr { display: grid; place-items: center; padding: 0 8px; color: var(--ink-3); font-size: 12px; text-align: center; }
.flow .arr i { font-style: normal; font-size: 16px; display: block; }

/* Morgan's week and other lists of cards */
.cards { display: grid; gap: 7px; }
.card { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 11px; text-align: left; display: flex; gap: 9px; align-items: flex-start; width: 100%; }
.card .t { font-weight: 600; font-size: 13px; display: block; }
.card .s { font-size: 12px; color: var(--ink-3); display: block; }
.card[aria-pressed="true"], .card.open { border-color: var(--truth); background: var(--truth-wash); }
.card .tick { margin-left: auto; font-size: 12px; color: var(--ok-text); font-weight: 600; white-space: nowrap; }
.card .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--rule-2); flex: none; color: var(--ink-2); }

/* The file tree */
.tree { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 12.5px; }
.tree li { margin: 0; }
.tree button, .tree .dir { display: flex; align-items: center; gap: 7px; width: 100%; border: 1px solid transparent; background: none; border-radius: 6px; padding: 2px 6px; text-align: left; }
.tree .dir { color: var(--ink-3); }
.tree button:hover { background: var(--sheet-2); }
.tree button[aria-pressed="true"] { border-color: var(--truth); background: var(--truth-wash); }
.tree .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree .role { margin-left: auto; font-family: var(--f-ui); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.dot.session { background: var(--ink); } .dot.chosen { background: var(--param); } .dot.searched { background: var(--truth); } .dot.unused { background: transparent; border: 1.5px solid var(--noise); } .dot.run { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* How Wren answers */
.how { display: grid; grid-template-columns: minmax(0, .8fr) 26px minmax(0, 1.1fr) 26px minmax(0, 1.1fr); gap: 0; align-items: stretch; }
.how .arrow { display: grid; place-items: center; color: var(--ink-3); }
.how .box3 { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); padding: 9px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.how .box3 h4 { margin: 0 0 2px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.how .item { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--rule-2); border-radius: 6px; padding: 3px 7px; color: var(--ink-3); background: var(--sheet-2); transition: background .25s, border-color .25s, color .25s; overflow-wrap: anywhere; }
.how .item.ind { margin-left: 14px; }
.how .item.was { border-color: var(--truth); color: var(--ink-2); }
.how .item.lit { border-color: var(--truth); background: var(--truth-wash); color: var(--ink); }
.how .item.dashed { border-style: dashed; }
.how .ctx { font-size: 11.5px; border-radius: 6px; padding: 3px 7px; background: var(--truth-wash); color: var(--ink); opacity: 0; transform: translateY(3px); transition: opacity .3s, transform .3s; }
.how .ctx.on { opacity: 1; transform: none; }
.how .morganfig { margin-top: auto; display: grid; place-items: center; }
.how .morganfig svg { width: 92px; height: 70px; fill: none; stroke: var(--noise); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.how .model { border: 1.5px solid var(--ink-3); border-radius: 9px; padding: 6px 8px; text-align: center; font-size: 12px; font-weight: 600; }
.how .box3.lit { border-color: var(--truth); box-shadow: 0 0 0 2px var(--truth-wash); }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper .count { font-size: 12px; color: var(--ink-3); margin-left: auto; }
.tracelist { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 11.5px; counter-reset: tr; }
.tracelist li { counter-increment: tr; display: grid; grid-template-columns: 22px 46px minmax(0, 1fr); gap: 6px; padding: 3px 6px; border-radius: 5px; align-items: baseline; }
.tracelist li::before { content: counter(tr); color: var(--ink-3); text-align: right; }
.tracelist .tool { font-weight: 600; }
.tracelist .det { overflow-wrap: anywhere; color: var(--ink-2); }
.tracelist li.hl { background: var(--truth-wash); }
.tracelist li.err .det { text-decoration: line-through; text-decoration-color: var(--bias); }
.tracelist .errtag { display: inline-block; text-decoration: none; color: var(--bias-text); font-family: var(--f-ui); font-size: 11px; white-space: nowrap; }

/* Ideas */
.ideas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.idea { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }
.idea .t { font-weight: 600; font-size: 13px; line-height: 1.25; }
.idea.ctl { background: var(--warn-wash); border-style: dashed; }
.idea[aria-pressed="true"] { border-color: var(--truth); box-shadow: 0 0 0 2px var(--truth-wash); }
dl.facts { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 13px; }
dl.facts dt { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding-top: 1px; }
dl.facts dd { margin: 0; }

/* Rounds */
.rounds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.round { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); padding: 10px 11px; display: flex; flex-direction: column; gap: 7px; box-shadow: var(--shadow); min-width: 0; }
.round .id { font-size: 26px; font-weight: 700; line-height: 1; }
.round .lab { font-weight: 600; font-size: 13px; }
.parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.parts span { font-size: 10.5px; overflow: hidden; text-align: center; border: 1px solid var(--rule); border-radius: 4px; padding: 3px 0; color: var(--ink-3); background: var(--sheet-2); line-height: 1.1; }
.parts span.edit { border-color: var(--truth); color: var(--truth-text); background: var(--truth-wash); font-weight: 700; }
.parts span.gone { border-style: dashed; text-decoration: line-through; color: var(--bias-text); background: none; }
.parts span.move { border-color: var(--null); color: var(--null-text); background: var(--null-wash); font-weight: 700; }

/* Prompts and balance */
.sealed { border: 2px dashed var(--warn); border-radius: 12px; padding: 10px; background: var(--warn-wash); display: flex; flex-direction: column; gap: 7px; position: relative; }
.sealed .seal { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--warn-text); }
.sealed .hidden { filter: blur(4px); user-select: none; }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th, table.t td { border-bottom: 1px solid var(--rule-2); padding: 5px 7px; text-align: left; vertical-align: top; }
table.t th { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
table.t td.c, table.t th.c { text-align: center; }
table.t td.hl { background: var(--truth-wash); }
.cell-q { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.cell-q button { border: 1px solid var(--truth); background: var(--sheet); border-radius: 6px; padding: 2px 7px; font-size: 11.5px; }
.should { color: var(--ok-text); font-weight: 700; }
.shouldnot { color: var(--bias-text); font-weight: 700; }

/* Freeze */
textarea.exp { width: 100%; font-family: var(--f-mono); font-size: 12px; line-height: 1.45; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet-2); padding: 8px 10px; resize: none; height: 274px; }
.hash { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; line-height: 1.5; background: var(--sheet-2); border-radius: 7px; padding: 6px 9px; border: 1px solid var(--rule-2); }
.hash b { color: var(--bias-text); font-weight: 700; }
.timeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: stretch; }
.timeline div { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 11.5px; background: var(--sheet-2); }
.timeline div.fz { border-color: var(--truth); background: var(--truth-wash); font-weight: 600; }
.bars { display: flex; gap: 14px; align-items: flex-end; height: 112px; padding: 22px 4px 20px; box-sizing: content-box; }
.bars .b i { position: absolute; bottom: -19px; left: 0; right: 0; text-align: center; font-style: normal; font-weight: 600; font-size: 12px; }
.bars .b { width: 54px; flex: none; background: var(--noise-wash); border: 1px solid var(--noise); border-bottom: 0; border-radius: 4px 4px 0 0; position: relative; }
.bars .b span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; }
.bars .b.lie { background: var(--bias-wash); border-color: var(--bias); }

/* A run */
.runsteps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.runsteps div { border: 1px solid var(--rule); border-radius: 9px; padding: 7px 6px; font-size: 11.5px; text-align: center; background: var(--sheet-2); color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.runsteps div svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.runsteps div.lit { border-color: var(--truth); background: var(--truth-wash); color: var(--ink); }
.runsteps div.past { color: var(--ink-2); }
.kept { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.kept div { font-size: 11.5px; border: 1px solid var(--rule-2); border-radius: 6px; padding: 4px 6px; background: var(--sheet-2); }
.kept code { font-weight: 600; }

/* The check that didn't move */
.pipe { display: flex; flex-wrap: wrap; gap: 4px; align-items: stretch; font-family: var(--f-mono); font-size: 11.5px; }
.pipe .p { border: 1px solid var(--rule); border-radius: 6px; padding: 4px 7px; background: var(--sheet-2); display: flex; flex-direction: column; gap: 2px; }
.pipe .p em { font-style: normal; font-family: var(--f-ui); font-size: 11px; }
.pipe .p.bad { border-color: var(--bias); } .pipe .p.bad em { color: var(--bias-text); }
.pipe .p.good em { color: var(--ok-text); }
.pipe .sep { align-self: center; color: var(--ink-3); font-weight: 700; }

/* Blind pairs */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side h4 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 7px; }
input.reason { width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 9px; background: var(--sheet); }

/* Results */
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--ink-3); font: 12px var(--f-ui); }
svg.chart .axis { stroke: var(--rule); stroke-width: 1.5; }
svg.chart .ref { stroke: var(--null); stroke-dasharray: 4 3; stroke-width: 1.5; }
svg.chart text.reft { fill: var(--null-text); }
svg.chart .bar { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
svg.chart .est { fill: var(--ink); }
svg.chart .pt { fill: var(--noise); opacity: .7; }
svg.chart .truth { stroke: var(--truth); stroke-width: 1.5; }
svg.chart text.trutht { fill: var(--truth-text); }
.chartbox { max-width: 760px; }
.slider { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.slider input { flex: 1; min-width: 160px; }
.ctrl-row td { vertical-align: middle; }
.verdict { font-size: 12px; }

/* Your turn */
pre.treeart { font-family: var(--f-mono); font-size: 12px; line-height: 1.5; margin: 0; white-space: pre; overflow-x: auto; }
pre.treeart span.hl { background: var(--truth-wash); color: var(--ink); border-radius: 3px; outline: 1px solid var(--truth); }
ol.cmds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; counter-reset: c; }
ol.cmds button { width: 100%; display: flex; gap: 9px; align-items: center; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 5px 9px; text-align: left; font-size: 13px; }
ol.cmds button .n { width: 20px; height: 20px; border-radius: 50%; background: var(--rule-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
ol.cmds button[aria-pressed="true"] { border-color: var(--truth); background: var(--truth-wash); }
ol.cmds button.wiz .n { background: var(--truth); color: var(--paper); }
.wsteps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.wsteps button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 8px 6px; display: flex; align-items: center; justify-content: center; gap: 7px; }
.wsteps button .n { width: 20px; height: 20px; border-radius: 50%; background: var(--rule-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.wsteps button[aria-pressed="true"] { border-color: var(--truth); background: var(--truth-wash); }
.passes { display: grid; grid-template-columns: 2fr 3fr; gap: 8px; margin-bottom: 6px; }
.passes div { border-top: 3px solid var(--truth); padding-top: 4px; font-size: 12px; font-weight: 600; color: var(--truth-text); text-align: center; }
.passes div.p2 { border-color: var(--ok); color: var(--ok-text); }
.between { text-align: center; font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(13,19,24,.35); z-index: 40; }
svg.dg { display: block; width: 100%; height: auto; margin: 0 auto; }
.figure-dlg { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1060px, calc(100vw - 24px)); max-height: calc(100vh - 24px); background: var(--sheet); border-radius: 12px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; }
.figure-dlg header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.figure-dlg header h2 { margin: 0; font-size: 15px; flex: 1; }
.figure-dlg .body { overflow: auto; padding: 12px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--sheet); z-index: 41; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.drawer header h2 { margin: 0; font-size: 16px; flex: 1; }
.drawer .body { padding: 10px 18px 30px; overflow-y: auto; font-size: 13.5px; }
.drawer input[type=search] { width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; background: var(--sheet-2); margin-bottom: 10px; }
.drawer dl { margin: 0; }
.drawer dt { font-weight: 600; margin-top: 9px; }
.drawer dd { margin: 2px 0 0; color: var(--ink-2); }
.drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 14px 0 4px; }
.drawer ol { margin: 0; padding-left: 22px; }
.drawer li button { border: 0; background: none; padding: 3px 0; text-align: left; color: inherit; }
.drawer li button[aria-current="step"] { font-weight: 700; }
.pop { position: fixed; z-index: 50; max-width: 300px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow-pop); padding: 9px 12px; font-size: 13px; }
.pop b { display: block; margin-bottom: 2px; }
.pop .more { margin-top: 6px; }

@media (max-width: 1100px) and (min-width: 861px) {

}
@media (max-width: 860px) {

  .strip { padding: 0 12px; position: sticky; top: 0; z-index: 20; }
  .grid2, .grid2.wide-left, .grid2.wide-right, .pair, .world, .real3 { grid-template-columns: minmax(0, 1fr); }
  .stations { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .station:not(:last-child)::after { display: none; }
  .how { grid-template-columns: minmax(0, 1fr); }
  .how .arrow { transform: rotate(90deg); height: 22px; }
  .ideas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rounds { grid-template-columns: minmax(0, 1fr); }
  .runsteps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .wsteps { grid-template-columns: minmax(0, 1fr); }
  .passes { display: none; }
  .timeline { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  dl.facts { grid-template-columns: minmax(0, 1fr); }
  .kept { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  table.t.stack tr { border-bottom: 1px solid var(--rule); padding: 6px 0; }

 30th. Draft a reply.","reference":"Priya,\n\nTuesday the 17th at 10 works for Dana and me. Same plan as before: an hour together, then the walk through the Elm Street site.\n\nWe can't send the interim report early. Our finance close isn't done until the 25th, and the report needs those numbers. It will be with you by November 30.\n\nMorgan","files":{"input/priya-email.md":"From: Priya Raman <priya.raman@halefoundation.example>\nTo: Morgan Reyes <morgan.reyes@cedarcommons.example>\nDate: Monday 9 November 2026, 08:14\nSubject: Friday site visit\n\nHi Morgan,\n\nI'm sorry to do this on short notice, but our team retreat now overlaps with\nFriday's site visit. Could we move it to Tuesday the 17th or Wednesday the\n18th, at 10 either day? Same plan otherwise: an hour with you and Dana, then a\nwalk through the Elm Street site.\n\nAlso, a quick check while I have you: is the interim report still on track for\nNovember 30? We'd love to have it a few days early if you can manage it, since\nour renewal review starts on December 1.\n\nThanks,\nPriya\n\nPriya Raman\nProgram Officer, Hale Foundation\n"}},{"id":"summarize-committee-notes","title":"Summarize the finance committee's notes for the committee","tags":["voice","summary","board"],"should":["uses-the-board-register"],"should_not":["uses-the-graph"],"text":"Here are my notes from Thursday's Riverside finance committee meeting\n(input/committee-notes.md). Turn them into a short summary I can send to the\ncommittee: what we decided, who does what by when, and what is still open.\nSave it in drafts/.","reference":"Riverside finance committee, Thursday 5 November\n\nFor the board: the committee asks the full board to decide on 19 November whether to move 5,000 from the operating reserve to program supplies. Alicia Moreno asked for a one-page explanation first.\n\nWho does what\n- Ellis Park sends corrected first-quarter actuals by Tuesday 10 November.\n- Ellis asks the auditor whether fieldwork can move to February.\n- Morgan sends Ellis the cover memo draft by Wednesday 11 November.\n- The packet goes to the board on Thursday 12 November.\n\nStill open\n- When the audit fieldwork happens. The auditor wants January; Ellis has two staff out then.\n- Program supplies: next summer's camp supplies were bought in September, which may explain why the line is over budget for the quarter, by about 6,500 (committee notes; Ellis is confirming).\n\nNext meeting: Thursday 3 December.\n\nMorgan","files":{"input/committee-notes.md":"Riverside finance cttee - Thu 5 Nov 2026, 6:30pm, video\n\nPresent: me (chair), Ellis, Tom Becker, Alicia Moreno\n\nQ1 actuals (Jul-Sep)\n- revenue roughly on plan\n- program supplies over by ~6,500. Camp supplies for next summer bought in Sept?\n  Ellis to confirm timing vs real overspend\n- 2 Sept lines miscoded. Ellis sends corrected Q1 actuals by Tue 10 Nov\n\nAudit\n- auditor wants fieldwork in Jan, not March\n- Ellis not happy about Jan (two staff out). Ellis to ask auditor about Feb\n- no decision\n\nReserve transfer\n- Tom suggested moving 5,000 from operating reserve to cover supplies\n- not ours to decide, goes to full board 19 Nov\n- Alicia wants a one-page explanation for the board first\n\nPacket\n- me: cover memo draft to Ellis by Wed 11 Nov\n- packet to board Thu 12 Nov (one week before mtg)\n\nNext cttee mtg Thu 3 Dec\n"}},{"id":"prep-dana-checkin","title":"A brief for the check-in with Dana","tags":["briefing","in-graph"],"should":["uses-the-graph"],"should_not":["uses-the-board-register"],"text":"My check-in with Dana is Wednesday at 11. Give me a short brief to read\nbeforehand: what's open between us, and what I need from her. Save it in\nnotes/.","reference":"Check-in with Dana, Wednesday at 11\n\nOpen between us\n1. The Hale Foundation renewal narrative. The request is 120,000 over two years, above the 50,000 that Dana reviews, and it is due to Hale on 1 December. I need her review dates.\n2. The two quiet corporate partners. We haven't decided whether to mark them inactive. I need her decision.\n\nFrom the graph pages for Dana Whitfield and the Hale Foundation.","files":{}},{"id":"reply-to-sam","title":"Answer Sam about Saturday","tags":["voice","reply","household","in-graph"],"should":["uses-the-graph"],"should_not":["uses-the-board-register"],"text":"Sam's message about Saturday is in input/sam-message.md. Yes, we're both\ngoing, Sam can drive, and 10 is fine. Draft a short reply I can send.","reference":"Yes, both of us. You drive, and 10 is fine. Thanks for telling the front desk.\n\nM","files":{"input/sam-message.md":"From: Sam Reyes <sam.reyes@reyes-home.example>\nTo: morgan.reyes.home@reyes-home.example\nDate: Tuesday 10 November 2026, 12:05\nSubject: Saturday\n\nAre we both going on Saturday morning? I'll drive. If yes, I'll let the front desk know we're coming at 10.\n\nS\n"}},{"id":"ellis-board-note","title":"The note on the supplies overspend for the board packet","tags":["voice","board","in-graph"],"should":["uses-the-graph","uses-the-board-register"],"should_not":null,"text":"Ellis wants a short note for the top of the board packet (his email is in\ninput/ellis-email.md). We went 6,200 over on program supplies in Q1 because\ncamp supplies for next summer were bought in September to get a bulk discount,\nso it's timing, not new spending. Draft it in drafts/ for me to look at.","reference":"Program supplies, first quarter\n\nThe program supplies line is over budget for the quarter because we bought next summer's camp supplies in September, when a bulk discount was available. It is a question of timing, not new spending.\n\nThe line is 6,200 over budget for July to September (corrected first-quarter actuals from Ellis Park, 10 November).\n\nMorgan","files":{"input/ellis-email.md":"From: Ellis Park <ellis.park@riversideyouth.example>\nTo: Morgan Reyes <morgan.reyes@cedarcommons.example>\nDate: Thursday 12 November 2026, 15:02\nSubject: Note for the board tonight?\n\nMorgan -\n\nThe packet goes out tonight. Can you send me a short note for the top of it on\nthe supplies overspend, so board members see the explanation before the\nnumbers? I'll drop it in as page one. A paragraph or two is plenty.\n\nEllis\n"}},{"id":"reply-to-school","title":"Answer Ms. Okafor about the trip","tags":["voice","reply","household","not-in-graph"],"should":null,"should_not":["uses-the-graph","uses-the-board-register"],"text":"Can you answer Ms. Okafor for me? Her email is in input/school-email.md. Yes to\nthe trip, and I've signed the form and will send it in with the fee tomorrow.\nI can't chaperone that day, sorry.","reference":"Ms. Okafor,\n\nYes to the trip. I've signed the form, and it'll come in with the fee tomorrow. I can't chaperone that day, sorry.\n\nMorgan","files":{"input/school-email.md":"From: Joy Okafor <j.okafor@lindenelementary.example>\nTo: Fourth grade families\nDate: Tuesday 10 November 2026, 07:40\nSubject: Fourth grade trip to the science museum, Thursday 19 November\n\nDear families,\n\nOur fourth graders will visit the science museum on Thursday 19 November,\nleaving school at 9:00 and returning by 2:30. Please return the signed\npermission form and the 12 dollar fee by Friday 13 November.\n\nWe still need two parent chaperones. If you can come, please reply to this\nemail and let me know.\n\nThank you!\nMs. Okafor\n"}}],"model":{"runner":"claude-code","model":"claude-sonnet-5-5","allowed_tools":["Read","Write","Edit","Glob","Grep","Skill","Bash kb/kb *"],"timeout_seconds":300,"max_budget_usd":1.0,"note":"The same model and settings for every round. Personal settings, memory and connectors are left out of every run."},"checks":[{"id":"no-forbidden-characters","kind":"not-contains","object":"product","text":["—","–","“","”","‘","’","…"],"shows":"The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters.","does_not_show":"That the draft sounds like Morgan, or that it is right."},{"id":"no-stock-phrases","kind":"not-contain ":{"result":"pass","reason":"none found"},"short-enough":{"result":"pass","reason":"17 words"}},"ellis-board-note":{"no-forbidden-characters":{"result":"pass","reason":"none found"},"no-stock-phrases":{"result":"pass","reason":"none found"}},"reply-to-school":{"no-forbidden-characters":{"result":"pass","reason":"none found"},"no-stock-phrases":{"result":"pass","reason":"none found"},"short-enough":{"result":"pass","reason":"25 words"}}}},"demos":{"graph":{"folder":"examples/recorded/demo-graph-removed","experiment":"demo-graph-removed.toml","sha256":"sha256:9b9c9f1f3a5670f55b1851770110a8330b6d7fc3996e9b883b1d90076a5f5fda","claude_code":"2.1.310","rounds":[{"id":"A","label":"As it is","role":"baseline","expected":null,"why":null},{"id":"C","label":"Knowledge graph removed","role":"control-should-change","expected":{"direction":"worse","tags":["in-graph"],"sources":["people","judge","searched-the-graph","names-the-renewal-amount"]},"why":"Without kb/ the assistant can't know who Dana and Priya are or what is open with them. If nothing in the evaluation moves, the evaluation can't see the graph."}],"prompts":{"prep-dana-checkin":{"title":"A brief for the check-in with Dana","tags":["briefing","in-graph"],"text":"My check-in with Dana is Wednesday at 11. Give me a short brief to read\nbeforehand: what's open between us, and what I need from her. Save it in\nnotes/."},"prep-priya-call":{"title":"A brief for a call with Priya at the Hale Foundation","tags":["briefing","funder","in-graph"],"text":"Priya Raman is calling me tomorrow at 2. Give me a short brief to read first:\nwhat's open with the Hale Foundation, with the dates and amounts. Save it in\nnotes/."}},"checks":[{"id":"searched-the-graph","kind":"trace-ran-command","object":"process","shows":"The run searched the knowledge graph, as CLAUDE.md asks before answering anything about a person.","does_not_show":"That it used what it found, or searched for the right person.","pattern":"kb/kb search*"},{"id":"names-the-renewal-amount","kind":"matches","object":"product","shows":"The brief gives the Hale renewal's amount, which only the knowledge graph holds.","does_not_show":"That the rest of the brief is right.","pattern":"120,?000|120 ?[kK]"},{"id":"stayed-in-bounds","kind":"trace-no-tool-outside","object":"process","shows":"Every step used a tool on the allowed list.","does_not_show":"That each step was a good one.","pattern":null},{"id":"no-forbidden-characters","kind":"not-contains","object":"product","shows":"The voice file's character rule held: no em or en dashes, curly quotes or ellipsis characters.","does_not_show":"That the draft sounds like Morgan, or that it is right.","pattern":null}],"outputs":[{"prompt":"prep-dana-checkin","round":"A","repeat":1,"status":"ok","output":"# Check-in with Dana Whitfield - Wednesday 2026-10-28, 11:00\n\nSource note: everything below comes from the knowledge graph (kb/wiki). I could not open\nGrants/current/ from this machine, so the dates and the 120,000 figure are not re-checked\nagainst pipeline.xlsx or calendar.md. Check them there before you quote any of it.\n\n## Open between you\n\n1. Hale renewal narrative needs Dana's review before it goes.\n   - Request: 120,000 over two years (Funder pipeline, Hale row). Above 50,000, so Dana reviews.\n   - Proposal due to Hale 2026-12-01 (Grant calendar). The interim report on the current\n     grant is due 2026-11-30, the day before.\n   - The narrative is not drafted yet (Hale Foundation renewal page).\n2. Two quiet corporate partners: mark them inactive in the pipeline, or keep chasing?\n   - No reply from either since September (Funder pipeline, last-contact column).\n   - You held this for this check-in. Nothing has been decided.\n\n## What you need from Dana\n\n1. A review window for the Hale narrative. Ask how many days she needs to turn a draft,\n   and when she can take it. The interim report (11/30) and the proposal (12/01) land back\n   to back, so an earlier draft gives her more room.\n2. A decision on the two quiet partners. My recommendation: mark them inactive now so the\n   pipeline stays honest, and reopen if either replies. Ask Dana whether there is any\n   reason to keep them active.\n\n## If time allows\n\n- Does Dana want to see the interim report too, or only the renewal?\n\n## Flags\n\n- The graph records the Hale status and the quiet-partner hold \"as of 2026-10-28\", which\n  is the day of this meeting and two days after today. The date looks wrong. Treat \"not yet\n  drafted\" and \"nothing decided\" as unconfirmed until you check.\n- The graph has no other open items with Dana (no budget, staffing, or agreement threads).\n  If there are some, they are not in this brief. I have no access to your email or calendar\n  from here, so I did not check for recent threads.\n","message":"The brief is saved at `notes/dana-checkin-2026-10-28.md`. I couldn't open `Grants/current/` from this machine, so the dates and the 120,000 figure come from the knowledge graph and aren't checked against `pipeline.xlsx` or `calendar.md`. Check them there before you quote them. I also didn't check your email or calendar for recent threads with Dana.\n\n**Open between you**\n- **Hale renewal narrative:** Dana reviews it before it goes, because the request is 120,000 over two years. The proposal is due 2026-12-01, the day after the interim report on the current grant (11/30). The narrative isn't drafted yet.\n- **Two quiet corporate partners:** neither has replied since September. You held the \"mark inactive?\" decision for this check-in.\n\n**What you need from Dana**\n1. A review window for the Hale narrative: how many days she needs and when she can take it.\n2. A call on the two quiet partners. I'd mark them inactive now and reopen if either replies. Ask her whether there's any reason to keep them active.\n\nThe graph records the \"not drafted\" and \"nothing decided\" statuses as of 2026-10-28, which is the day of the meeting and two days after today. That date looks wrong, so confirm both statuses before relying on them.\n\nThe graph has no other open items with Dana. If there are others, they aren't in the brief.","output_from":"files: notes/dana-checkin-2026-10-28.md","trace":[["Bash","kb/kb search Dana Whitfield; echo ---; kb/kb node \"Dana Whitfield\"; echo ---; ls notes notes/briefs Grants/current 2>&1 | head -50",false],["Grep","Dana",false],["Bash","for n in \"Hale Foundation renewal\" \"Quiet corporate partners\" Calendars \"Session transcripts\"; do kb/kb node \"$n\"; echo ----; done; ls; ls ~/Documents/work 2>&1 ...",true],["Read","kb/wiki/Hale Foundation renewal.md",false],["Read","kb/wiki/Quiet corporate partners.md",false],["Read","kb/wiki/Calendars.md",false],["Glob","**/* in kb/wiki",false],["Read","kb/wiki/Session transcripts.md",false],["Read","kb/wiki/Funder pipeline.md",false],["Read","kb/wiki/Grant calendar.md",false],["Read","kb/wiki/Riverside Q1 finance packet.md",false],["Bash","mkdir -p notes && cat > notes/dana-checkin-2026-10-28.md <<'EOF' ...",true],["Write","notes/dana-checkin-2026-10-28.md",false]],"model":"claude-sonnet-5-5","seconds":44.7,"when":"2026-10-26T21:30:37Z","checks":{"searched-the-graph":{"result":"pass","reason":"ran kb/kb search Dana Whitfield"},"names-the-renewal-amount":{"result":"pass","reason":"matches"},"stayed-in-bounds":{"result":"fail","reason":"outside the list: Bash kb/kb search Dana Whitfield; echo ---; kb/kb node \"Dana Whitfield\"; echo ---; ls"},"no-forbidden-characters":{"result":"pass","reason":"none found"}}},{"prompt":"prep-dana-checkin","round":"C","repeat":1,"status":"ok","output":"# Dana check-in brief - Wed 2026-10-28, 11:00 (America/Denver)\n\nStatus: NOT READY. I could not reach any source that says what is open between you and Dana. Nothing below is invented; the open sections are blank on purpose.\n\n## What I checked\n\n| Source | Result |\n|---|---|\n| Knowledge graph (`kb/`) | Not present in this directory. No pages on Dana. |\n| `Grants/c mmary - 5 Nov\n\nHello all,\n\nThanks for the time Thursday evening. I know this is unpaid time on top of full days, and I appreciate it. Here is where we landed.\n\nDecided\n\n1. The question of moving 5,000 [UNVERIFIED] from the operating reserve to cover program supplies goes to the full board on 19 Nov. The committee isn't deciding it.\n2. The board packet goes out Thu 12 Nov, one week before the board meeting.\n\nWho does what, by when\n\n1. Ellis: confirm whether the program supplies overage (about 6,500 [UNVERIFIED]) is real overspend, or camp supplies for next summer bought early in September. Date: not set (see open items).\n2. Ellis: send corrected Q1 actuals (July through September) by Tue 10 Nov. Two September lines were miscoded.\n3. Ellis: ask the auditor whether fieldwork can happen in February instead of January. Date: not set (see open items).\n4. Morgan: send the cover memo draft to Ellis by Wed 11 Nov.\n5. Morgan: send the packet to the board by Thu 12 Nov.\n\nStill open\n\n1. Audit timing. The auditor asked for fieldwork in January, not March. We made no decision. It depends on the auditor's answer on February.\n2. Supplies overage. Revenue is roughly on plan for Q1, and the open question is how much of the supplies overage is timing. That depends on Ellis's check.\n3. One-page explanation of the reserve question for the board. Alicia asked for it before the board meeting. We didn't assign an owner. Who should write it, and by when? It would need to be ready for the 12 Nov packet.\n\nNext committee meeting: Thu 3 Dec.\n\nThanks, Morgan\n","message":"The draft is saved at `drafts/2026-11-05-finance-committee-summary.md`. I haven't sent it. The shell was denied, so I couldn't run my non-ASCII check. I wrote it in plain ASCII, but it hasn't been machine-verified.\n\n- **Date:** the notes are dated Thu 5 Nov 2026, but today is 26 Oct. Please check whether the date in the notes is right. I used 5 Nov in the draft.\n- **Figures:** the 6,500 supplies ov ntity/soul.md","excerpt":"**Uncertainty is information, not weakness.** \"I don't know\" is a complete and\nuseful answer. \"I haven't verified this\" is a better sentence than a confident\nwrong one."},{"path":".claude/identity/persona.md","excerpt":"**I lead with the answer.** No preamble, no restating their question back to them,\nno \"great question\", no narrating what I am about to do before I do it."},{"path":".claude/identity/operating.md","excerpt":"Every email, chat message, calendar invite, reply, and public post goes into a draft\nor into chat for Morgan to review. They press send. This holds even when they have\napproved the content, and even for a routine scheduling reply."},{"path":".claude/identity/user.md","excerpt":"- **Dana Whitfield**, Executive Director at Cedar Commons. Morgan's manager.\n  Reviews anything going to a funder above fifty thousand dollars."},{"path":".claude/identity/voice.md","excerpt":"- Em-dashes (U+2014). Use a plain ASCII hyphen (`-`) with spaces on both sides\n  instead, e.g. `the deadline moved - here is what that changes`."},{"path":".claude/identity/voice.md","excerpt":"## Board Memo Voice\n\nnot enough signal yet. Morgan supplied one board memo, which is not enough to\nderive conventions from. Ask for three more before writing this section, and until\nthen draft board memos against the general rules above and flag that the register\nis unverified."},{"path":".claude/skills/knowledge-graph/SKILL.md","excerpt":"kb/kb search <words>                 # ranked keyword search over every page\nkb/kb node <title>                   # one page: summary, every link in and out with its reason, file"},{"path":".claude/skills/knowledge-graph-maintain/SKILL.md","excerpt":"The markdown pages in `kb/wiki/` are the single source of truth."},{"path":".claude/commands/setup.md","excerpt":"You are running the guided setup for this assistant template. At the end of it,\nevery `{{PLACEHOLDER}}` in this repo is replaced with something true abou const NS = [4, 8, 16, 32, 64];
const TRUE_SHARE = 0.65;
let SIM = null;
function simulate() {
  if (SIM) return SIM;
  // A made-up world: across all prompts like these, 65% of judgments prefer B.
  // Prompts differ: each has its own lean (spread 20 points). Each prompt gets
  // 2 repeats x 3 people = 6 judgments.
  const r = mulberry32(5502), groups = [];
  const normal = () => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
  for (let i = 0; i < 64; i++) {
    const q = Math.min(0.97, Math.max(0.03, TRUE_SHARE + 0.2 * normal()));
    groups.push(Array.from({ length: 6 }, () => (r() < q ? 1 : 0)));
  }
  SIM = { groups, by: {} };
  NS.forEach(n => { const g = groups.slice(0, n); SIM.by[n] = { est: mean(g.flat()), ci: bootstrap(g, 5502, 4000), pts: g.map(mean) }; });
  return SIM;
}
// A share with its interval on a 0 to 100% axis; optionally each prompt's own
// share as a stacked dot, and the made-up world's true share.
function intervalChart(s, label, pts, truth) {
  const X0 = 24, W = 652, x = v => X0 + v * W;
  const stack = {}, top = pts ? Math.max(...pts.map(p => (stack[p] = (stack[p] || 0) + 1))) : 0;
  Object.keys(stack).forEach(k => { stack[k] = 0; });
  const dotH = pts ? Math.min(7, 64 / Math.max(top, 1)) : 0, Y = pts ? 40 + top * dotH + 18 : 46, H = Y + 32;
  let svg = '<svg class="chart" viewBox="0 0 700 ' + H + '" role="img" aria-label="' + esc(label) + '">';
  svg += '<line class="axis" x1="' + X0 + '" x2="' + (X0 + W) + '" y1="' + Y + '" y2="' + Y + '"/>';
  [0, 0.25, 0.5, 0.75, 1].forEach(v => { svg += '<text x="' + x(v) + '" y="' + (Y + 24) + '" text-anchor="middle">' + pct(v) + '</text>'; });

function controlRows() {
  const rows = [];
  const tol = D.experiment.tolerance;
  const rate = (demo, r, id, prs) => { const xs = prs.map(p => out(demo, p, r).checks[id]).filter(Boolean).map(x => x.result === 'pass' ? 1 : 0); return { n: xs.length, k: xs.reduce((a, b) => a + b, 0) }; };
  const judgeShare = (demo, nw) => { const js = D.demos[demo].judge; return { n: js.length, k: js.filter(j => j.winner === nw).length, est: mean(js.map(j => j.winner === nw ? 1 : j.winner === 'tie' ? 0.5 : 0)) }; };
  const add = (demo, nw, label, src, dir, note) => {
    let est, txt;
    if (src === 'judge') { const s = judgeShare(demo, nw); est = s.est - 0.5; txt = 'Preferred ' + nw + ' on ' + s.k + ' of ' + s.n + ' prompts: ' + pct(s.est) + ' prefer ' + nw + '.'; }
    else { const prs = Object.keys(D.demos[demo].prompts); const a = rate(demo, 'A', src, prs), b = rate(demo, nw, src, prs); est = b.k / b.n - a.k / a.n; txt = 'A passed ' + a.k + ' of ' + a.n + '; ' + nw + ' passed ' + b.k + ' of ' + b.n + ' (' + (est > 0 ? '+' : est < 0 ? '−' : '') + Math.abs(Math.round(est * 100)) + ' points).'; }
    const moved = dir === 'same' ? Math.abs(est) > tol : (dir === 'worse' ? est < -tol : est > tol);
    const good = dir === 'same' ? !moved : moved;
    rows.push({ k: demo + '-' + src, round: nw, label, src, dir, txt, moved, good, note });
  };
  add('graph', 'C', 'C: graph removed', 'judge', 'worse');
  add('graph', 'C', 'C: graph removed', 'names-the-renewal-amount', 'worse');
  add('graph', 'C', 'C: graph removed', 'searched-the-graph', 'worse', 'The search “ran”, in a line that succeeded without a graph (stop 15).');
  add('voice', 'D', 'D: voice reordered', 'judge', 'same');
  add('voice', 'D', 'D: voice reordered', 'short-enough', 'same', 'D’s run saved no file, so its whole message, notes and all (200 words), became the output. The prompt didn’t say where to save. Fix: name a folder in the request.');
  add('voice', 'D', 'D: voice reordered', 'names-the-new-date', 'same');
  return rows;
}

});

/* ------------------------------------------------------------------ *
 * The frame: bar, strip, rail, stage, overlays
 * ------------------------------------------------------------------ */

const saved = store.get();
const S = { i: 0, seen: new Set(saved.seen || []), done: new Set(), theme: saved.theme || null };
const save = () => store.set({ i: S.i, seen: [...S.seen], theme: S.theme });
const $ = id => document.getElementById(id);

function applyTheme() {
  if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme');
}
function isDark() { return S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }

function navButtons() {
  const last = S.i === STOPS.length - 1, done = S.done.has(STOPS[S.i].id);
  return [
    h('button', { type: 'button', class: 'btn', disabled: S.i === 0, onclick: () => go(S.i - 1), 'aria-label': 'Previous stop' }, '← Back'),
    last ? h('a', { class: 'btn' + (done ? ' primary' : ''), href: 'wizard.html' }, 'Open the wizard →')
      : h('button', { type: 'button', class: 'btn' + (done ? ' primary' : ''), onclick: () => go(S.i + 1) }, 'Next →'),
  ];
}
function renderBar() {
  const ch = STOPS[S.i].ch;
  $('chapters').replaceChildren(...CHAPTERS.map((c, i) => h('button', { type: 'button', 'aria-current': i === ch ? 'true' : 'false', onclick: () => go(STOPS.findIndex(s => s.ch === i)) },
    h('span', { class: 'n' }, i + 1), h('span', { class: 'lbl' }, c))));
  $('strip').replaceChildren(...CHAPTERS.map((c, ci) => h('div', { class: 'ch', style: 'flex:' + STOPS.filter(s => s.ch === ci).length },
    STOPS.map((s, i) => [s, i]).filter(([s]) => s.ch === ci).map(([s, i]) => h('button', {
      type: 'button', class: S.seen.has(s.id) ? 'seen' : null, 'aria-current': i === S.i ? 'step' : null,
      'aria-label': 'Stop ' + (i + 1) + ' of ' + STOPS.length + ': ' + s.title + (S.seen.has(s.id) ? ' (seen)' : ''), title: (i + 1) + '. ' + s.title, onclick: () => go(i),
    })))));
}
function renderRail() {
  const s = STOPS[S.i], inCh = STOPS.map((x, i) => [x, i]).filter(([x]) => x.ch === s.ch), done = S.done.has(s.id);
  $('rail').replaceChildren(
    h('div', { class: 'rail-head' }, h('p', { class: 'eyebrow' }, 'Chapter ' + (s.ch + 1) + ' · ' + CHAPTERS[s.ch]),
      h('ol', { class: 'dots', 'aria-label': 'Stops in this chapter' }, inCh.map(([x, i]) => h('li', null, h('button', { type: 'button', class: S.seen.has(x.id) ? 'seen' : null, 'aria-current': i === S.i ? 'step' : null, 'aria-label': 'Stop ' + (i + 1) + ': ' + x.title, title: (i + 1) + '. ' + x.title, onclick: () => go(i) }, i + 1))))),
    h('div', { class: 'rail-body' },
      h('p', { class: 'kicker' }, 'Stop ' + (S.i + 1) + ' of ' + STOPS.length),
      h('h1', { id: 'stop-title', tabindex: '-1' }, s.title),
      h('div', { class: 'read' }, s.body.map(p => rich('p', p))),
      h('div', { class: 'box try' }, h('h2', null, 'Try this'), rich('p', s.try)),
      h('div', { class: 'box ' + (done ? 'shows' : 'wait'), id: 'shows', 'aria-live': 'polite' }, done ? [h('h2', null, 'What this shows'), rich('p', s.shows)] : h('p', null, 'What this shows appears once you have tried it' + (matchMedia('(max-width: 860px)').matches ? ', below the picture.' : '.')))),
    h('div', { class: 'rail-foot' }, navButtons()));
  // On a phone the stage comes after the rail, so the result is repeated below it.
  $('stage-foot').replaceChildren(done ? h('div', { class: 'box shows' }, h('h2', null, 'What this shows'), rich('p', s.shows)) : '', h('div', { class: 'navrow' }, navButtons()));
}
// Screen readers hear what a reveal says, and what the stop shows, without
// the whole stage being read again.
let said = [], sayTimer = null;
function say(text) {
  said.push(text);
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => { $('announce').textContent = said.join(' '); said = []; }, 60);
}
function paint(first) {
  const s = STOPS[S.i], st = ST[s.id] = ST[s.id] || {}, stage = $('stage');
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('#stage') ? document.activeElement.getAttribute('data-k') : null;
  const before = new Set([...stage.querySelectorAll('.reveal')].map(e => e.textContent));
  stage.replaceChildren(...[].concat(s.render(st, api)).filter(Boolean));
  if (focused) { const el = document.querySelector('#stage [data-k="' + focused + '"]'); if (el && !el.disabled) el.focus(); }
  if (first !== true) { const fresh = [...stage.querySelectorAll('.reveal')].map(e => e.textContent).filter(t => !before.has(t)); if (fresh.length) say(fresh.join(' ')); }
}
const api = {
  paint,
  done() { const s = STOPS[S.i]; if (S.done.has(s.id)) return; S.done.add(s.id); renderRail(); say('What this shows: ' + $('shows').textContent.replace(/^What this shows/, '')); },
};
function go(i, opts) {
  if (i < 0 || i >= STOPS.length) return;
  closePop();
  S.i = i; S.seen.add(STOPS[i].id); save();
  renderBar(); renderRail(); paint(true);
  try { history.replaceState(null, '', '#' + STOPS[i].id); } catch (e) { /* file:// may refuse */ }
  $('stage').scrollTop = 0;
  if (!(opts && opts.initial)) {
    if (matchMedia('(max-width: 860px)').matches) window.scrollTo(0, 0);
    $('stop-title').focus({ preventScroll: true });
  }
}

// Definitions: a click on a dotted word opens it beside the word.
let popFor = null;
function closePop() { const p = $('pop'); p.hidden = true; if (popFor) popFor.setAttribute('aria-expanded', 'false'); popFor = null; }
function openPop(btn) {
  const key = btn.getAttribute('data-term'), g = GLOSS[key], p = $('pop');
  if (!g) return;
  if (popFor === btn) { closePop(); return; }
  closePop();
  p.replaceChildren(h('b', null, g[0]), rich('div', g[1]), h('div', { class: 'more' }, h('button', { type: 'button', class: 'btn small', onclick: () => { closePop(); openGlossary(key); } }, 'All the terms')));
  p.hidden = false;
  const r = btn.getBoundingClientRect(), pw = Math.min(300, innerWidth - 16);
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + 'px';
  const below = r.bottom + 8, ph = p.offsetHeight;
  p.style.top = (below + ph > innerHeight - 8 ? Math.max(8, r.top - ph - 8) : below) + 'px';
  btn.setAttribute('aria-expanded', 'true'); popFor = btn;
}
document.addEventListener('click', e => {
  const t = e.target.closest('.term');
  if (t) { e.preventDefault(); openPop(t); return; }
  if (!e.target.closest('#pop')) closePop();
});

// Drawers: the glossary and the contents.
let lastFocus = null;
function closeDrawer() { $('overlay').replaceChildren(); if (lastFocus) lastFocus.focus(); lastFocus = null; }
function drawer(title, body) {
  lastFocus = document.activeElement;
  const close = h('button', { type: 'button', class: 'iconbtn', onclick: closeDrawer }, 'Close');
  const d = h('div', { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('header', null, h('h2', null, title), close), h('div', { class: 'body' }, body));
  $('overlay').replaceChildren(h('div', { class: 'scrim', onclick: closeDrawer }), d);
  d.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const f = [...d.querySelectorAll('button, input, a[href]')].filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  });
  return d;
}
function openFigure(title, el) {
  lastFocus = document.activeElement;
  const close = h('button', { type: 'button', class: 'iconbtn', onclick: closeDrawer }, 'Close');
  const d = h('div', { class: 'figure-dlg', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('header', null, h('h2', null, title), close), h('div', { class: 'body' }, el));
  $('overlay').replaceChildren(h('div', { class: 'scrim', onclick: closeDrawer }), d);
  d.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); close.focus(); } });
  close.focus();
}
function openGlossary(focusKey) {
  const list = h('dl');
  const fill = q => list.replaceChildren(...Object.entries(GLOSS).sort((a, b) => a[1][0].localeCompare(b[1][0]))
    .filter(([, g]) => !q || (g[0] + ' ' + g[1]).toLowerCase().includes(q.toLowerCase()))
    .flatMap(([k, g]) => [h('dt', { id: 'g-' + k.replace(/\W/g, '-') }, g[0]), rich('dd', g[1])]));
  const search = h('input', { type: 'search', placeholder: 'Find a term', 'aria-label': 'Find a term', oninput: e => fill(e.target.value) });
  fill('');
  drawer('Glossary', [search, list]);
  if (focusKey) { const el = document.getElementById('g-' + focusKey.replace(/\W/g, '-')); if (el) { el.scrollIntoView({ block: 'center' }); el.style.color = 'var(--truth-text)'; } }
  search.focus();
}
function openContents() {
  const body = CHAPTERS.map((c, ci) => [h('h3', null, (ci + 1) + '. ' + c),
    h('ol', { start: STOPS.findIndex(s => s.ch === ci) + 1 }, STOPS.map((s, i) => [s, i]).filter(([s]) => s.ch === ci).map(([s, i]) => h('li', null,
      h('button', { type: 'button', 'aria-current': i === S.i ? 'step' : null, onclick: () => { closeDrawer(); go(i); } }, s.title, S.seen.has(s.id) ? h('span', { class: 'muted' }, '  ✓') : null))))]);
  const d = drawer('Contents', body);
  const cur = d.querySelector('[aria-current="step"]'); if (cur) cur.focus();
}
$('glossary-btn').addEventListener('click', () => openGlossary());
$('contents-btn').addEventListener('click', openContents);
$('theme').addEventListener('click', () => { S.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('pop').hidden) closePop(); else if ($('overlay').firstChild) closeDrawer(); return; }
  if (e.altKey || e.ctrlKey || e.metaKey || $('overlay').firstChild) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(S.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(S.i - 1); }
});
window.addEventListener('hashchange', () => { const i = STOPS.findIndex(s => '#' + s.id === location.hash); if (i >= 0 && i !== S.i) go(i); });

// For the tests: the stops, a way to complete each one through its own
// buttons, and the glossary words that are missing a definition.
window.__tour = { STOPS, S, go, missingTerms, complete() { STOPS[S.i].auto(); }, isDone: () => S.done.has(STOPS[S.i].id) };

applyTheme();
const fromHash = STOPS.findIndex(s => '#' + s.id === location.hash);
go(fromHash >= 0 ? fromHash : Math.min(saved.i || 0, STOPS.length - 1), { initial: true });
</script>
</body>
</html>
