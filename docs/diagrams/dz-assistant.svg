2 Z" class="h-web"/><text x="208" y="80" font-size="10.5" class="t-web b" text-anchor="middle">reads</text><circle cx="20" cy="186" r="8" class="h-ok"/><path d="M16.3 186.3 L19 189 L23.8 183.6" class="ln" style="stroke:#fff;stroke-width:2"/><text x="34" y="190" font-size="11.5" class="t2">Read only: it never changes the folder.</text><circle cx="20" cy="210" r="8" class="h-ok"/><path d="M16.3 210.3 L19 213 L23.8 207.6" class="ln" style="stroke:#fff;stroke-width:2"/><text x="34" y="214" font-size="11.5" class="t2">Nothing leaves your computer.</text><circle cx="20" cy="234" r="8" class="h-ok"/><path d="M16.3 234.3 L19 237 L23.8 231.6" class="ln" style="stroke:#fff;stroke-width:2"/><text x="34" y="238" font-size="11.5" class="t2">Each file is a part you can change.</text></svg>
