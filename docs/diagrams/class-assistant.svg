<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 440 448" width="440" height="448" role="img" aria-labelledby="class-assistant-t class-assistant-d"><title id="class-assistant-t">The class assistant: Wren</title><desc id="class-assistant-d">Morgan Reyes asks Wren for a draft; Wren writes it; Morgan sends it under Morgan’s own name. Both are made up. Wren is a folder: CLAUDE.md, read every time; five identity files read through it (soul, persona, operating, user, voice); the knowledge graph in kb/, searched when needed; and skills.</desc><style>
