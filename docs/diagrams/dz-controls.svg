<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 216" width="300" height="216" role="img" aria-labelledby="dz-controls-t dz-controls-d"><title id="dz-controls-t">Two controls test the test</title><desc id="dz-controls-d">Round C removes a part the prompts need, so it should get worse. Round D reorders a file without changing a word, so nothing should move. If the evaluation misses C or moves on D, it can’t be trusted on B.</desc><style>
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#16212B}
.dg .m{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
