.dg .t3{fill:#5F6A73}
.dg .inv{fill:#FFFFFF}
.dg .bg{fill:#FFFFFF;stroke:#D9DAD2}
.dg .wh{fill:#FFFFFF;stroke:#D9DAD2}
.dg .ln{fill:none;stroke:#5F6A73;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .h-rule{fill:#D9DAD2}
.dg .f-agent{fill:rgba(122,79,168,.12);stroke:#7A4FA8}
.dg .h-agent{fill:#7A4FA8}
.dg .t-agent{fill:#7A4FA8}
.dg .f-bad{fill:rgba(201,86,27,.12);stroke:#C9561B}
.dg .s-bad{stroke:#C9561B}
.dg .h-bad{fill:#C9561B}
.dg .t-bad{fill:#B24A12}
@media (prefers-color-scheme: dark) {
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#E2E8EE}
.dg .m{font-family:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
.dg .b{font-weight:600}
.dg .t2{fill:#A7B4BF}
.dg .t3{fill:#8593A0}
.dg .inv{fill:#141C23}
.dg .bg{fill:#141C23;stroke:#2A3640}
.dg .wh{fill:#141C23;stroke:#2A3640}
.dg .ln{fill:none;stroke:#8593A0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .h-rule{fill:#2A3640}
.dg .f-agent{fill:rgba(180,148,222,.15);stroke:#B494DE}
.dg .h-agent{fill:#B494DE}
.dg .t-agent{fill:#B494DE}
.dg .f-bad{fill:rgba(240,132,75,.15);stroke:#F0844B}
.dg .s-bad{stroke:#F0844B}
.dg .h-bad{fill:#F0844B}
.dg .t-bad{fill:#F0844B}
}
</style><rect class="bg" x="0.5" y="0.5" width="299" height="215" rx="12"/><text x="12" y="22" font-size="12.5" class="b">Two controls test the test</text><rect x="12" y="34" width="133" height="80" rx="8" class="wh"/><circle cx="28" cy="50" r="10" class="h-rule"/><text x="28" y="54" font-size="11.5" class="b t2" text-anchor="middle">A</text><text x="44" y="54" font-size="11" class="t3">as it is</text><text x="24" y="75" font-size="10" class="m t3">CLAUDE.md</text><text x="24" y="89" font-size="10" class="m t3">voice.md</text><text x="24" y="103" font-size="10" class="m t3">kb/</text><rect x="155" y="34" width="133" height="80" rx="8" class="wh"/><circle cx="171" cy="50" r="10" class="h-rule"/><text x="171" y="54" font-size="11.5" class="b t2" text-anchor="middle">B</text><text x="187" y="54" font-size="11" class="t3">your change</text><text x="167" y="75" font-size="10" class="m t3">CLAUDE.md</text><text x="167" y="89" font-size="10" class="m t3">voice.md</text><text x="280" y="89" font-size="9.5" class="t3" text-anchor="end">revised</text><text x="167" y="103" font-size="10" class="m t3">kb/</text><rect x="12" y="124" width="133" height="80" rx="8" class="f-bad"/><circle cx="28" cy="140" r="10" class="h-bad"/><text x="28" y="144" font-size="11.5" class="b inv" text-anchor="middle">C</text><text x="44" y="144" font-size="11" class="b t-bad">should get worse</text><text x="24" y="165" font-size="10" class="m t3">CLAUDE.md</text><text x="24" y="179" font-size="10" class="m t3">voice.md</text><text x="24" y="193" font-size="10" class="m t-bad b">kb/</text><path d="M22 189.5 L44.6 189.5" class="ln s-bad"/><text x="137" y="193" font-size="9.5" class="t-bad" text-anchor="end">removed</text><rect x="155" y="124" width="133" height="80" rx="8" class="f-agent"/><circle cx="171" cy="140" r="10" class="h-agent"/><text x="171" y="144" font-size="11.5" class="b inv" text-anchor="middle">D</text><text x="187" y="144" font-size="11" class="b t-agent">should not move</text><text x