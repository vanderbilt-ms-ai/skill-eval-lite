<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 1014" width="400" height="1014" role="img" aria-labelledby="order-group-t order-group-d"><title id="order-group-t">Your group’s experiment, in order: terminal or browser</title><desc id="order-group-d">Claude Code: the intake skill writes experiments/&lt;name&gt;/experiment.toml. Terminal: check. Wizard: load and freeze, export the frozen file. Your files: put it back over experiments/&lt;name&gt;/experiment.toml, because the run uses the frozen file. Terminal: run, judge. Wizard: load runs/&lt;name&gt;/bundle.json in step 3, judge in step 4, results in step 5. Your files: keep the exports in runs/&lt;name&gt;.</desc><style>
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#16212B}
.dg .b{font-weight:600}
.dg .t2{fill:#45515B}
.dg .bg{fill:#FFFFFF;stroke:#D9DAD2}
.dg .pl{fill:#F8F8F4;stroke:#D9DAD2}
.dg .ln{fill:none;stroke:#5F6A73;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-term{fill:rgba(28,124,110,.14);stroke:#1C7C6E}
.dg .s-term{stroke:#1C7C6E}
.dg .h-term{fill:#1C7C6E}
.dg .t-term{fill:#187062}
.dg .f-web{fill:rgba(29,108,176,.12);stroke:#1D6CB0}
.dg .s-web{stroke:#1D6CB0}
.dg .h-web{fill:#1D6CB0}
.dg .t-web{fill:#1D6CB0}
.dg .f-agent{fill:rgba(122,79,168,.12);stroke:#7A4FA8}
.dg .s-agent{stroke:#7A4FA8}
.dg .h-agent{fill:#7A4FA8}
.dg .t-agent{fill:#7A4FA8}
.dg .f-file{fill:rgba(154,106,12,.13);stroke:#9A6A0C}
.dg .s-n{stroke:#7A8791}
.dg .h-n{fill:#7A8791}
.dg .tw{fill:#1E2A33;stroke:#13202A}
.dg .tw-arrow{stroke:#62D2C0}
.dg .tw-cur{fill:#E6EDF3}
@media (prefers-color-scheme: dark) {
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#E2E8EE}
.dg .b{font-weight:600}
.dg .t2{fill:#A7B4BF}
.dg .bg{fill:#141C23;stroke:#2A3640}
.dg .pl{fill:#18222A;stroke:#2A3640}
.dg .ln{fill:none;stroke:#8593A0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-term{fill:rgba(76,192,174,.16);stroke:#4CC0AE}
.dg .s-term{stroke:#4CC0AE}
.dg .h-term{fill:#4CC0AE}
.dg .t-term{fill:#4CC0AE}
.dg .f-web{fill:rgba(91,166,232,.16);stroke:#5BA6E8}
.dg .s-web{stroke:#5BA6E8}
.dg .h-web{fill:#5BA6E8}
.dg .t-web{fill:#5BA6E8}
.dg .f-agent{fill:rgba(180,148,222,.15);stroke:#B494DE}
.dg .s-agent{stroke:#B494DE}
.dg .h-agent{fill:#B494DE}
.dg .t-agent{fill:#B494DE}
.dg .f-file{fill:rgba(226,174,74,.14);stroke:#E2AE4A}
.dg .s-n{stroke:#8E9BA5}
.dg .h-n{fill:#8E9BA5}
.dg .tw{fill:#0A0F13;stroke:#2A3640}
.dg .tw-arrow{stroke:#62D2C0}
.dg .tw-cur{fill:#E6EDF3}
}
</style><rect class="bg" x="0.5" y="0.5" width="399" height="1013" rx="12"/><text x="16" y="28" font-size="15" class="b">Your group’s experiment, in order</text><rect x="12" y="43" width="17" height="14" rx="3" class="tw"/><path d="M15.5 47 L19 50 L15.5 53" class="ln thin tw-arrow"/><rect x="20.5" y="52.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="34" y="55" font-size="12" class="b t-term">Terminal</text><rect x="371" y="43" width="17" height="14" rx="3" class="f-web"/><path d="M371 47.5 L388 47.5" class="ln s-web thin"/><circle cx="374" cy="45.3" r="0.9" class="h-web"/><circle cx="376.6" cy="45.3" r="0.9" class="h-web"/><text x="364" y="55" font-size="12" class="b t-web" text-anchor="end">The wizard (browser)</text><path d="M22 66 V882" class="ln thin dash s-term"/><path d="M378 66 V882" class="ln thin dash s-web"/><rect x="44" y="78" width="280" height="70" rx="9" class="f-agent"/><path d="M57 89.5 H68 Q71 89.5 71 92.5 V97.5 Q71 100.5 68 100.5 H62 L58.5 103.5 V100.5 H57 Q54 100.5 54 97.5 V92.5 Q54 89.5 57 89.5 Z" class="f-agent"/><circle cx="59.2" cy="95" r="1.1" class="h-agent"/><circle cx="62.5" cy="95" r="1.1" class="h-agent"/><circle cx="65.8" cy="95" r="1.1" class="h-agent"/><text x="80" y="100.5" font-size="13" class="b">Write the experiment</text><text x="314" y="93" font-size="10" class="t-agent b" text-anchor="end">Claude Code</text><text x="80" y="119" font-size="12" class="t2">/experiment-intake</text><text x="80" y="135" font-size="12" class="t2">../your-assistant</text><rect x="44" y="172" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="183" width="17" height="14" rx="3" class="tw"/><path d="M57.5 187 L61 190 L57.5 193" class="ln thin tw-arrow"/><rect x="62.5" y="192.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="194.5" font-size="13" class="b">Check it</text><text x="80" y="213" font-size="12" class="t2">check: fix anything it lists</text><rect x="76" y="250" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="261" width="17" height="14" rx="3" class="f-web"/><path d="M86 265.5 L103 265.5" class="ln s-web thin"/><circle cx="89" cy="263.3" r="0.9" class="h-web"/><circle cx="91.6" cy="263.3" r="0.9" class="h-web"/><text x="112" y="272.5" font-size="13" class="b">Load it and freeze it</text><text x="112" y="291" font-size="12" class="t2">Steps 1 and 2</text><rect x="76" y="328" width="280" height="70" rx="9" class="f-web"/><rect x="86" y="339" width="17" height="14" rx="3" class="f-web"/><path d="M86 343.5 L103 343.5" class="ln s-web thin"/><circle cx="89" cy="341.3" r="0.9" class="h-web"/><circle cx="91.6" cy="341.3" r="0.9" class="h-web"/><text x="112" y="350.5" font-size="13" class="b">Save the frozen file</text><text x="112" y="369" font-size="12" class="t2">Step 2: Export the frozen</text><text x="112" y="385" font-size="12" class="t2">experiment</text><rect x="60" y="422" width="280" height="70" rx="9" class="f-file dash"/><path transform="translate(70 432) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="96" y="444.5" font-size="13" class="b">Put it back</text><text x="96" y="463" font-size="12" class="t2">from Downloads into</text><text x="96" y="479" font-size="12" class="t2">experiments/&lt;name&gt;/</text><rect x="44" y="516" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="527" width="17" height="14" rx="3" class="tw"/><path d="M57.5 531 L61 534 L57.5 537" class="ln thin tw-arrow"/><rect x="62.5" y="536.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="538.5" font-size="13" class="b">Run every round</text><text x="80" y="557" font-size="12" class="t2">run</text><rect x="44" y="594" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="605" width="17" height="14" rx="3" class="tw"/><path d="M57.5 609 L61 612 L57.5 615" class="ln thin tw-arrow"/><rect x="62.5" y="614.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="616.5" font-size="13" class="b">Ask the AI judge</text><text x="80" y="635" font-size="12" class="t2">judge runs/&lt;name&gt;</text><rect x="76" y="672" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="683" width="17" height="14" rx="3" class="f-web"/><path d="M86 687.5 L103 687.5" class="ln s-web thin"/><circle cx="89" cy="685.3" r="0.9" class="h-web"/><circle cx="91.6" cy="685.3" r="0.9" class="h-web"/><text x="112" y="694.5" font-size="13" class="b">Load the runs</text><text x="112" y="713" font-size="12" class="t2">Step 3: runs/&lt;name&gt;/bundle.json</text><rect x="76" y="750" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="761" width="17" height="14" rx="3" class="f-web"/><path d="M86 765.5 L103 765.5" class="ln s-web thin"/><circle cx="89" cy="763.3" r="0.9" class="h-web"/><circle cx="91.6" cy="763.3" r="0.9" class="h-web"/><text x="112" y="772.5" font-size="13" class="b">Judge, then read the results</text><text x="112" y="791" font-size="12" class="t2">Steps 4 and 5</text><rect x="60" y="828" width="280" height="54" rx="9" class="f-file dash"/><path transform="translate(70 838) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="96" y="850.5" font-size="13" class="b">Keep the results</text><text x="96" y="869" font-size="12" class="t2">into runs/&lt;name&gt;/</text><path d="M22 96 L44 96" class="ln s-agent thin"/><circle cx="22" cy="96" r="4" class="h-agent"/><path d="M22 190 L44 190" class="ln s-term thin"/><circle cx="22" cy="190" r="4" class="h-term"/><path d="M184 148 C184 158 184 155 184 165" class="ln s-n"/><path d="M184 172 L179.2 163 L188.8 163 Z" class="h-n"/><path d="M356 268 L378 268" class="ln s-web thin"/><circle cx="378" cy="268" r="4" class="h-web"/><path d="M184 226 C184 236 216 233 216 243" class="ln s-n"/><path d="M216 250 L211.2 241 L220.8 241 Z" class="h-n"/><path d="M356 346 L378 346" class="ln s-web thin"/><circle cx="378" cy="346" r="4" class="h-web"/><path d="M216 304 C216 314 216 311 216 321" class="ln s-n"/><path d="M216 328 L211.2 319 L220.8 319 Z" class="h-n"/><path d="M216 398 C216 408 200 405 200 415" class="ln s-n"/><path d="M200 422 L195.2 413 L204.8 413 Z" class="h-n"/><path d="M22 534 L44 534" class="ln s-term thin"/><circle cx="22" cy="534" r="4" class="h-term"/><path d="M200 492 C200 502 184 499 184 509" class="ln s-n"/><path d="M184 516 L179.2 507 L188.8 507 Z" class="h-n"/><path d="M22 612 L44 612" class="ln s-term thin"/><circle cx="22" cy="612" r="4" class="h-term"/><path d="M184 570 C184 580 184 577 184 587" class="ln s-n"/><path d="M184 594 L179.2 585 L188.8 585 Z" class="h-n"/><path d="M356 690 L378 690" class="ln s-web thin"/><circle cx="378" cy="690" r="4" class="h-web"/><path d="M184 648 C184 658 216 655 216 665" class="ln s-n"/><path d="M216 672 L211.2 663 L220.8 663 Z" class="h-n"/><path d="M356 768 L378 768" class="ln s-web thin"/><circle cx="378" cy="768" r="4" class="h-web"/><path d="M216 726 C216 736 216 733 216 743" class="ln s-n"/><path d="M216 750 L211.2 741 L220.8 741 Z" class="h-n"/><path d="M216 804 C216 814 200 811 200 821" class="ln s-n"/><path d="M200 828 L195.2 819 L204.8 819 Z" class="h-n"/><rect x="16" y="900" width="368" height="98" rx="8" class="pl"/><text x="26" y="918" font-size="12" class="t2">The freeze comes before the runs. Freezing writes</text><text x="26" y="934" font-size="12" class="t2">your experiment down, with the date and a</text><text x="26" y="950" font-size="12" class="t2">fingerprint, before you see any results, so that</text><text x="26" y="966" font-size="12" class="t2">nobody can change the test to fit the results</text><text x="26" y="982" font-size="12" class="t2">later. The runner uses the frozen file.</text></svg>
