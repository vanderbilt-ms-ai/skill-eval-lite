"h-agent"/><text x="80" y="194.5" font-size="13" class="b">Check it</text><text x="314" y="187" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="213" font-size="12" class="t2">check: fix anything it lists</text><rect x="76" y="250" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="261" width="17" height="14" rx="3" class="f-web"/><path d="M86 265.5 L103 265.5" class="ln s-web thin"/><circle cx="89" cy="263.3" r="0.9" class="h-web"/><circle cx="91.6" cy="263.3" r="0.9" class="h-web"/><text x="112" y="272.5" font-size="13" class="b">Load it and freeze it</text><text x="112" y="291" font-size="12" class="t2">Steps 1 and 2</text><rect x="76" y="328" width="280" height="70" rx="9" class="f-web"/><rect x="86" y="339" width="17" height="14" rx="3" class="f-web"/><path d="M86 343.5 L103 343.5" class="ln s-web thin"/><circle cx="89" cy="341.3" r="0.9" class="h-web"/><circle cx="91.6" cy="341.3" r="0.9" class="h-web"/><text x="112" y="350.5" font-size="13" class="b">Save the frozen file</text><text x="112" y="369" font-size="12" class="t2">Step 2: Export the frozen</text><text x="112" y="385" font-size="12" class="t2">experiment</text><rect x="44" y="422" width="280" height="70" rx="9" class="f-agent"/><path d="M57 433.5 H68 Q71 433.5 71 436.5 V441.5 Q71 444.5 68 444.5 H62 L58.5 447.5 V444.5 H57 Q54 444.5 54 441.5 V436.5 Q54 433.5 57 433.5 Z" class="f-agent"/><circle cx="59.2" cy="439" r="1.1" class="h-agent"/><circle cx="62.5" cy="439" r="1.1" class="h-agent"/><circle cx="65.8" cy="439" r="1.1" class="h-agent"/><text x="80" y="444.5" font-size="13" class="b">Put it back</text><text x="314" y="437" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="463" font-size="12" class="t2">/wizard: from Downloads, then</text><text x="80" y="479" font-size="12" class="t2">check it</text><rect x="44" y="516" width="280" height="54" rx="9" class="f-agent"/><path d="M57 527.5 H68 Q71 527.5 71 530.5 V535.5 Q71 538.5 68 538.5 H62 L58.5 541.5 V538.5 H57 Q54 538.5 54 535.5 V530.5 Q54 527.5 57 527.5 Z" class="f-agent"/><circle cx="59.2" cy="533" r="1.1" class="h-agent"/><circle cx="62.5" cy="533" r="1.1" class="h-agent"/><circle cx="65.8" cy="533" r="1.1" class="h-agent"/><text x="80" y="538.5" font-size="13" class="b">Run every round</text><text x="314" y="531" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="557" font-size="12" class="t2">/run-experiment</text><rect x="44" y="594" width="280" height="70" rx="9" class="f-agent"/><path d="M57 605.5 H68 Q71 605.5 71 608.5 V613.5 Q71 616.5 68 616.5 H62 L58.5 619.5 V616.5 H57 Q54 616.5 54 613.5 V608.5 Q54 605.5 57 605.5 Z" class="f-agent"/><circle cx="59.2" cy="611" r="1.1" class="h-agent"/><circle cx="62.5" cy="611" r="1.1" class="h-agent"/><circle cx="65.8" cy="611" r="1.1" class="h-agent"/><text x="80" y="616.5" font-size="13" class="b">Ask the AI judge</text><text x="314" y="609" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="635" font-size="12" class="t2">/run-experiment: judge</text><text x="80" y="651" font-size="12" class="t2">runs/&lt;name&gt;</text><rect x="76" y="688" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="699" width="17" height="14" rx="3" class="f-web"/><path d="M86 703.5 L103 703.5" class="ln s-web thin"/><circle cx="89" cy="701.3" r="0.9" class="h-web"/><circle cx="91.6" cy="701.3" r="0.9" class="h-web"/><text x="112" y="710.5" font-size="13" class="b">Load the runs</text><text x="112" y="729" font-size="12" class="t2">Step 3: runs/&lt;name&gt;/bundle.json</text><rect x="76" y="766" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="777" width="17" height="14" rx="3" class="f-web"/><path d="M86 781.5 L103 781.5" class="ln s-web thin"/><circle cx="89" cy="779.3" r="0.9" class="h-web"/><circle cx="91.6" cy="779.3" r="0.9" class="h-web"/><text x="112" y="788.5" font-size="13" class="b">Judge, then read the results</text><text x="112" y="807" font-size="12" class="t2">Steps 4 and 5</text><rect x="44" y="844" width="280" height="54" rx="9" class="f-agent"/><path d="M57 855.5 H68 Q71 855.5 71 858.5 V863.5 Q71 866.5 68 866.5 H62 L58.5 869.5 V866.5 H57 Q54 866.5 54 863.5 V858.5 Q54 855.5 57 855.5 Z" class="f-agent"/><circle cx="59.2" cy="861" r="1.1" class="h-agent"/><circle cx="62.5" cy="861" r="1.1" class="h-agent"/><circle cx="65.8" cy="861" r="1.1" class="h-agent"/><text x="80" y="866.5" font-size="13" class="b">Keep the results</text><text x="314" y="859" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="885" font-size="12" class="t2">/wizard: into runs/&lt;name&gt;/</text><rect x="44" y="922" width="280" height="70" rx="9" class="f-agent"/><path d="M57 933.5 H68 Q71 933.5 71 936.5 V941.5 Q71 944.5 68 944.5 H62 L58.5 947.5 V944.5 H57 Q54 944.5 54 941.5 V936.5 Q54 933.5 57 933.5 Z" class="f-agent"/><circle cx="59.2" cy="939" r="1.1" class="h-agent"/><circle cx="62.5" cy="939" r="1.1" class="h-agent"/><circle cx="65.8" cy="939" r="1.1" class="h-agent"/><text x="80" y="944.5" font-size="13" class="b">Run the held-out prompts</text><text x="314" y="937" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="963" font-size="12" class="t2">/read-results, once your changes</text><text x="80" y="979" font-size="12" class="t2">are final</text><rect x="76" y="1016" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="1027" width="17" height="14" rx="3" class="f-web"/><path d="M86 1031.5 L103 1031.5" class="ln s-web thin"/><circle cx="89" cy="1029.3" r="0.9" class="h-web"/><circle cx="91.6" cy="1029.3" r="0.9" class="h-web"/><text x="112" y="1038.5" font-size="13" class="b">Judge them, read the confirmation</text><text x="112" y="1057" font-size="12" class="t2">Steps 4 and 5: Held out</text><path d="M22 96 L44 96" class="ln s-agent thin"/><circle cx="22" cy="96" r="4" class="h-agent"/><path d="M22 190 L44 190" class="ln s-agent thin"/><circle cx="22" cy="190" r="4" class="h-agent"/><path d="M184 148 C184 158 184 155 184 165" class="ln s-n"/><path d="M184 172 L179.2 163 L188.8 163 Z" class="h-n"/><path d="M356 268 L378 268" class="ln s-web thin"/><circle cx="378" cy="268" r="4" class="h-web"/><path d="M184 226 C184 236 216 233 216 243" class="ln s-n"/><path d="M216 250 L211.2 241 L220.8 241 Z" class="h-n"/><path d="M356 346 L378 346" class="ln s-web thin"/><circle cx="378" cy="346" r="4" class="h-web"/><path d="M216 304 C216 314 216 311 216 321" class="ln s-n"/><path d="M216 328 L211.2 319 L220.8 319 Z" class="h-n"/><path d="M22 440 L44 440" class="ln s-agent thin"/><circle cx="22" cy="440" r="4" class="h-agent"/><path d="M216 398 C216 408 184 405 184 415" class="ln s-n"/><path d="M184 422 L179.2 413 L188.8 413 Z" class="h-n"/><path d="M22 534 L44 534" class="ln s-agent thin"/><circle cx="22" cy="534" r="4" class="h-agent"/><path d="M184 492 C184 502 184 499 184 509" class="ln s-n"/><path d="M184 516 L179.2 507 L188.8 507 Z" class="h-n"/><path d="M22 612 L44 612" class="ln s-agent thin"/><circle cx="22" cy="612" r="4" class="h-agent"/><path d="M184 570 C184 580 184 577 184 587" class="ln s-n"/><path d="M184 594 L179.2 585 L188.8 585 Z" class="h-n"/><path d="M356 706 L378 706" class="ln s-web thin"/><circle cx="378" cy="706" r="4" class="h-web"/><path d="M184 664 C184 674 216 671 216 681" class="ln s-n"/><path d="M216 688 L211.2 679 L220.8 679 Z" class="h-n"/><path d="M356 784 L378 784" class="ln s-web thin"/><circle cx="378" cy="784" r="4" class="h-web"/><path d="M216 742 C216 752 216 749 216 759" class="ln s-n"/><path d="M216 766 L211.2 757 L220.8 757 Z" class="h-n"/><path d="M22 862 L44 862" class="ln s-agent thin"/><circle cx="22" cy="862" r="4" class="h-agent"/><path d="M216 820 C216 830 184 827 184 837" class="ln s-n"/><path d="M184 844 L179.2 835 L188.8 835 Z" class="h-n"/><path d="M22 940 L44 940" class="ln s-agent thin"/><circle cx="22" cy="940" r="4" class="h-agent"/><path d="M184 898 C184 908 184 905 184 915" class="ln s-n"/><path d="M184 922 L179.2 913 L188.8 913 Z" class="h-n"/><path d="M356 1034 L378 1034" class="ln s-web thin"/><circle cx="378" cy="1034" r="4" class="h-web"/><path d="M184 992 C184 1002 216 999 216 1009" class="ln s-n"/><path d="M216 1016 L211.2 1007 L220.8 1007 Z" class="h-n"/><rect x="16" y="1088" width="368" height="98" rx="8" class="pl"/><text x="26" y="1106" font-size="12" class="t2">The freeze comes before the runs. Freezing writes</text><text x="26" y="1122" font-size="12" class="t2">your experiment down, with the date and a</text><text x="26" y="1138" font-size="12" class="t2">fingerprint, before you see any results, so that</text><text x="26" y="1154" font-size="12" class="t2">nobody can change the test to fit the results</text><text x="26" y="1170" font-size="12" class="t2">later. The runner uses the frozen file.</text></svg>
