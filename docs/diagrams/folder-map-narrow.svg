</style><rect class="bg" x="0.5" y="0.5" width="399" height="1171" rx="12"/><text x="16" y="28" font-size="15" class="b">Where everything is</text><text x="16" y="48" font-size="12" class="t2">Your workspace is the folder you were in when you</text><text x="16" y="64.3" font-size="12" class="t2">downloaded Skill Eval Lite. It holds two folders</text><text x="16" y="80.6" font-size="12" class="t2">side by side.</text><path transform="translate(16 97.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="38" y="109.1" font-size="12" class="m b">skill-eval-lite/</text><text x="38" y="125.6" font-size="11.5" class="t3">Skill Eval Lite (you cloned it)</text><path d="M24 135.6 V149.6 H33" class="ln thin s-rule"/><g transform="translate(36 137.6) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="58" y="150.1" font-size="12" class="m">run_ab.py</text><text x="58" y="166.6" font-size="11.5" class="t3">the runner: you type its commands</text><path d="M24 176.6 V190.6 H33" class="ln thin s-rule"/><g transform="translate(36 178.6) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="58" y="191.1" font-size="12" class="m">wizard.html</text><text x="58" y="207.6" font-size="11.5" class="t3">the wizard: it opens in your browser</text><path d="M24 217.6 V231.6 H33" class="ln thin s-rule"/><g transform="translate(36 219.6) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="58" y="232.1" font-size="12" class="m">AGENTS.md</text><text x="58" y="248.6" font-size="11.5" class="t3">the intake, for Codex</text><path d="M24 258.6 V272.6 H33" class="ln thin s-rule"/><path transform="translate(36 261.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="58" y="273.1" font-size="12" class="m">.claude/skills/</text><path d="M44 282.6 V296.6 H53" class="ln thin s-rule"/><g transform="translate(56 284.6) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="78" y="297.1" font-size="12" class="m">experiment-intake/SKILL.md</text><text x="78" y="313.6" font-size="11.5" class="t3">the intake, for Claude Code</text><path d="M24 323.6 V337.6 H33" class="ln thin s-rule"/><path transform="translate(36 326.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="58" y="338.1" font-size="12" class="m">examples/</text><text x="58" y="354.6" font-size="11.5" class="t3">demonstrations, the class experiment</text><path d="M44 364.6 V378.6 H53" class="ln thin s-rule"/><path transform="translate(56 367.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="78" y="379.1" font-size="12" class="m">recorded/</text><text x="78" y="395.6" font-size="11.5" class="t3">real runs, ready to load</text><path d="M24 405.6 V419.6 H33" class="ln thin s-rule"/><path transform="translate(36 408.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="58" y="420.1" font-size="12" class="m">experiments/&lt;name&gt;/</text><text x="58" y="436.6" font-size="11.5" class="t3">your experiment</text><rect x="58" y="442.6" width="204.8" height="24" rx="7" class="f-agent"/><text x="67" y="456.6" font-size="11.5" class="t-agent">← the intake skill writes it</text><path d="M44 47