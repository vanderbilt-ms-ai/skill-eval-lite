<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 1172" width="400" height="1172" role="img" aria-labelledby="folder-map-narrow-t folder-map-narrow-d"><title id="folder-map-narrow-t">Where everything is</title><desc id="folder-map-narrow-d">The same map, as a list: skill-eval-lite with run_ab.py, wizard.html, AGENTS.md, the intake skill, examples, experiments/&lt;name&gt;/ and runs/&lt;name&gt;/, each marked with what writes or reads it; and the assistant’s folder beside it.</desc><style>
