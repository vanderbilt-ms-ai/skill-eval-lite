ass="m">bundle.json</text><text x="78" y="743.6" font-size="11.5" class="t3">everything, in one file</text><rect x="78" y="749.6" width="218.1" height="24" rx="7" class="f-web"/><text x="87" y="763.6" font-size="11.5" class="t-web">← the wizard loads it (step 3)</text><path d="M44 786.6 V800.6 H53" class="ln thin s-rule"/><path transform="translate(56 789.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="78" y="801.1" font-size="12" class="m">outputs/  judge/</text><text x="78" y="817.6" font-size="11.5" class="t3">every answer, kept</text><path transform="translate(16 846.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="38" y="858.1" font-size="12" class="m b">class-assistant/</text><text x="38" y="874.6" font-size="11.5" class="t3">the assistant (or your own)</text><rect x="38" y="880.6" width="238.1" height="24" rx="7" class="f-term"/><text x="47" y="894.6" font-size="11.5" class="t-term">← setup makes the class assistant</text><rect x="38" y="909.6" width="198.1" height="24" rx="7" class="f-agent"/><text x="47" y="923.6" font-size="11.5" class="t-agent">← the intake skill reads it</text><rect x="38" y="938.6" width="324.8" height="24" rx="7" class="f-term"/><text x="47" y="952.6" font-size="11.5" class="t-term">← run copies it for each run; never changes it</text><path d="M24 975.6 V989.6 H33" class="ln thin s-rule"/><g transform="translate(36 977.6) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="58" y="990.1" font-size="12" class="m">CLAUDE.md</text><text x="58" y="1006.6" font-size="11.5" class="t3">its main instructions</text><path d="M24 1016.6 V1030.6 H33" class="ln thin s-rule"/><path transform="translate(36 1019.6) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L