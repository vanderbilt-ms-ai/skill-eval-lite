</style><rect class="bg" x="0.5" y="0.5" width="299" height="141" rx="12"/><text x="12" y="22" font-size="12.5" class="b">Three questions about every output</text><rect x="12" y="34" width="92" height="96" rx="8" class="wh"/><g transform="translate(20 42) scale(1)"><path d="M2.5 0.5 H9.5 L13.5 4.5 V14.5 Q13.5 15.5 12.5 15.5 H2.5 Q1.5 15.5 1.5 14.5 V1.5 Q1.5 0.5 2.5 0.5 Z" class="ed"/><path d="M9.5 0.5 V4.5 H13.5" class="ln thin"/></g><text x="40" y="55" font-size="11.5" class="b">a draft</text><rect x="20" y="70" width="66.5" height="5" rx="2.5" class="bar"/><rect x="20" y="82" width="59.5" height="5" rx="2.5" class="bar"/><rect x="20" y="94" width="52.5" height="5" rx="2.5" class="bar"/><rect x="20" y="106" width="35" height="5" rx="2.5" class="bar"/><rect x="124" y="34" width="164" height="28" rx="7" class="f-term"/><text x="132" y="46" font-size="11" class="b t-term">Who reads it?</text><text x="132" y="57.5" font-size="10" class="t-term">what it is for</text><path d="M104 52 C112 52 107 48 115 48" class="ln s-term"/><path d="M122 48 L113 52.8 L113 43.2 Z" class="h-term"/><rect x="124" y="68" width="164" height="28" rx="7" class="f-ok"/><text x="132" y="80" font-size="11" class="b t-ok">Good enough to send?</text><text x="132" y="91.5" font-size="10" class="t-ok">the criterion</text><path d="M104 66 C112 66 107 82 115 82" class="ln s-ok"/><path d="M122 82 L113 86.8 L113 77.2 Z" class="h-ok"/><rect x="124" y="102" width="164" height="28" rx="7" class="f-web"/><text x="132" y="114" font-size="11" class="b t-web">Left or Right?</text><text x="132" y="125.5" font-size="10" class="t-web">the judging question</text><path d="M104 80 C112 80 107 116 115 116" class="ln s-web"/><path d="M122 116 L113 120.8 L113 111.2 Z" class="h-web"/></svg>
