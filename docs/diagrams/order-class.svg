<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 1108" width="400" height="1108" role="img" aria-labelledby="order-class-t order-class-d"><title id="order-class-t">The class experiment, in order</title><desc id="order-class-d">Terminal: setup, copy, check. Wizard: load and freeze, export the frozen file. Your files: put it back in experiments/class-assistant. Terminal: run, judge. Wizard: load the runs in step 3, judge, results. Your files: keep the results in runs/class-assistant.</desc><style>
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#16212B}
.dg .b{font-weight:600}
.dg .t2{fill:#45515B}
.dg .bg{fill:#FFFFFF;stroke:#D9DAD2}
.dg .pl{fill:#F8F8F4;stroke:#D9DAD2}
.dg .ln{fill:none;stroke:#5F6A73;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-term{fill:rgba(28,124,110,.14);stroke:#1C7C6E}
.dg .s-term{stroke:#1C7C6E}
.dg .h-term{fill:#1C7C6E}
.dg .t-term{fill:#187062}
.dg .f-web{fill:rgba(29,108,176,.12);stroke:#1D6CB0}
.dg .s-web{stroke:#1D6CB0}
.dg .h-web{fill:#1D6CB0}
.dg .t-web{fill:#1D6CB0}
.dg .f-file{fill:rgba(154,106,12,.13);stroke:#9A6A0C}
.dg .s-n{stroke:#7A8791}
.dg .h-n{fill:#7A8791}
.dg .tw{fill:#1E2A33;stroke:#13202A}
.dg .tw-arrow{stroke:#62D2C0}
.dg .tw-cur{fill:#E6EDF3}
@media (prefers-color-scheme: dark) {
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#E2E8EE}
.dg .b{font-weight:600}
.dg .t2{fill:#A7B4BF}
.dg .bg{fill:#141C23;stroke:#2A3640}
.dg .pl{fill:#18222A;stroke:#2A3640}
.dg .ln{fill:none;stroke:#8593A0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-term{fill:rgba(76,192,174,.16);stroke:#4CC0AE}
.dg .s-term{stroke:#4CC0AE}
.dg .h-term{fill:#4CC0AE}
.dg .t-term{fill:#4CC0AE}
.dg .f-web{fill:rgba(91,166,232,.16);stroke:#5BA6E8}
.dg .s-web{stroke:#5BA6E8}
.dg .h-web{fill:#5BA6E8}
.dg .t-web{fill:#5BA6E8}
.dg .f-file{fill:rgba(226,174,74,.14);stroke:#E2AE4A}
.dg .s-n{stroke:#8E9BA5}
.dg .h-n{fill:#8E9BA5}
.dg .tw{fill:#0A0F13;stroke:#2A3640}
.dg .tw-arrow{stroke:#62D2C0}
.dg .tw-cur{fill:#E6EDF3}
}
</style><rect class="bg" x="0.5" y="0.5" width="399" height="1107" rx="12"/><text x="16" y="28" font-size="15" class="b">The class experiment, in order</text><rect x="12" y="43" width="17" height="14" rx="3" class="tw"/><path d="M15.5 47 L19 50 L15.5 53" class="ln thin tw-arrow"/><rect x="20.5" y="52.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="34" y="55" font-size="12" class="b t-term">Terminal</text><rect x="371" y="43" width="17" height="14" rx="3" class="f-web"/><path d="M371 47.5 L388 47.5" class="ln s-web thin"/><circle cx="374" cy="45.3" r="0.9" class="h-web"/><circle cx="376.6" cy="45.3" r="0.9" class="h-web"/><text x="364" y="55" font-size="12" class="b t-web" text-anchor="end">The wizard (browser)</text><path d="M22 66 V976" class="ln thin dash s-term"/><path d="M378 66 V976" class="ln thin dash s-web"/><rect x="44" y="78" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="89" width="17" height="14" rx="3" class="tw"/><path d="M57.5 93 L61 96 L57.5 99" class="ln thin tw-arrow"/><rect x="62.5" y="98.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="100.5" font-size="13" class="b">Make the class assistant</text><text x="80" y="119" font-size="12" class="t2">setup (once per computer)</text><rect x="44" y="156" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="167" width="17" height="14" rx="3" class="tw"/><path d="M57.5 171 L61 174 L57.5 177" class="ln thin tw-arrow"/><rect x="62.5" y="176.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="178.5" font-size="13" class="b">Copy the class experiment</text><text x="80" y="197" font-size="12" class="t2">into experiments/class-assistant/</text><rect x="44" y="234" width="280" height="70" rx="9" class="f-term"/><rect x="54" y="245" width="17" height="14" rx="3" class="tw"/><path d="M57.5 249 L61 252 L57.5 255" class="ln thin tw-arrow"/><rect x="62.5" y="254.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="256.5" font-size="13" class="b">Check it</text><text x="80" y="275" font-size="12" class="t2">check: it should say “Nothing is</text><text x="80" y="291" font-size="12" class="t2">missing.”</text><rect x="76" y="328" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="339" width="17" height="14" rx="3" class="f-web"/><path d="M86 343.5 L103 343.5" class="ln s-web thin"/><circle cx="89" cy="341.3" r="0.9" class="h-web"/><circle cx="91.6" cy="341.3" r="0.9" class="h-web"/><text x="112" y="350.5" font-size="13" class="b">Load it and freeze it</text><text x="112" y="369" font-size="12" class="t2">Steps 1 and 2</text><rect x="76" y="406" width="280" height="70" rx="9" class="f-web"/><rect x="86" y="417" width="17" height="14" rx="3" class="f-web"/><path d="M86 421.5 L103 421.5" class="ln s-web thin"/><circle cx="89" cy="419.3" r="0.9" class="h-web"/><circle cx="91.6" cy="419.3" r="0.9" class="h-web"/><text x="112" y="428.5" font-size="13" class="b">Save the frozen file</text><text x="112" y="447" font-size="12" class="t2">Step 2: Export the frozen</text><text x="112" y="463" font-size="12" class="t2">experiment</text><rect x="60" y="500" width="280" height="70" rx="9" class="f-file dash"/><path transform="translate(70 510) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="96" y="522.5" font-size="13" class="b">Put it back</text><text x="96" y="541" font-size="12" class="t2">from Downloads into</text><text x="96" y="557" font-size="12" class="t2">experiments/class-assistant/</text><rect x="44" y="594" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="605" width="17" height="14" rx="3" class="tw"/><path d="M57.5 609 L61 612 L57.5 615" class="ln thin tw-arrow"/><rect x="62.5" y="614.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="616.5" font-size="13" class="b">Run every round</text><text x="80" y="635" font-size="12" class="t2">run: 32 runs</text><rect x="44" y="672" width="280" height="54" rx="9" class="f-term"/><rect x="54" y="683" width="17" height="14" rx="3" class="tw"/><path d="M57.5 687 L61 690 L57.5 693" class="ln thin tw-arrow"/><rect x="62.5" y="692.2" width="5" height="1.6" rx="0.5" class="tw-cur"/><text x="80" y="694.5" font-size="13" class="b">Ask the AI judge</text><text x="80" y="713" font-size="12" class="t2">judge runs/class-assistant</text><rect x="76" y="750" width="280" height="70" rx="9" class="f-web"/><rect x="86" y="761" width="17" height="14" rx="3" class="f-web"/><path d="M86 765.5 L103 765.5" class="ln s-web thin"/><circle cx="89" cy="763.3" r="0.9" class="h-web"/><circle cx="91.6" cy="763.3" r="0.9" class="h-web"/><text x="112" y="772.5" font-size="13" class="b">Load the runs</text><text x="112" y="791" font-size="12" class="t2">Step 3:</text><text x="112" y="807" font-size="12" class="t2">runs/class-assistant/bundle.json</text><rect x="76" y="844" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="855" width="17" height="14" rx="3" class="f-web"/><path d="M86 859.5 L103 859.5" class="ln s-web thin"/><circle cx="89" cy="857.3" r="0.9" class="h-web"/><circle cx="91.6" cy="857.3" r="0.9" class="h-web"/><text x="112" y="866.5" font-size="13" class="b">Judge, then read the results</text><text x="112" y="885" font-size="12" class="t2">Steps 4 and 5</text><rect x="60" y="922" width="280" height="54" rx="9" class="f-file dash"/><path transform="translate(70 932) scale(1)" d="M0.5 3.5 Q0.5 2 2 2 H6 L8 4 H14.5 Q16 4 16 5.5 V12.5 Q16 14 14.5 14 H2 Q0.5 14 0.5 12.5 Z" class="f-file"/><text x="96" y="944.5" font-size="13" class="b">Keep the results</text><text x="96" y="963" font-size="12" class="t2">into runs/class-assistant/</text><path d="M22 96 L44 96" class="ln s-term thin"/><circle cx="22" cy="96" r="4" class="h-term"/><path d="M22 174 L44 174" class="ln s-term thin"/><circle cx="22" cy="174" r="4" class="h-term"/><path d="M184 132 C184 142 184 139 184 149" class="ln s-n"/><path d="M184 156 L179.2 147 L188.8 147 Z" class="h-n"/><path d="M22 252 L44 252" class="ln s-term thin"/><circle cx="22" cy="252" r="4" class="h-term"/><path d="M184 210 C184 220 184 217 184 227" class="ln s-n"/><path d="M184 234 L179.2 225 L188.8 225 Z" class="h-n"/><path d="M356 346 L378 346" class="ln s-web thin"/><circle cx="378" cy="346" r="4" class="h-web"/><path d="M184 304 C184 314 216 311 216 321" class="ln s-n"/><path d="M216 328 L211.2 319 L220.8 319 Z" class="h-n"/><path d="M356 424 L378 424" class="ln s-web thin"/><circle cx="378" cy="424" r="4" class="h-web"/><path d="M216 382 C216 392 216 389 216 399" class="ln s-n"/><path d="M216 406 L211.2 397 L220.8 397 Z" class="h-n"/><path d="M216 476 C216 486 200 483 200 493" class="ln s-n"/><path d="M200 500 L195.2 491 L204.8 491 Z" class="h-n"/><path d="M22 612 L44 612" class="ln s-term thin"/><circle cx="22" cy="612" r="4" class="h-term"/><path d="M200 570 C200 580 184 577 184 587" class="ln s-n"/><path d="M184 594 L179.2 585 L188.8 585 Z" class="h-n"/><path d="M22 690 L44 690" class="ln s-term thin"/><circle cx="22" cy="690" r="4" class="h-term"/><path d="M184 648 C184 658 184 655 184 665" class="ln s-n"/><path d="M184 672 L179.2 663 L188.8 663 Z" class="h-n"/><path d="M356 768 L378 768" class="ln s-web thin"/><circle cx="378" cy="768" r="4" class="h-web"/><path d="M184 726 C184 736 216 733 216 743" class="ln s-n"/><path d="M216 750 L211.2 741 L220.8 741 Z" class="h-n"/><path d="M356 862 L378 862" class="ln s-web thin"/><circle cx="378" cy="862" r="4" class="h-web"/><path d="M216 820 C216 830 216 827 216 837" class="ln s-n"/><path d="M216 844 L211.2 835 L220.8 835 Z" class="h-n"/><path d="M216 898 C216 908 200 905 200 915" class="ln s-n"/><path d="M200 922 L195.2 913 L204.8 913 Z" class="h-n"/><rect x="16" y="994" width="368" height="98" rx="8" class="pl"/><text x="26" y="1012" font-size="12" class="t2">Freezing writes your experiment down, with the</text><text x="26" y="1028" font-size="12" class="t2">date and a fingerprint, before you see any</text><text x="26" y="1044" font-size="12" class="t2">results, so that nobody can change the test to fit</text><text x="26" y="1060" font-size="12" class="t2">the results later. The runner uses the frozen</text><text x="26" y="1076" font-size="12" class="t2">file.</text></svg>
