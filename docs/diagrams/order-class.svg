" rx="9" class="f-agent"/><path d="M57 543.5 H68 Q71 543.5 71 546.5 V551.5 Q71 554.5 68 554.5 H62 L58.5 557.5 V554.5 H57 Q54 554.5 54 551.5 V546.5 Q54 543.5 57 543.5 Z" class="f-agent"/><circle cx="59.2" cy="549" r="1.1" class="h-agent"/><circle cx="62.5" cy="549" r="1.1" class="h-agent"/><circle cx="65.8" cy="549" r="1.1" class="h-agent"/><text x="80" y="554.5" font-size="13" class="b">Run every round</text><text x="314" y="547" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="573" font-size="12" class="t2">/run-experiment: 32 runs</text><rect x="44" y="610" width="280" height="70" rx="9" class="f-agent"/><path d="M57 621.5 H68 Q71 621.5 71 624.5 V629.5 Q71 632.5 68 632.5 H62 L58.5 635.5 V632.5 H57 Q54 632.5 54 629.5 V624.5 Q54 621.5 57 621.5 Z" class="f-agent"/><circle cx="59.2" cy="627" r="1.1" class="h-agent"/><circle cx="62.5" cy="627" r="1.1" class="h-agent"/><circle cx="65.8" cy="627" r="1.1" class="h-agent"/><text x="80" y="632.5" font-size="13" class="b">Ask the AI judge</text><text x="314" y="625" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="651" font-size="12" class="t2">/run-experiment: judge</text><text x="80" y="667" font-size="12" class="t2">runs/class-assistant</text><rect x="76" y="704" width="280" height="70" rx="9" class="f-web"/><rect x="86" y="715" width="17" height="14" rx="3" class="f-web"/><path d="M86 719.5 L103 719.5" class="ln s-web thin"/><circle cx="89" cy="717.3" r="0.9" class="h-web"/><circle cx="91.6" cy="717.3" r="0.9" class="h-web"/><text x="112" y="726.5" font-size="13" class="b">Load the runs</text><text x="112" y="745" font-size="12" class="t2">Step 3:</text><text x="112" y="761" font-size="12" class="t2">runs/class-assistant/bundle.json</text><rect x="76" y="798" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="809" width="17" height="14" rx="3" class="f-web"/><path d="M86 813.5 L103 813.5" class="ln s-web thin"/><circle cx="89" cy="811.3" r="0.9" cla