</style><rect class="bg" x="0.5" y="0.5" width="299" height="233" rx="12"/><text x="12" y="22" font-size="12.5" class="b">Judge each pair, alone</text><rect x="12" y="42" width="133" height="58" rx="8" class="wh"/><text x="20" y="58" font-size="11" class="b">Left</text><rect x="20" y="68" width="105.3" height="5" rx="2.5" class="bar"/><rect x="20" y="78" width="87.8" height="5" rx="2.5" class="bar"/><rect x="20" y="88" width="70.2" height="5" rx="2.5" class="bar"/><rect x="155" y="42" width="133" height="58" rx="8" class="wh"/><text x="163" y="58" font-size="11" class="b">Right</text><rect x="163" y="68" width="105.3" height="5" rx="2.5" class="bar"/><rect x="163" y="78" width="87.8" height="5" rx="2.5" class="bar"/><rect x="163" y="88" width="70.2" height="5" rx="2.5" class="bar"/><rect x="12" y="108" width="89.3" height="24" rx="6" class="btn2"/><text x="56.7" y="123.4" font-size="9.5" text-anchor="middle">Left is better</text><rect x="105.3" y="108" width="89.3" height="24" rx="6" class="btn2"/><text x="150" y="123.4" font-size="9.5" text-anchor="middle">About the same</text><rect x="198.7" y="108" width="89.3" height="24" rx="6" class="btn2"/><text x="243.3" y="123.4" font-size="9.5" text-anchor="middle">Right is better</text><rect x="8" y="104" width="97.3" height="32" rx="9" class="ln s-web thick"/><rect x="12" y="140" width="214" height="24" rx="6" class="ed"/><text x="20" y="156" font-size="10.5" class="t3">why, in one line</text><rect x="234" y="140" width="54" height="24" rx="6" class="btn"/><text x="261" y="156.1" font-size="11.5" class="inv" text-anchor="middle">Record</text><path d="M30 170 L30 185" class="ln s-n"/><path d="M30 192 L25.2 183 L34.8 183 Z" class="h-n"/><text x="42" y="185" font-size="10.5" class="t3 it">then you see who wrote which</text><rect x="12" y="198" width="276" height="26" rx="6" class="f-web"/><text x="22" y="215" font-size="11" class="t-web">Left was A (as it is); right was C</text></svg>
