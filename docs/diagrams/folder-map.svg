<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1000 648" width="1000" height="648" role="img" aria-labelledby="folder-map-t folder-map-d"><title id="folder-map-t">Where everything is</title><desc id="folder-map-d">Your workspace holds skill-eval-lite and the assistant side by side. setup makes the class assistant. The intake skill reads the assistant and writes experiments/&lt;name&gt;/. check and run read experiment.toml; run copies the assistant for each run and writes runs/&lt;name&gt;/; judge adds to bundle.json. The wizard loads experiment.toml and bundle.json, and the frozen experiment.toml comes back to experiments/&lt;name&gt;/ through Downloads.</desc><style>
