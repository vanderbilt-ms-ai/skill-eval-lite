<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 479" width="400" height="479" role="img" aria-labelledby="designer-suites-t designer-suites-d"><title id="designer-suites-t">The suite designer, screen by screen</title><desc id="designer-suites-d">Six screens: start (the worked example, or blank), the two suites, the cases, the tests, the control cases, and a review. Then save the packet next to skill-eval-lite: suites.yaml, the cases in product/ and process/, controls/ and tests/. Next, suite --check, then suite, in the terminal.</desc><style>
