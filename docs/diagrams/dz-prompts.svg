<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 202" width="300" height="202" role="img" aria-labelledby="dz-prompts-t dz-prompts-d"><title id="dz-prompts-t">Prompts to work with, and held out</title><desc id="dz-prompts-d">Four development prompts, whose outputs you read, and two held out, sealed until the end. Each behavior has prompts where it should happen and prompts where it should not.</desc><style>
