<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-labelledby="help-step-2-t help-step-2-d"><title id="help-step-2-t">Step 2: freeze, then put the frozen file back</title><desc id="help-step-2-d">Press Freeze, then Export the frozen experiment. Your browser saves experiment.toml in Downloads. Move it back over skill-eval-lite/experiments/&lt;name&gt;/experiment.toml. The run uses this file.</desc><style>
