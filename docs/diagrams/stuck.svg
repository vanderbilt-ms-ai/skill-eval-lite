</style><rect class="bg" x="0.5" y="0.5" width="399" height="202" rx="12"/><rect x="8" y="8" width="384" height="187" rx="10" class="tw"/><path d="M8 18 Q8 8 18 8 H382 Q392 8 392 18 V32 H8 Z" class="twbar"/><circle cx="22" cy="20" r="3.6" class="twdot"/><circle cx="35" cy="20" r="3.6" class="twdot"/><circle cx="48" cy="20" r="3.6" class="twdot"/><text x="200" y="24.5" font-size="11" class="tw-o" text-anchor="middle">Terminal</text><text x="22" y="60" font-size="12.5" class="m"><tspan class="tw-p">skill-eval-lite $ </tspan><tspan class="tw-t">python3 run_ab.py status</tspan></text><text x="22" y="79" font-size="12"><tspan class="tw-o it">(it says where you are, and the next command to</tspan></text><text x="22" y="98" font-size="12"><tspan class="tw-o it">type)</tspan></text><text x="22" y="123" font-size="12.5" class="m"><tspan class="tw-p">skill-eval-lite $ </tspan><tspan class="tw-t">python3 run_ab.py ask</tspan></text><text x="22" y="142" font-size="12"><tspan class="tw-o it">(Claude Code (or Codex) opens, looks at your files,</tspan></text><text x="22" y="161" font-size="12"><tspan class="tw-o it">and helps you step by step)</tspan></text><text x="22" y="180" font-size="12.5" class="m"><tspan class="tw-p">skill-eval-lite $ </tspan></text><rect x="161.5" y="169" width="7.4" height="14" rx="1" class="tw-cur"/></svg>
