y="495" width="17" height="14" rx="3" class="f-web"/><path d="M86 499.5 L103 499.5" class="ln s-web thin"/><circle cx="89" cy="497.3" r="0.9" class="h-web"/><circle cx="91.6" cy="497.3" r="0.9" class="h-web"/><text x="112" y="506.5" font-size="13" class="b">Rate the cases</text><text x="112" y="525" font-size="12" class="t2">Step 3, Human tests</text><rect x="76" y="562" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="573" width="17" height="14" rx="3" class="f-web"/><path d="M86 577.5 L103 577.5" class="ln s-web thin"/><circle cx="89" cy="575.3" r="0.9" class="h-web"/><circle cx="91.6" cy="575.3" r="0.9" class="h-web"/><text x="112" y="584.5" font-size="13" class="b">Save the reports</text><text x="112" y="603" font-size="12" class="t2">Step 4, Report</text><rect x="44" y="640" width="280" height="70" rx="9" class="f-agent"/><path d="M57 651.5 H68 Q71 651.5 71 654.5 V659.5 Q71 662.5 68 662.5 H62 L58.5 665.5 V662.5 H57 Q54 662.5 54 659.5 V654.5 Q54 651.5 57 651.5 Z" class="f-agent"/><circle cx="59.2" cy="657" r="1.1" class="h-agent"/><circle cx="62.5" cy="657" r="1.1" class="h-agent"/><circle cx="65.8" cy="657" r="1.1" class="h-agent"/><text x="80" y="662.5" font-size="13" class="b">Keep them in your packet</text><text x="314" y="655" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="681" font-size="12" class="t2">/wizard: judgments.csv and</text><text x="80" y="697" font-size="12" class="t2">reports/</text><path d="M22 96 L44 96" class="ln s-agent thin"/><circle cx="22" cy="96" r="4" class="h-agent"/><path d="M22 174 L44 174" class="ln s-agent thin"/><circle cx="22" cy="174" r="4" class="h-agent"/><path d="M184 132 C184 142 184 139 184 149" class="ln s-n"/><path d="M184 156 L179.2 147 L188.8 147 Z" class="h-n"/><path d="M22 252 L44 252" class="ln s-agent thin"/><circle cx="22" cy="252" r="4" class="h-agent"/><path d="M184 210 C184 220 184 217 184 227" class="ln s-n"/><path d="M184 234 L179.2 225 L188.8 225 Z" class="h-n"/