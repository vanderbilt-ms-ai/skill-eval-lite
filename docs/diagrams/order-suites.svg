<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 778" width="400" height="778" role="img" aria-labelledby="order-suites-t order-suites-d"><title id="order-suites-t">Personal I suites, in order</title><desc id="order-suites-d">Terminal: copy the worked example into a packet, check it, run the suites. Wizard, checks-only mode: load the bundle, judge the AI tests yourself, rate the cases, save the reports. Your files: keep them in the packet.</desc><style>
