<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 810" width="400" height="810" role="img" aria-labelledby="order-suites-t order-suites-d"><title id="order-suites-t">Personal I suites, in order</title><desc id="order-suites-d">Claude: copy the worked example into a packet, check it, run the mechanical tests. Wizard, checks-only mode: load the bundle, judge the LLM tests yourself. Claude: bring your reference into the packet, run the LLM tests. Wizard: rate the cases, save the reports. Claude: keep them in the packet.</desc><style>
