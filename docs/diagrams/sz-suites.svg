.dg .t-agent{fill:#B494DE}
}
</style><rect class="bg" x="0.5" y="0.5" width="299" height="199" rx="12"/><text x="12" y="22" font-size="12.5" class="b">Two suites, each run on every case</text><rect x="12" y="34" width="133" height="112" rx="8" class="f-web"/><text x="22" y="52" font-size="12" class="b t-web">product</text><text x="22" y="67" font-size="10.5" class="t-web">the outputs</text><rect x="24" y="78" width="72" height="44" rx="5" class="wh"/><rect x="31" y="84" width="72" height="44" rx="5" class="wh"/><rect x="38" y="90" width="72" height="44" rx="5" class="wh"/><rect x="155" y="34" width="133" height="112" rx="8" class="f-term"/><text x="165" y="52" font-size="12" class="b t-term">process</text><text x="165" y="67" font-size="10.5" class="t-term">how one was made</text><text x="165" y="92" font-size="10" class="m t2">1 Bash kb/kb</text><text x="165" y="107" font-size="10" class="m t2">2 Read</text><text x="165" y="122" font-size="10" class="m t2">3 Write</text><text x="12" y="160" font-size="11.5" class="b">Each suite has three kinds of test:</text><rect x="12" y="170" width="70.8" height="22" rx="12" class="f-term"/><text x="20" y="184.8" font-size="10.5" class="t-term">a program</text><rect x="88.8" y="170" width="46.5" height="22" rx="12" class="f-web"/><text x="96.8" y="184.8" font-size="10.5" class="t-web">an AI</text><rect x="141.3" y="170" width="64.7" height="22" rx="12" class="f-agent"/><text x="149.3" y="184.8" font-size="10.5" class="t-agent">a person</text></svg>
