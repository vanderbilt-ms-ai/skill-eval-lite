<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-labelledby="sz-suites-t sz-suites-d"><title id="sz-suites-t">Two suites, each run on every case</title><desc id="sz-suites-d">A product suite tests the outputs; a process suite tests how one was made, from its steps. Each suite has three kinds of test: a program, an AI, a person.</desc><style>
