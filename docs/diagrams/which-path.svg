<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 440 662" width="440" height="662" role="img" aria-labelledby="which-path-t which-path-d"><title id="which-path-t">Which path are you on?</title><desc id="which-path-d">Four paths through Skill Eval Lite, each in Claude (in a session on the skill-eval-lite folder) and the wizard. A demonstration: Claude sets up the class assistant, runs the demonstration and the AI judge, then steps 1 to 5 in the wizard. The class experiment: Claude copies it, you freeze it in the wizard, Claude puts the frozen file back, runs it and the AI judge, then wizard steps 3 to 5. Your group’s experiment: the intake skill writes it, then the same, then the held-out prompts and their confirmation. Personal I: Claude copies a packet and runs the mechanical tests, you make your reference in the wizard, Claude runs the LLM tests, then the wizard’s checks-only mode.</desc><style>
