<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 212" width="300" height="212" role="img" aria-labelledby="dz-runs-t dz-runs-d"><title id="dz-runs-t">Every version, every prompt, twice</title><desc id="dz-runs-d">4 rounds × 4 development prompts × 2 repeats = 32 runs. Each run is a fresh copy of the assistant, with nothing of yours loaded.</desc><style>
