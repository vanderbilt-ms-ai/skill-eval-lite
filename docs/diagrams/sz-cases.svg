<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 300 245" width="300" height="245" role="img" aria-labelledby="sz-cases-t sz-cases-d"><title id="sz-cases-t">A folder for each case</title><desc id="sz-cases-d">Each case is a folder: product/&lt;item&gt;/ with context.md and output.md; process/&lt;item&gt;/ with context.md and its steps (trace.jsonl or transcript.jsonl).</desc><style>
