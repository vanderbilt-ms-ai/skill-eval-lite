<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 400 766" width="400" height="766" role="img" aria-labelledby="order-demo-t order-demo-d"><title id="order-demo-t">A demonstration, in order</title><desc id="order-demo-d">Claude: set up the class assistant, check, run, judge. Then the wizard: load the bundle in step 1, freeze in step 2, then steps 3 to 5. A demonstration is frozen after it is run; a recorded run can be loaded instead.</desc><style>
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#16212B}
.dg .b{font-weight:600}
.dg .t2{fill:#45515B}
.dg .bg{fill:#FFFFFF;stroke:#D9DAD2}
.dg .pl{fill:#F8F8F4;stroke:#D9DAD2}
.dg .ln{fill:none;stroke:#5F6A73;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-web{fill:rgba(29,108,176,.12);stroke:#1D6CB0}
.dg .s-web{stroke:#1D6CB0}
.dg .h-web{fill:#1D6CB0}
.dg .t-web{fill:#1D6CB0}
.dg .f-agent{fill:rgba(122,79,168,.12);stroke:#7A4FA8}
.dg .s-agent{stroke:#7A4FA8}
.dg .h-agent{fill:#7A4FA8}
.dg .t-agent{fill:#7A4FA8}
.dg .s-n{stroke:#7A8791}
.dg .h-n{fill:#7A8791}
@media (prefers-color-scheme: dark) {
.dg text{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;fill:#E2E8EE}
.dg .b{font-weight:600}
.dg .t2{fill:#A7B4BF}
.dg .bg{fill:#141C23;stroke:#2A3640}
.dg .pl{fill:#18222A;stroke:#2A3640}
.dg .ln{fill:none;stroke:#8593A0;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .thin{stroke-width:1.1}
.dg .dash{stroke-dasharray:5 4}
.dg .f-web{fill:rgba(91,166,232,.16);stroke:#5BA6E8}
.dg .s-web{stroke:#5BA6E8}
.dg .h-web{fill:#5BA6E8}
.dg .t-web{fill:#5BA6E8}
.dg .f-agent{fill:rgba(180,148,222,.15);stroke:#B494DE}
.dg .s-agent{stroke:#B494DE}
.dg .h-agent{fill:#B494DE}
.dg .t-agent{fill:#B494DE}
.dg .s-n{stroke:#8E9BA5}
.dg .h-n{fill:#8E9BA5}
}
</style><rect class="bg" x="0.5" y="0.5" width="399" height="765" rx="12"/><text x="16" y="28" font-size="15" class="b">A demonstration, in order</text><path d="M15 43.5 H26 Q29 43.5 29 46.5 V51.5 Q29 54.5 26 54.5 H20 L16.5 57.5 V54.5 H15 Q12 54.5 12 51.5 V46.5 Q12 43.5 15 43.5 Z" class="f-agent"/><circle cx="17.2" cy="49" r="1.1" class="h-agent"/><circle cx="20.5" cy="49" r="1.1" class="h-agent"/><circle cx="23.8" cy="49" r="1.1" class="h-agent"/><text x="34" y="55" font-size="12" class="b t-agent">Claude</text><rect x="371" y="43" width="17" height="14" rx="3" class="f-web"/><path d="M371 47.5 L388 47.5" class="ln s-web thin"/><circle cx="374" cy="45.3" r="0.9" class="h-web"/><circle cx="376.6" cy="45.3" r="0.9" class="h-web"/><text x="364" y="55" font-size="12" class="b t-web" text-anchor="end">The wizard (browser)</text><path d="M22 66 V586" class="ln thin dash s-agent"/><path d="M378 66 V586" class="ln thin dash s-web"/><rect x="44" y="78" width="280" height="70" rx="9" class="f-agent"/><path d="M57 89.5 H68 Q71 89.5 71 92.5 V97.5 Q71 100.5 68 100.5 H62 L58.5 103.5 V100.5 H57 Q54 100.5 54 97.5 V92.5 Q54 89.5 57 89.5 Z" class="f-agent"/><circle cx="59.2" cy="95" r="1.1" class="h-agent"/><circle cx="62.5" cy="95" r="1.1" class="h-agent"/><circle cx="65.8" cy="95" r="1.1" class="h-agent"/><text x="80" y="100.5" font-size="13" class="b">Make the class assistant</text><text x="314" y="93" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="119" font-size="12" class="t2">once per computer (/get-ready</text><text x="80" y="135" font-size="12" class="t2">offers it)</text><rect x="44" y="172" width="280" height="70" rx="9" class="f-agent"/><path d="M57 183.5 H68 Q71 183.5 71 186.5 V191.5 Q71 194.5 68 194.5 H62 L58.5 197.5 V194.5 H57 Q54 194.5 54 191.5 V186.5 Q54 183.5 57 183.5 Z" class="f-agent"/><circle cx="59.2" cy="189" r="1.1" class="h-agent"/><circle cx="62.5" cy="189" r="1.1" class="h-agent"/><circle cx="65.8" cy="189" r="1.1" class="h-agent"/><text x="80" y="194.5" font-size="13" class="b">Look at the demonstration</text><text x="314" y="187" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="213" font-size="12" class="t2">check</text><text x="80" y="229" font-size="12" class="t2">examples/demo-graph-removed.toml</text><rect x="44" y="266" width="280" height="54" rx="9" class="f-agent"/><path d="M57 277.5 H68 Q71 277.5 71 280.5 V285.5 Q71 288.5 68 288.5 H62 L58.5 291.5 V288.5 H57 Q54 288.5 54 285.5 V280.5 Q54 277.5 57 277.5 Z" class="f-agent"/><circle cx="59.2" cy="283" r="1.1" class="h-agent"/><circle cx="62.5" cy="283" r="1.1" class="h-agent"/><circle cx="65.8" cy="283" r="1.1" class="h-agent"/><text x="80" y="288.5" font-size="13" class="b">Run it</text><text x="314" y="281" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="307" font-size="12" class="t2">4 runs, about 1 to 3 minutes</text><rect x="44" y="344" width="280" height="54" rx="9" class="f-agent"/><path d="M57 355.5 H68 Q71 355.5 71 358.5 V363.5 Q71 366.5 68 366.5 H62 L58.5 369.5 V366.5 H57 Q54 366.5 54 363.5 V358.5 Q54 355.5 57 355.5 Z" class="f-agent"/><circle cx="59.2" cy="361" r="1.1" class="h-agent"/><circle cx="62.5" cy="361" r="1.1" class="h-agent"/><circle cx="65.8" cy="361" r="1.1" class="h-agent"/><text x="80" y="366.5" font-size="13" class="b">Ask the AI judge</text><text x="314" y="359" font-size="10" class="t-agent b" text-anchor="end">Claude</text><text x="80" y="385" font-size="12" class="t2">judge runs/demo-graph-removed</text><rect x="76" y="422" width="280" height="86" rx="9" class="f-web"/><rect x="86" y="433" width="17" height="14" rx="3" class="f-web"/><path d="M86 437.5 L103 437.5" class="ln s-web thin"/><circle cx="89" cy="435.3" r="0.9" class="h-web"/><circle cx="91.6" cy="435.3" r="0.9" class="h-web"/><text x="112" y="444.5" font-size="13" class="b">Load the runs</text><text x="112" y="463" font-size="12" class="t2">Step 1:</text><text x="112" y="479" font-size="12" class="t2">runs/demo-graph-removed/</text><text x="112" y="495" font-size="12" class="t2">bundle.json</text><rect x="76" y="532" width="280" height="54" rx="9" class="f-web"/><rect x="86" y="543" width="17" height="14" rx="3" class="f-web"/><path d="M86 547.5 L103 547.5" class="ln s-web thin"/><circle cx="89" cy="545.3" r="0.9" class="h-web"/><circle cx="91.6" cy="545.3" r="0.9" class="h-web"/><text x="112" y="554.5" font-size="13" class="b">Freeze it, then read and judge</text><text x="112" y="573" font-size="12" class="t2">Steps 2 to 5</text><path d="M22 96 L44 96" class="ln s-agent thin"/><circle cx="22" cy="96" r="4" class="h-agent"/><path d="M22 190 L44 190" class="ln s-agent thin"/><circle cx="22" cy="190" r="4" class="h-agent"/><path d="M184 148 C184 158 184 155 184 165" class="ln s-n"/><path d="M184 172 L179.2 163 L188.8 163 Z" class="h-n"/><path d="M22 284 L44 284" class="ln s-agent thin"/><circle cx="22" cy="284" r="4" class="h-agent"/><path d="M184 242 C184 252 184 249 184 259" class="ln s-n"/><path d="M184 266 L179.2 257 L188.8 257 Z" class="h-n"/><path d="M22 362 L44 362" class="ln s-agent thin"/><circle cx="22" cy="362" r="4" class="h-agent"/><path d="M184 320 C184 330 184 327 184 337" class="ln s-n"/><path d="M184 344 L179.2 335 L188.8 335 Z" class="h-n"/><path d="M356 440 L378 440" class="ln s-web thin"/><circle cx="378" cy="440" r="4" class="h-web"/><path d="M184 398 C184 408 216 405 216 415" class="ln s-n"/><path d="M216 422 L211.2 413 L220.8 413 Z" class="h-n"/><path d="M356 550 L378 550" class="ln s-web thin"/><circle cx="378" cy="550" r="4" class="h-web"/><path d="M216 508 C216 518 216 515 216 525" class="ln s-n"/><path d="M216 532 L211.2 523 L220.8 523 Z" class="h-n"/><rect x="16" y="604" width="368" height="146" rx="8" class="pl"/><text x="26" y="622" font-size="12" class="t2">A demonstration is a small example, so it is run</text><text x="26" y="638" font-size="12" class="t2">first and frozen afterwards. Freezing writes your</text><text x="26" y="654" font-size="12" class="t2">experiment down, with the date and a fingerprint,</text><text x="26" y="670" font-size="12" class="t2">before you see any results, so that nobody can</text><text x="26" y="686" font-size="12" class="t2">change the test to fit the results later. The</text><text x="26" y="702" font-size="12" class="t2">runner uses the frozen file. No time to run? Skip</text><text x="26" y="718" font-size="12" class="t2">1 to 4: in step 1, load</text><text x="26" y="734" font-size="12" class="t2">examples/recorded/demo-graph-removed/bundle.json.</text></svg>
